          "Sí. Tenía motivos. Los mejores de todos. Y sí, salí de la barra. Y sí, estuve en el vestuario. Pero no fui yo. Lo juro. No fui yo."],
          en:[
          "Motive? None.",
          "No. I just serve drinks.",
          "I had problems with him. Yes. He was blackmailing me. With photos. Intimate photos. For two years.",
          "He was blackmailing me. Yes. With intimate photos. And I found out he was doing the same to my sister. She\'s sixteen. Sixteen. And he had photos of her. Do you understand what that means?",
          "Yes. I had motives. The best of all. And yes, I left the bar. And yes, I was in the locker room. But it wasn\'t me. I swear. It wasn\'t me."]},
        q_2247:{panic:10, es:[
          "En el vestuario. Ya te dije.",
          "En el vestuario. Cambiándome.",
          "En el vestuario. Estaba mojada. Por el agua. Por el agua de la piscina.",
          "En el vestuario. Estaba mojada. Sí. Y ya te dije por qué. Por el agua.",
          "En el vestuario. Estaba mojada porque me había caído en la piscina. Sí. Me caí. Hacia las 22:47. ¿Contento? Ya te dije. Ya te dije todo."],
          en:[
          "In the locker room. I told you.",
          "In the locker room. Changing.",
          "In the locker room. I was wet. From the water. From the pool water.",
          "In the locker room. I was wet. Yes. And I told you why. From the water.",
          "In the locker room. I was wet because I had fallen into the pool. Yes. I fell. Around 10:47. Happy? I already told you. I already told you everything."]},
        q_hiding:{panic:12, es:[
          "No escondo nada.",
          "Nada importante.",
          "Escondo que salí de la barra. Eso es todo.",
          "Escondo que estuve en el vestuario. Y que me mojé. Pero no por caerme. Por otra cosa.",
          "Escondo que cuando salí de la barra, fui al vestuario. Y en el vestuario... me encontré con alguien. Alguien que me ayudó a calmarme. Y no voy a decir quién. Eso es lo único que escondo."],
          en:[
          "I\'m not hiding anything.",
          "Nothing important.",
          "I\'m hiding that I left the bar. That\'s all.",
          "I\'m hiding that I was in the locker room. And that I got wet. But not from falling. From something else.",
          "I\'m hiding that when I left the bar, I went to the locker room. And in the locker room... I met someone. Someone who helped me calm down. And I\'m not going to say who. That\'s the only thing I\'m hiding."]},
        q_disguise:{panic:8, es:[
          "No vi al asesino. Estaba en el vestuario.",
          "No vi nada. Ya te dije.",
          "No vi al asesino. Pero oí algo: alguien corriendo. Hacia el este.",
          "No vi al asesino. Pero sí oí algo. Una voz. Una voz que se cortó de golpe. Como si alguien hubiera apagado un micrófono. Nunca olvidaré eso.",
          "No vi al asesino. Pero oí algo que nadie más oyó: una voz grave. Muy grave. Grave de hombre. Y después un 'clic'. Y después silencio. Y después nada. Como si alguien hubiera apagado algo. Y yo sé cómo suena eso. Yo uso una app para cambiar la voz cuando hago karaoke los viernes."],
          en:[
          "I didn\'t see the killer. I was in the locker room.",
          "I didn\'t see anything. I told you.",
          "I didn\'t see the killer. But I heard something: someone running. Toward the east.",
          "I didn\'t see the killer. But I did hear something. A voice. A voice that cut off suddenly. Like someone had turned off a microphone. I\'ll never forget that.",
          "I didn\'t see the killer. But I heard something no one else heard: a deep voice. Very deep. Man-deep. And then a 'click'. And then silence. And then nothing. Like someone had turned something off. And I know how that sounds. I use an app to change my voice when I do karaoke on Fridays."]},
        q_who:{panic:8, es:[
          "No lo sé.",
          "No tengo idea.",
          "No sé. Pero si tengo que decir algo: no era yo. Porque yo estaba en el vestuario. Y en el vestuario me vio alguien. Alguien que puede confirmarlo.",
          "No sé. Pero no era alta. La persona era baja. Y llevaba la voz cambiada. Y conocía el complejo. Eso descarta a la mayoría.",
          "No sé quién fue. Pero sé que no fui yo. Y sé que la persona que lo hizo usaba una app para cambiar la voz. Porque yo la oí apagarse. Y sé que la persona era baja. Porque la oí correr. Y sé que conocía las salidas. Porque yo conozco las salidas. Y la persona salió por la que yo habría salido."],
          en:[
          "I don\'t know.",
          "I have no idea.",
          "I don\'t know. But if I have to say something: it wasn\'t me. Because I was in the locker room. And in the locker room someone saw me. Someone who can confirm it.",
          "I don\'t know. But it wasn\'t tall. The person was short. And they had their voice changed. And they knew the complex. That rules out most people.",
          "I don\'t know who did it. But I know it wasn\'t me. And I know the person who did it was using an app to change their voice. Because I heard it turn off. And I know the person was short. Because I heard them run. And I know they knew the exits. Because I know the exits. And the person left through the one I would have left through."]},
        q_lie_reaction:{panic:15, es:[
          "…¿qué? No. Eso no es verdad.",
          "Mientes. Y no muy bien.",
          "Mientes. Pero... ¿cómo lo supiste? ¿Cómo supiste lo de la app?",
          "Mientes. Pero da igual. Ya te lo dije. Ya te lo dije todo. Lo de la app. Lo del vestuario. Lo de mi hermana. Ya no me queda nada.",
          "Mientes. Pero ya no me importa. Ya no me importa nada. Ya no me importa lo que creas. Ya no me importa lo que hagas. Ya no me importa nada de esto. ¿Contento? Ya está."],
          en:[
          "…what? No. That\'s not true.",
          "You\'re lying. And not very well.",
          "You\'re lying. But... how did you know? How did you know about the app?",
          "You\'re lying. But it doesn\'t matter. I already told you. I already told you everything. The app. The locker room. My sister. I have nothing left.",
          "You\'re lying. But I don\'t care anymore. I don\'t care about anything anymore. I don\'t care what you believe. I don\'t care what you do. I don\'t care about any of this. Happy? It\'s done."]}
      }
    }
  },

  questions:[
    {id:'q_where', panic:6, text:{es:'¿Dónde estabas la noche del asesinato?', en:'Where were you the night of the murder?'}},
    {id:'q_lastseen', panic:8, text:{es:'¿Cuándo viste a Damián por última vez?', en:'When did you last see Damián?'}},
    {id:'q_relation', panic:3, text:{es:'¿Cuál era tu relación con Damián?', en:'What was your relationship with Damián?'}},
    {id:'q_motive', panic:12, text:{es:'¿Tenías motivos para querer que Damián muriera?', en:'Did you have motives to want Damián dead?'}},
    {id:'q_2247', panic:10, text:{es:'¿Qué estabas haciendo a las 22:47?', en:'What were you doing at 10:47 PM?'}},
    {id:'q_hiding', panic:12, text:{es:'¿Estás escondiendo algo?', en:'Are you hiding something?'}},
    {id:'q_disguise', panic:8, text:{es:'¿Qué viste del asesino?', en:'What did you see of the killer?'}},
    {id:'q_who', panic:8, text:{es:'¿Quién crees que lo mató?', en:'Who do you think killed him?'}},
    {id:'q_lie_reaction', panic:15, only:['__never__'],
      text:{es:'Reacción a mentira', en:'Lie reaction'}},

      text:{es:'¿Por qué tu historia contradice la evidencia?', en:'Why does your story contradict the evidence?'}}
  ],

  evidence:{
    E01:{num:'01',cat:'catPhysical',
      name:{es:'Arma del crimen',en:'Murder weapon'},
      desc:{es:'Un cuchillo de cocina hallado en una papelera cercana a la piscina de saltos. La hoja presenta sangre compatible con la víctima. No hay huellas utilizables.',en:'A kitchen knife found in a trash bin near the diving pool. The blade has blood compatible with the victim. No usable prints.'},
      confront:{
        renata:{panic:6, es:'No lo vi antes. Solo después, cuando lo reportaron.', en:'I didn\'t see it before. Only after, when it was reported.'},
        tomas:{panic:8, es:'Yo trabajo con herramientas. Pero no con cuchillos de cocina.', en:'I work with tools. But not kitchen knives.'},
        paula:{panic:6, es:'Es un cuchillo de la cocina del bar. Cualquiera del staff podía tomarlo.', en:'It\'s a knife from the bar kitchen. Anyone on staff could have taken it.'},
        bruno:{panic:10, es:'Yo no entro a la cocina. Nunca. No es lo mío.', en:'I don\'t go into the kitchen. Never. Not my thing.'},
        camila:{panic:12, es:'Los cuchillos de la cocina están a la vista. Cualquiera puede tomarlos. Yo sirvo tragos, no corto nada.', en:'The kitchen knives are in plain sight. Anyone can take them. I serve drinks, I don\'t cut anything.'}}},
    E02:{num:'02',cat:'catTestimony',
      name:{es:'Descripción contradictoria del asesino',en:'Contradictory description of the killer'},
      desc:{es:'Doce testigos describen al asesino. Seis dicen que era alto. Cuatro dicen que era de estatura media. Dos dicen que era bajo. Todos coinciden: llevaba capucha negra, máscara reflectante y guantes.',en:'Twelve witnesses describe the killer. Six say tall. Four say medium. Two say short. All agree: black hoodie, reflective mask and gloves.'},
      confront:{
        renata:{panic:8, es:'Yo soy alta. Y por eso mismo me fijé: el asesino no era tan alto como parecía.', en:'I\'m tall. And that\'s exactly why I noticed: the killer wasn\'t as tall as they seemed.'},
        tomas:{panic:8, es:'No era alto. Yo lo vi correr. Los zapatos lo hacían parecer alto, pero era bajo.', en:'It wasn\'t tall. I saw them run. The shoes made them look tall, but they were short.'},
        paula:{panic:10, es:'Yo también lo vi. Estatura media. Y caminaba como si le costara. Como si los zapatos no fueran suyos.', en:'I saw them too. Medium height. And they walked like it was hard. Like the shoes weren\'t theirs.'},
        bruno:{panic:8, es:'Yo lo vi bajo. Bajito. Y corriendo como si le pesaran los pies.', en:'I saw them short. Short. And running like their feet weighed them down.'},
        camila:{panic:14, es:'Yo no vi al asesino. Ya te lo dije. Pero si todos dicen que era alto, entonces no era yo. Yo soy baja.', en:'I didn\'t see the killer. I told you. But if everyone says tall, then it wasn\'t me. I\'m short.'}}},
    E03:{num:'03',cat:'catTimeline',contradiction:true,
      name:{es:'Parpadeo de cámaras 3 y 5',en:'Flicker of cameras 3 and 5'},
      desc:{es:'Las cámaras 3 y 5 del sistema de seguridad parpadearon entre las 22:44 y las 22:51. El informe original de Renata Vela reporta un parpadeo "de 30 segundos". El sistema registra 7 minutos.',en:'Cameras 3 and 5 of the security system flickered between 10:44 and 10:51 PM. Renata Vela\'s original report states a "30-second" flicker. The system logs 7 minutes.'},
      confront:{
        renata:{panic:25, es:'Está bien. Manipulé el reporte. Yo vendía accesos a invitados no autorizados. Y si eso salía, yo perdía el trabajo.', en:'Fine. I manipulated the report. I was selling access to unauthorized guests. If that came out, I lost my job.'},
        tomas:{panic:5, es:'Yo no toco el sistema de cámaras. Eso es cosa de seguridad.', en:'I don\'t touch the camera system. That\'s security\'s thing.'},
        paula:{panic:8, es:'Renata manipuló el reporte. Eso explica el tramo. Pero no explica al asesino.', en:'Renata manipulated the report. That explains the window. But it doesn\'t explain the killer.'},
        bruno:{panic:6, es:'Yo no sabía nada de las cámaras. Ni siquiera sabía que había cámaras ahí.', en:'I didn\'t know anything about the cameras. I didn\'t even know there were cameras there.'},
        camila:{panic:10, es:'Renata manipuló el reporte. Renata me vendió el acceso. Pero eso es otra cosa. Eso no me convierte en asesina.', en:'Renata manipulated the report. Renata sold me the access. But that\'s something else. That doesn\'t make me a killer.'}}},
    E04:{num:'04',cat:'catTestimony',contradiction:true,
      name:{es:'Los zapatos de talla grande',en:'The oversized shoes'},
      desc:{es:'Tomás Iriarte y Bruno Aguirre declaran haber visto a la persona quitarse unos zapatos grandes y arrojarlos a un arbusto del estacionamiento. Los zapatos fueron hallados. Talla 45. El asesino medía 1.65m aproximadamente.',en:'Tomás Iriarte and Bruno Aguirre state they saw the person take off large shoes and throw them into a bush in the parking lot. The shoes were found. Size 12 (EU 45). The killer was approximately 1.65m tall.'},
      confront:{
        renata:{panic:8, es:'Zapatos talla 45. Yo calzo 39. Eso no puede ser mío.', en:'Size 45 shoes. I wear 39. Those can\'t be mine.'},
        tomas:{panic:15, es:'Yo vi cuando se los quitó. Y vi cómo corrió después. Corría como alguien bajito. Sin los zapatos.', en:'I saw them take them off. And I saw how they ran after. Like someone short. Without the shoes.'},
        paula:{panic:12, es:'Los zapatos eran parte del disfraz. No eran del asesino. Los usó para alterar su altura aparente.', en:'The shoes were part of the disguise. They weren\'t the killer\'s. They used them to alter their apparent height.'},
        bruno:{panic:14, es:'Yo vi cuando tiró algo al arbusto. Pensé que era basura. Era un zapato. Un zapato enorme.', en:'I saw them throw something into the bush. I thought it was trash. It was a shoe. A huge shoe.'},
        camila:{panic:18, es:'Zapatos talla 45. Yo calzo 37. Y no me los pondría aunque quisiera —me harían tropezar.', en:'Size 45 shoes. I wear 37. And I wouldn\'t wear them even if I wanted to —I\'d trip.'}}},
    E05:{num:'05',cat:'catDigital',
      name:{es:'Registro de llamada eliminada',en:'Deleted call record'},
      desc:{es:'Se recuperó un registro de una llamada entre Camila Ferro y Damián Ríos a las 22:20 PM. Camila declaró inicialmente que no había hablado con Damián esa noche.',en:'A record was recovered of a call between Camila Ferro and Damián Ríos at 10:20 PM. Camila initially stated she had not spoken to Damián that night.'},
      confront:{
        renata:{panic:6, es:'No sabía de esa llamada. Renata no me lo dijo.', en:'I didn\'t know about that call. Renata didn\'t tell me.'},
        tomas:{panic:6, es:'No sabía que Camila lo había llamado. Pero no me sorprende.', en:'I didn\'t know Camila had called him. But it doesn\'t surprise me.'},
        paula:{panic:8, es:'Camila lo llamó. Y después discutieron en persona. Eso es lo que vi.', en:'Camila called him. And then they argued in person. That\'s what I saw.'},
        bruno:{panic:5, es:'No sabía nada de esa llamada.', en:'I knew nothing about that call.'},
        camila:{panic:25, es:'Está bien. Lo llamé. Sí. A las 22:20. Para pedirle que dejara de mandarme fotos. Y él se rió. Y me dijo que fuera a hablar con él en persona.', en:'Fine. I called him. Yes. At 10:20. To ask him to stop sending me photos. And he laughed. And told me to come talk to him in person.'}}},
    E06:{num:'06',cat:'catPhysical',
      name:{es:'Máscara reflectante abandonada',en:'Abandoned reflective mask'},
      desc:{es:'Una máscara reflectante —del tipo usado en fiestas de neón— fue hallada en el fondo de un armario del vestuario de personal. Presenta fibras de sudor. El ADN está siendo analizado. La máscara no estaba en el inventario de props del evento.',en:'A reflective mask —the kind used at neon parties— was found at the back of a staff locker. It has sweat fibers. DNA is being analyzed. The mask was not in the event\'s prop inventory.'},
      confront:{
        renata:{panic:12, es:'No estaba en el inventario. Lo confirmé antes. Lo anoté en mi cuaderno.', en:'It wasn\'t in the inventory. I confirmed that earlier. I wrote it down in my notebook.'},
        tomas:{panic:10, es:'Yo no entré al vestuario de personal esa noche. Nadie me vio ahí.', en:'I didn\'t enter the staff locker room that night. No one saw me there.'},
        paula:{panic:14, es:'Esa máscara es de una sesión mía. La usé para un ensayo. Alguien la tomó de mi equipo.', en:'That mask is from one of my shoots. I used it for a rehearsal. Someone took it from my gear.'},
        bruno:{panic:12, es:'Yo no sé qué es eso. Nunca he visto una máscara así.', en:'I don\'t know what that is. I\'ve never seen a mask like that.'},
        camila:{panic:20, es:'Esa máscara es de la sesión de Paula. Y yo la vi. En el vestuario. Antes de que empezara el evento. Sobre una banca.', en:'That mask is from Paula\'s shoot. And I saw it. In the locker room. Before the event started. On a bench.'}}},
    E07:{num:'07',cat:'catTestimony',
      name:{es:'Testimonio: la voz cortada',en:'Testimony: the cut voice'},
      desc:{es:'Camila Ferro declara haber escuchado una voz grave que se cortó de golpe, seguida de un "clic" y luego silencio. El patrón coincide con el uso de una aplicación de cambio de voz.',en:'Camila Ferro states she heard a deep voice that cut off suddenly, followed by a "click" and then silence. The pattern matches the use of a voice-changing app.'},
      confront:{
        renata:{panic:8, es:'Eso explica la inconsistencia de las voces. Yo no escuché nada. Estaba en la sala.', en:'That explains the voice inconsistency. I didn\'t hear anything. I was in the room.'},
        tomas:{panic:8, es:'Yo escuché la voz grave. Antes del clic. Y después nada.', en:'I heard the deep voice. Before the click. And then nothing.'},
        paula:{panic:10, es:'Una voz cambiada. Eso explica por qué algunos testigos dicen grave y otros agudo.', en:'A changed voice. That explains why some witnesses say deep and others high.'},
        bruno:{panic:10, es:'Yo no oí nada. Estaba en el baño.', en:'I didn\'t hear anything. I was in the bathroom.'},
        camila:{panic:22, es:'Yo la oí. Y sé cómo suena. Yo uso una app así para karaoke. Y esa noche escuché el mismo 'clic' cuando se apaga.', en:'I heard it. And I know how it sounds. I use an app like that for karaoke. And that night I heard the same \'click\' when it turns off.'}}},
    E08:{num:'08',cat:'catDigital',
      name:{es:'Registro de acceso al vestuario de personal',en:'Staff locker room access log'},
      desc:{es:'El sistema de tarjetas del vestuario de personal registra un acceso con la tarjeta de Camila Ferro a las 22:36 y una salida a las 22:51. Camila declaró haber salido a las 22:40.',en:'The staff locker room card system logs an entry with Camila Ferro\'s card at 10:36 PM and an exit at 10:51. Camila stated she left at 10:40.'},
      confront:{
        renata:{panic:8, es:'La tarjeta de Camila entró a las 22:36. Y salió a las 22:51. Quince minutos, no cuatro.', en:'Camila\'s card entered at 10:36. And left at 10:51. Fifteen minutes, not four.'},
        tomas:{panic:6, es:'No sabía eso. Pero no me sorprende.', en:'I didn\'t know that. But it doesn\'t surprise me.'},
        paula:{panic:10, es:'Quince minutos. Eso coincide con mi ventana de cuatro minutos vista desde el otro lado.', en:'Fifteen minutes. That matches my four-minute window seen from the other side.'},
        bruno:{panic:6, es:'Yo no tengo tarjeta del vestuario de personal. No trabajo ahí.', en:'I don\'t have a card to the staff locker room. I don\'t work there.'},
        camila:{panic:25, es:'Está bien. Quince minutos. No cuatro. Y sí, me mojé. Pero no me caí a la piscina. Me metí al agua a propósito. Para lavarme. Porque tenía sangre en el brazo. Y no era mía.', en:'Fine. Fifteen minutes. Not four. And yes, I got wet. But I didn\'t fall into the pool. I got in on purpose. To wash myself. Because I had blood on my arm. And it wasn\'t mine.'}}},
    E09:{num:'09',cat:'catTestimony',contradiction:true,
      name:{es:'Testimonio: el pelo mojado',en:'Testimony: the wet hair'},
      desc:{es:'Paula Quintana declara haber visto a Camila Ferro saliendo del área de la piscina de saltos a las 22:50 con el pelo mojado, cuando Camila declaró estar en el vestuario en ese momento.',en:'Paula Quintana states she saw Camila Ferro leaving the diving pool area at 10:50 PM with wet hair, when Camila stated she was in the locker room at that time.'},
      confront:{
        renata:{panic:10, es:'Paula lo vio saliendo. Eso es lo que importa. Con el pelo mojado.', en:'Paula saw her leaving. That\'s what matters. With wet hair.'},
        tomas:{panic:10, es:'Paula vio a Camila saliendo. Y yo la vi entrando al vestuario a las 22:36. Los dos la vimos.', en:'Paula saw Camila leaving. And I saw her entering the locker room at 10:36. We both saw her.'},
        paula:{panic:18, es:'Yo la vi. Con el pelo mojado. Saliendo del área de la piscina de saltos. A las 22:50.', en:'I saw her. With wet hair. Leaving the diving pool area. At 10:50.'},
        bruno:{panic:6, es:'Yo no vi a Camila. Yo estaba en el baño.', en:'I didn\'t see Camila. I was in the bathroom.'},
        camila:{panic:30, es:'Paula me vio. Sí. Estaba saliendo del área. Con el pelo mojado. Porque me metí al agua. Para lavarme. Ya te lo dije. Ya te lo dije todo.', en:'Paula saw me. Yes. I was leaving the area. With wet hair. Because I got in the water. To wash myself. I already told you. I already told you everything.'}}},
    E10:{num:'10',cat:'catPhysical',
      name:{es:'Grabadora de Paula',en:'Paula\'s recorder'},
      desc:{es:'En la mochila de Paula Quintana se halló una grabadora digital con seis meses de conversaciones de Damián Ríos. No contiene nada relacionado con el asesinato.',en:'A digital recorder was found in Paula Quintana\'s backpack with six months of Damián Ríos\'s conversations. It contains nothing related to the murder.'},
      confront:{
        renata:{panic:6, es:'No sabía que grababa. Pero eso explica algunas cosas que él decía.', en:'I didn\'t know she recorded. But that explains some things he said.'},
        tomas:{panic:6, es:'Paula grababa. Yo no. Nunca. Yo no tengo nada que grabar.', en:'Paula recorded. I didn\'t. Never. I have nothing to record.'},
        paula:{panic:14, es:'Sí. Esa grabadora es mía. Y no tiene nada del asesinato. Porque yo no lo maté.', en:'Yes. That recorder is mine. And it has nothing about the murder. Because I didn\'t kill him.'},
        bruno:{panic:6, es:'No sabía que grababa. Me alegro de no haber dicho nada estúpido.', en:'I didn\'t know she recorded. I\'m glad I didn\'t say anything stupid.'},
        camila:{panic:14, es:'Paula grababa. ¿Y? Yo no dije nada en esas grabaciones. Nunca hablé con él cerca de ella.', en:'Paula recorded. So what? I didn\'t say anything in those recordings. I never talked to him near her.'}}},
    E11:{num:'11',cat:'catDigital',
      name:{es:'Análisis de la máscara',en:'Mask analysis'},
      desc:{es:'El sudor en la máscara reflectante contiene ADN de una persona con marcadores compatibles con Camila Ferro. La probabilidad es de 1 en 8.000. No es una identificación positiva.',en:'The sweat on the reflective mask contains DNA from a person with markers compatible with Camila Ferro. The probability is 1 in 8,000. It is not a positive identification.'},
      confront:{
        renata:{panic:14, es:'La máscara tiene ADN de Camila. Eso no es coincidencia. Pero tampoco es prueba.', en:'The mask has Camila\'s DNA. That\'s not a coincidence. But it\'s not proof either.'},
        tomas:{panic:10, es:'Si la máscara tiene ADN de Camila, entonces fue ella. ¿O no? Yo no entiendo de eso.', en:'If the mask has Camila\'s DNA, then it was her. Or not? I don\'t understand that stuff.'},
        paula:{panic:12, es:'La máscara es de mi sesión. Es normal que tenga ADN de quien la tocó. Pero Camila la tocó. La vi en la banca del vestuario antes del evento.', en:'The mask is from my shoot. It\'s normal it has DNA from whoever touched it. But Camila touched it. I saw it on the locker room bench before the event.'},
        bruno:{panic:8, es:'La máscara es de Camila. Está claro. Pero yo no soy detective.', en:'The mask is Camila\'s. It\'s clear. But I\'m not a detective.'},
        camila:{panic:25, es:'La máscara tiene mi ADN porque la toqué. Antes del evento. La moví porque estaba en el paso. Eso es todo. Eso es todo lo que tengo que decir sobre esa máscara.', en:'The mask has my DNA because I touched it. Before the event. I moved it because it was in the way. That\'s all. That\'s all I have to say about that mask.'}}},
    E12:{num:'12',cat:'catTestimony',
      name:{es:'Testimonio del flash',en:'Testimony of the flash'},
      desc:{es:'Tres testigos declaran haber visto un flash de luz blanca durante los segundos previos al asesinato. Ninguno de ellos pudo ver al asesino durante ese flash.',en:'Three witnesses state they saw a flash of white light during the seconds before the murder. None of them could see the killer during that flash.'},
      confront:{
        renata:{panic:8, es:'El flash. Lo vi en el monitor antes del parpadeo. Pensé que era la cámara de Paula.', en:'The flash. I saw it on the monitor before the flicker. I thought it was Paula\'s camera.'},
        tomas:{panic:12, es:'El flash me cegó. Cuando volví a mirar, ya estaba el caos.', en:'The flash blinded me. When I looked again, it was already chaos.'},
        paula:{panic:16, es:'El flash no era mío. Mi cámara tiene un flash cálido. El del evento era blanco frío. Es otro tipo de flash.', en:'The flash wasn\'t mine. My camera has a warm flash. The one at the event was cold white. It\'s a different type of flash.'},
        bruno:{panic:8, es:'Yo vi el flash desde el bar. Después oí los gritos.', en:'I saw the flash from the bar. Then I heard the screams.'},
        camila:{panic:20, es:'El flash no era de Paula. Yo conozco el flash de Paula. Es cálido. El flash de esa noche era blanco. Y era de una cámara pequeña. Como la que alguien podría esconder en el bolsillo.', en:'The flash wasn\'t Paula\'s. I know Paula\'s flash. It\'s warm. The flash that night was white. And it was from a small camera. Like one someone could hide in their pocket.'}}},
    E13:{num:'13',cat:'catTimeline',
      name:{es:'Registro de salida del estacionamiento',en:'Parking lot exit log'},
      desc:{es:'El registro del estacionamiento muestra que el auto de Camila Ferro no salió del complejo esa noche. Camila vivía a 800 metros y llegó caminando.',en:'The parking lot log shows Camila Ferro\'s car did not leave the complex that night. Camila lived 800 meters away and arrived on foot.'},
      confront:{
        renata:{panic:6, es:'Camila llegó caminando. Eso no cambia nada.', en:'Camila arrived on foot. That changes nothing.'},
        tomas:{panic:6, es:'Yo no sabía eso. Pero es lógico. Ella vive cerca.', en:'I didn\'t know that. But it makes sense. She lives nearby.'},
        paula:{panic:8, es:'Camila caminó a su casa. Eso significa que después del asesinato, se fue a pie. Y no dejó rastro en el estacionamiento.', en:'Camila walked home. That means after the murder, she left on foot. And left no trace in the parking lot.'},
        bruno:{panic:6, es:'Yo me fui en mi auto. Pero el auto de Camila no se movió. Eso lo vi.', en:'I left in my car. But Camila\'s car didn\'t move. I saw that.'},
        camila:{panic:16, es:'Mi auto no se movió. Yo llegué caminando. Y me fui caminando. Y eso es exactamente lo que hice. Llegué caminando. Y me fui caminando.', en:'My car didn\'t move. I arrived on foot. And I left on foot. And that\'s exactly what I did. Arrived on foot. Left on foot.'}}},
    E14:{num:'14',cat:'catDigital',contradiction:true,
      name:{es:'Historial de la app de voz',en:'Voice app history'},
      desc:{es:'El teléfono de Camila Ferro muestra el uso de una aplicación de cambio de voz entre las 22:30 y las 22:49 PM. La app fue cerrada abruptamente a las 22:49.',en:'Camila Ferro\'s phone shows use of a voice-changing app between 10:30 and 10:49 PM. The app was closed abruptly at 10:49.'},
      confront:{
        renata:{panic:12, es:'La app de voz se cerró a las 22:49. Dos minutos después del asesinato. Eso no es coincidencia.', en:'The voice app closed at 10:49. Two minutes after the murder. That\'s not a coincidence.'},
        tomas:{panic:10, es:'Eso explica el clic que Camila escuchó. Es la app apagándose.', en:'That explains the click Camila heard. It\'s the app turning off.'},
        paula:{panic:14, es:'La app. Eso cierra el caso. Todo apunta a Camila.', en:'The app. That closes the case. Everything points to Camila.'},
        bruno:{panic:8, es:'No entiendo esas cosas. Pero si la app estaba activa durante el asesinato, entonces...', en:'I don\'t understand those things. But if the app was active during the murder, then...'},
        camila:{panic:30, es:'Está bien. La app estaba activa. Y yo estaba en el área. Y yo usé la máscara. Y yo tomé el cuchillo. Y yo discutí con él. Pero no fui yo. No fui yo. No fui yo.', en:'Fine. The app was active. And I was in the area. And I used the mask. And I took the knife. And I argued with him. But it wasn\'t me. It wasn\'t me. It wasn\'t me.'}}},
    E15:{num:'15',cat:'catTestimony',
      name:{es:'Confesión de Camila Ferro',en:'Camila Ferro\'s confession'},
      desc:{es:'Camila Ferro confiesa el asesinato de Damián Ríos durante el interrogatorio. Declara que usó la máscara reflectante del equipo de Paula, un par de zapatos talla 45 del lost-and-found, y una app de cambio de voz en su teléfono. Su motivo: dos años de chantaje con fotos íntimas, y el descubrimiento de que Damián estaba haciendo lo mismo con su hermana de 16 años.',en:'Camila Ferro confesses to the murder of Damián Ríos during interrogation. She states she used the reflective mask from Paula\'s equipment, a pair of size-45 shoes from lost-and-found, and a voice-changing app on her phone. Her motive: two years of blackmail with intimate photos, and the discovery that Damián was doing the same to her 16-year-old sister.'},
      confront:{
        renata:{panic:4, es:'Ella lo confesó. Bien. Se acabó.', en:'She confessed. Good. It\'s over.'},
        tomas:{panic:4, es:'Ella lo hizo. Y yo la vi saliendo. Lo sabía. Lo sabía.', en:'She did it. And I saw her leaving. I knew it. I knew it.'},
        paula:{panic:6, es:'Camila. Lo sabía. Lo vi todo. Lo vi todo.', en:'Camila. I knew it. I saw everything. I saw everything.'},
        bruno:{panic:4, es:'Camila. La bartender. Nunca me lo esperé.', en:'Camila. The bartender. I never expected it.'},
        camila:{panic:20, es:'Sí. Fui yo. Sí. Y no me arrepiento. No me arrepiento de haberlo hecho. Me arrepiento de no haberlo hecho antes.', en:'Yes. It was me. Yes. And I don\'t regret it. I don\'t regret doing it. I regret not doing it sooner.'}}}

  fileSections:{
    S01:{title:{es:'SECCIÓN 01 — LA VENDEDORA DE ACCESOS',en:'SECTION 01 — THE ACCESS SELLER'},
      body:{es:'Renata vendía accesos al complejo. Lo sé porque yo era uno de sus clientes. Pagué tres veces para entrar sin pasar por la entrada principal. La tercera vez vi a alguien más usando el mismo sistema. Alguien que no era un invitado. Alguien que se movía como si conociera el complejo demasiado bien.\n\nEsa persona no era Renata. Renata no se mueve así.\n\nAnoté la fecha. La hora. Lo que llevaba puesto. No sé por qué lo anoté. Pero lo anoté.',
            en:'Renata was selling access to the complex. I know because I was one of her clients. I paid three times to get in without going through the main entrance. The third time I saw someone else using the same system. Someone who wasn\'t a guest. Someone who moved like they knew the complex too well.\n\nThat person wasn\'t Renata. Renata doesn\'t move like that.\n\nI wrote down the date. The time. What they were wearing. I don\'t know why I wrote it. But I wrote it.'}},
    S02:{title:{es:'SECCIÓN 02 — EL FOTÓGRAFO',en:'SECTION 02 — THE PHOTOGRAPHER'},
      body:{es:'Paula lleva seis meses grabando a Damián. Lo sé porque me lo dijo. Le dije que dejara de hacerlo. Ella me dijo que no podía.\n\nPaula no es peligrosa. Paula es obsesiva. Pero no peligrosa.\n\nSin embargo, el flash de esa noche no era de su cámara. Yo conozco el flash de Paula. Es cálido. El flash de esa noche era blanco. Frío. De una cámara distinta.\n\nAlguien más tenía una cámara esa noche. Y la usó para cegar a los testigos.',
            en:'Paula has been recording Damián for six months. I know because she told me. I told her to stop. She told me she couldn\'t.\n\nPaula isn\'t dangerous. Paula is obsessive. But not dangerous.\n\nHowever, the flash that night wasn\'t from her camera. I know Paula\'s flash. It\'s warm. The flash that night was white. Cold. From a different camera.\n\nSomeone else had a camera that night. And used it to blind the witnesses.'}},
    S03:{title:{es:'SECCIÓN 03 — EL SOCIO',en:'SECTION 03 — THE PARTNER'},
      body:{es:'Bruno es un bocón. Amenazó a Damián delante de todos. Lo hizo porque estaba enojado. Nada más.\n\nBruno no es un asesino. Bruno es un cobarde que grita. Lo conozco desde hace años. Cuando la situación se pone seria, Bruno se esconde. Se va al baño. Vomita.\n\nY eso fue exactamente lo que hizo esa noche. Estuvo veinte minutos en el baño. Y cuando salió, ya había pasado todo.\n\nBruno no es peligroso. Bruno es predecible.',
            en:'Bruno is a loudmouth. He threatened Damián in front of everyone. He did it because he was angry. Nothing more.\n\nBruno isn\'t a killer. Bruno is a coward who yells. I\'ve known him for years. When things get serious, Bruno hides. Goes to the bathroom. Throws up.\n\nAnd that\'s exactly what he did that night. He was in the bathroom for twenty minutes. And when he came out, everything had already happened.\n\nBruno isn\'t dangerous. Bruno is predictable.'}},
    S04:{title:{es:'SECCIÓN 04 — LA BARTENDER',en:'SECTION 04 — THE BARTENDER'},
      body:{es:'Camila conoce el complejo mejor que nadie. Lleva cuatro años trabajando aquí. Sabe qué cámaras funcionan y cuáles no. Sabe cuándo cambian los turnos. Sabe por dónde salir sin que te vean.\n\nCamila ha estado rara las últimas semanas. Más callada. Más atenta. Como si estuviera esperando algo.\n\nY Damián la miraba distinto. Como si tuviera algo sobre ella. Como si la estuviera apretando.\n\nEsa noche, cuando discutieron, ella no lloró. No gritó. Se quedó quieta. Como si estuviera tomando una decisión. Y eso fue lo que más me asustó.',
            en:'Camila knows the complex better than anyone. She\'s worked here four years. She knows which cameras work and which don\'t. She knows when the shifts change. She knows where to exit without being seen.\n\nCamila has been strange these last weeks. Quieter. More watchful. Like she was waiting for something.\n\nAnd Damián looked at her differently. Like he had something on her. Like he was squeezing her.\n\nThat night, when they argued, she didn\'t cry. Didn\'t yell. She just stood still. Like she was making a decision. And that was what scared me the most.'}},
    S05:{title:{es:'SECCIÓN 05 — NOTA FINAL',en:'SECTION 05 — FINAL NOTE'},final:true,
      body:{es:'No hay mensaje final. No hay nota. No hay despedida.\n\nSolo queda lo que sabemos:\n\nRenata vendió accesos. Manipuló las cámaras. No es la asesina.\nTomás vendía accesos. Fue al cuarto de mantenimiento con una excusa falsa. No es el asesino.\nPaula grababa conversaciones. No es la asesina.\nBruno amenazó a Damián en público. No es el asesino.\n\nCamila.\n\nCamila discutió con Damián a las 22:30. Bajo. Muy bajo.\nCamila entró al vestuario a las 22:36. Salió a las 22:51.\nCamila tenía el pelo mojado a las 22:50. Dijo que se cayó a la piscina.\nCamila tenía la app de voz activa entre 22:30 y 22:49.\nCamila tiene acceso a la máscara de Paula. A los zapatos talla 45. A los guantes.\nCamila conoce el complejo. Sabe por dónde salir. Sabe cuándo cambian los turnos.\n\nY Camila tenía el mejor motivo de todos. El único motivo que no se puede negociar.\n\nSu hermana. Dieciséis años. Damián también le mandaba fotos.\n\n— El investigador',
            en:'There is no final message. No note. No farewell.\n\nOnly what we know remains:\n\nRenata sold access. Manipulated the cameras. She\'s not the killer.\nTomás sold access. Went to the maintenance room with a false excuse. Not the killer.\nPaula recorded conversations. Not the killer.\nBruno threatened Damián publicly. Not the killer.\n\nCamila.\n\nCamila argued with Damián at 10:30. Quietly. Very quietly.\nCamila entered the locker room at 10:36. Exited at 10:51.\nCamila had wet hair at 10:50. Said she fell into the pool.\nCamila had the voice app active between 10:30 and 10:49.\nCamila has access to Paula\'s mask. To the size-45 shoes. To the gloves.\nCamila knows the complex. Knows where to exit. Knows when shifts change.\n\nAnd Camila had the best motive of all. The only motive that can\'t be negotiated.\n\nHer sister. Sixteen. Damián was sending photos to her too.\n\n— The Investigator'}}
  },

  ending:{
    solved:{
      murdererName:'CAMILA FERRO',
      murdererAge:29,
      motive:{es:'Camila Ferro había sido chantajeada por Damián Ríos durante dos años con fotografías íntimas. Cuando descubrió que Damián estaba haciendo exactamente lo mismo con su hermana de 16 años, decidió actuar. No fue un crimen premeditado con meses de antelación: fue una decisión tomada a las 22:30 de esa misma noche, cuando Damián se rió de ella en la cara. Aprovechó que conocía el complejo, que tenía acceso al equipo de Paula, que tenía tarjeta del vestuario de personal, y que sabía cuándo cambiaban los turnos.',

let audioCtx = null;
function ac(){
  if(!gameState.settings.sound) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}
function tone(freq, dur, type, vol, delay){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.05, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const SFX = {
  click(){ tone(420,0.05,'square',0.035); },
  ev(){ tone(660,0.1,'sine',0.06); tone(990,0.16,'sine',0.05,0.09); },
  contradiction(){ tone(180,0.18,'sawtooth',0.06); tone(140,0.28,'sawtooth',0.05,0.12); },
  warn(){ tone(110,0.3,'sawtooth',0.06); },
  panic(){ tone(300,0.09,'triangle',0.05); tone(460,0.09,'triangle',0.05,0.07); },
  calm(){ tone(500,0.1,'sine',0.04); tone(400,0.14,'sine',0.035,0.08); },
  solved(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.35,'sine',0.06,i*0.13)); },
  wrong(){ [340,260,190,130].forEach((f,i)=>tone(f,0.3,'sawtooth',0.06,i*0.13)); },
  lead(){ tone(880,0.08,'sine',0.05); tone(1174,0.12,'sine',0.045,0.08); },
  decode(){ tone(1200,0.08,'sine',0.05); tone(1600,0.12,'sine',0.045,0.07); tone(2000,0.18,'sine',0.04,0.14); },
  glitch(){ tone(90,0.12,'sawtooth',0.05); tone(60,0.18,'square',0.04,0.08); }

function panicBand(p){ if(p<=25) return 0; if(p<=50) return 1; if(p<=75) return 2; if(p<=99) return 3; return 4; }

  if(p<=25) return 'stCalm';
  if(p<=50) return 'stUneasy';

  return 'stBreaking';

function blockBar(p){
  const n = Math.max(0, Math.min(10, Math.round(p/10)));
  return '█'.repeat(n) + '░'.repeat(10-n);
}
function pick(arr, band){ if(!arr||!arr.length) return t('nothingToSay'); return arr[Math.min(band, arr.length-1)]; }
function fmt(str, obj){
  let out = str;
  Object.keys(obj||{}).forEach(k=>{ out = out.split('{'+k+'}').join(obj[k]); });
  return out;
}
function toast(msg, kind){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind?(' '+kind):'');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, 3400);
}
function addScore(n, silent){
  const cs = currentCaseState();
  if(!cs) return;
  cs.score = Math.max(0, cs.score + n);
  if(!silent){
    if(n>0) toast(fmt(t('scorePlus'), {n:n}), '');
    else if(n<0) toast(fmt(t('scoreMinus'), {n:n}), 'red');
  }
  updateTopbar();
}
function addEvidence(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return false;
  if(cs.evidence.includes(id)) return false;
  const e = cd.evidence[id];
  if(!e) return false;
  cs.evidence.push(id);
  if(e.contradiction && !cs.contradictions.includes(id)) cs.contradictions.push(id);
  if(e.contradiction) SFX.contradiction(); else SFX.ev();
  toast(t('evDiscovered') + ' — #' + e.num, e.contradiction ? 'red' : '');
  addScore(10, true);
  if(e.contradiction){
    setTimeout(()=>toast(t('contradictionDetected'), 'red'), 400);
    addScore(15, true);
  }
  cd.timeline.forEach(tl=>{ if(tl.req===id && !cs.timeline.includes(tl.id)) cs.timeline.push(tl.id); });
  updateFileSections();
  saveCase(cd.id);
  return true;
}
function updateFileSections(){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const maps = {
    case001:{S01:'E03', S02:'E04', S03:'E05', S04:'E06'},
    case002:{S01:'E08', S02:'E05', S03:'E06', S04:'E07'},
    case003:{S01:'E03', S02:'E04', S03:'E05', S04:'E06'}
  };
  const activeMap = maps[cd.id] || {};
  Object.keys(activeMap).forEach(s=>{
    if(cs.evidence.includes(activeMap[s]) && !cs.fileSections.includes(s)){
      cs.fileSections.push(s);
    }
  });
  const base = ['S01','S02','S03','S04'];
  if(base.every(s=>cs.fileSections.includes(s)) && !cs.fileSections.includes('S05')){
    cs.fileSections.push('S05');
  }
}
function addLead(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  if(cs.leads.includes(id)) return;
  const ld = cd.leads[id];
  if(!ld) return;
  cs.leads.push(id);
  raiseSuspicion(ld.target, 8);
  SFX.lead();
  toast(t('newLead'), 'amber');
}
function raiseSuspicion(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  s.suspicion = Math.max(0, Math.min(100, s.suspicion + n));
}
function addPanic(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  const before = s.panic;
  s.panic = Math.max(0, Math.min(100, s.panic + n));
  if(s.panic > before && n > 0){
    SFX.panic();
    raiseSuspicion(sid, Math.round(n/3));
  } else if(s.panic < before && n < 0){
    SFX.calm();
    // No cambiar sospecha al bajar el pánico.
  }
  checkBreaks(sid);
}
function checkBreaks(sid){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const list = cd.breaks[sid] || [];
  const p = cs.suspects[sid].panic;
  list.forEach((b, i)=>{
    const key = sid + '_' + i;
    if(p >= b.at && !cs.fired[key]){
      cs.fired[key] = true;
      if(b.msg) pushLog(sid, {kind:'sys', text:b.msg, cls:'amber'});
      if(b.ev){
        const isNew = addEvidence(b.ev);
        if(isNew && b.lie){
          setTimeout(()=>toast(t('lieDetected'), 'red'), 500);
          addScore(20, true);
        }
      }
      if(b.lead) addLead(b.lead);
      if(b.confession){
        pushLog(sid, {kind:'sys', text:{es:'CONFESIÓN DESBLOQUEADA — '+cd.suspects[sid].name+' ha dicho todo lo que sabe.', en:'CONFESSION UNLOCKED — '+cd.suspects[sid].name+' has said everything they know.'}, cls:''});
        toast(t('confessionUnlocked'), '');
        addScore(25, true);
      }
    }
  });
}
function pushLog(sid, entry){
  const cs = currentCaseState();
  if(!cs) return;
  if(!cs.logs[sid]) cs.logs[sid] = [];
  cs.logs[sid].push(entry);
}

/* LIE MECHANIC */
function attemptLie(sid, lieKey){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cs || !cd.lies) return;
  if(!cs.lieAttempts[sid]) cs.lieAttempts[sid] = {};
  if(!cs.lieResistance[sid]) cs.lieResistance[sid] = 0;

  if(cs.lieAttempts[sid][lieKey] === 'used'){
    toast(t('lieAlreadyUsed'), 'amber');
    return;
  }

  const s = cs.suspects[sid];
  const lieData = cd.lies[lieKey];
  if(!lieData) return;

  let chance = 50;
  if(s.panic > 40) chance += 25;
  const suspectContra = Object.keys(cd.evidence).filter(id => cd.evidence[id].contradiction && cs.evidence.includes(id)).length;
  if(suspectContra > 0) chance += 15;
  if(cs.lieResistance[sid] >= 30) chance -= 30;
  if(cs.lieResistance[sid] >= 60) chance -= 60;
  chance = Math.max(5, Math.min(95, chance));

  const roll = Math.random() * 100;
  const success = roll < chance;

  const lieResponse = success ? lieData.success : lieData.fail;

  pushLog(sid, {
    kind:'lie',
    text:{
      es:'[MENTIRA] ' + L(lieData.name),
      en:'[LIE] ' + L(lieData.name)
    }
  });
  pushLog(sid, {
    kind:'sys',
    text:{es: 'Su reacción: ' + lieResponse.es, en: 'Their reaction: ' + lieResponse.en},
    cls: success ? 'amber' : 'red'
  });

  if(success){
    cs.lieAttempts[sid][lieKey] = 'used';
    addPanic(sid, 18);
    raiseSuspicion(sid, 12);
    SFX.lead();
    toast(t('lieSuccess'), 'amber');
    if(sid === 'camila' && !cs.leads.includes('L2')){
      addLead('L2');
    }
  } else {
    cs.lieAttempts[sid][lieKey] = 'used';
    cs.lieResistance[sid] += 25;
    addScore(-5, true);
    SFX.wrong();
    toast(t('lieFail'), 'red');
  }
  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}

/* WITNESS RECONSTRUCTION */
function toggleWitnessObservation(obs){
  const cs = currentCaseState();
  if(!cs) return;
  if(!cs._witnessSelection) cs._witnessSelection = [];
  const idx = cs._witnessSelection.indexOf(obs);
  if(idx === -1) cs._witnessSelection.push(obs);
  else cs._witnessSelection.splice(idx, 1);
  render();
}
function submitWitnessGroup(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cs || !cd.witnessPatterns) return;
  const sel = cs._witnessSelection || [];
  if(sel.length < 2){
    toast(t('witnessSelectHint'), 'amber');
    return;
  }
  let matched = null;
  cd.witnessPatterns.forEach(wp=>{
    const wpSet = new Set(wp.observations);
    if(sel.length === wp.observations.length && sel.every(o=>wpSet.has(o))){
      matched = wp;
    }
  });
  if(matched){
    if(!cs.witnessPatternsFound.includes(matched.id)){
      cs.witnessPatternsFound.push(matched.id);
      SFX.decode();
      toast(t('witnessPatternFound') + ' — ' + L(matched.name), 'purple');
      addScore(20, true);
    }
    cs._witnessSelection = [];
  } else {
    SFX.warn();
    toast(t('witnessInconsistent'), 'red');
    addScore(-2, true);
    cs._witnessSelection = [];
  }
  saveCase(cd.id);
  render();
}
function clearWitnessSelection(){
  const cs = currentCaseState();
  if(cs) cs._witnessSelection = [];
  render();
}
function tabWitnesses(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd.witnesses) return '';
  const sel = cs._witnessSelection || [];
  let html = '';
  cd.witnesses.forEach(w=>{
    html += `<div class="evcard">
      <div class="evhead">
        <div><div class="evnum">${esc(w.id)}</div><div class="evname">${esc(L(w.name))}</div></div>
      </div>
      <div class="evdesc" style="font-style:italic">${esc(L(w.text))}</div>
    </div>`;
  });
  const allObs = [];
  cd.witnesses.forEach(w=>w.observations.forEach(o=>{ if(!allObs.includes(o)) allObs.push(o); }));
  let obsHtml = allObs.map(o=>{
    const isSel = sel.includes(o);
    return `<button class="qbtn ${isSel?'lead':''}" data-act="toggle-obs" data-obs="${o}" style="padding:8px 12px;min-height:auto">${isSel?'✓ ':''}${esc(L(OBSERVATION_LABELS[o]||{es:o,en:o}))}</button>`;
  }).join('');
  let patternsHtml = '';
  cd.witnessPatterns.forEach(wp=>{
    const found = cs.witnessPatternsFound.includes(wp.id);
    if(found){
      patternsHtml += `<div class="evcard" style="border-left-color:var(--purple)">
        <div class="evnum" style="color:var(--purple)">${esc(wp.id)}</div>
        <div class="evname">${esc(L(wp.name))}</div>
        <div class="evdesc">${esc(L(wp.desc))}</div>
      </div>`;
    } else {
      patternsHtml += `<div class="locked-ev">${esc(wp.id)} — ████████████ BLOQUEADO</div>`;
    }
  });
  return `<div class="panel">
    <div class="panel-title purple">${esc(t('witnessTitle'))}</div>
    <p class="dim small" style="margin-bottom:12px">${esc(t('witnessSub'))}</p>
    ${html}
  </div>
  <div class="panel">
    <div class="panel-title">OBSERVACIONES</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${obsHtml}</div>
    <div class="row mt16">
      <button class="btn small" data-act="clear-obs">LIMPIAR</button>
      <button class="btn small green" data-act="submit-obs">${esc(t('witnessPatternFound'))}</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title purple">PATRONES</div>
    ${patternsHtml}
  </div>`;
}

function render(){
  updateTopbar();

  switch(gameState.screen){

function getCaseStatus(caseId){
  const st = loadCase(caseId);
  if(!st || !st.started) return 'available';
  if(st.ending) return 'complete';
  return 'progress';
}
function viewDatabase(){
  const cards = Object.keys(CASES).map(id=>{
    const cd = CASES[id];
    const status = getCaseStatus(id);
    const statusKey = status==='complete' ? 'statusCompleted' : status==='progress' ? 'statusProgress' : 'statusAvailable';
    const cls = status==='complete' ? 'complete' : status==='progress' ? 'progress' : 'available';
    const st = loadCase(id);
    const progress = st ? (st.evidence?st.evidence.length:0) + '/10' : '0/10';
    return `<div class="casecard" style="--acc:${cd.accent}" data-act="open-case" data-cid="${id}">
      <div class="cnum">${esc(t('caseNo'))} #${cd.number}</div>
      <div class="ctitle">${esc(L(cd.title))}</div>
      <div class="cdesc">${esc(L(cd.description))}</div>
      <span class="cstatus ${cls}">${esc(t(statusKey))}</span>
      <div class="srow" style="margin-top:12px"><span>${esc(t('caseProgress'))}</span><b>${progress}</b></div>
      <button class="btn small mt10" data-act="open-case" data-cid="${id}">${esc(t('openCase'))} ▶</button>
    </div>`;
  }).join('');

  const locked = LOCKED_CASES.map(lc=>`
    <div class="casecard locked" style="--acc:#26383f">
      <div class="cnum">${esc(t('caseNo'))} #${lc.number}</div>
      <div class="ctitle">${esc(L(lc.title))}</div>

    </div>`).join('');

  return `
  <div class="panel">
    <div class="panel-title">${esc(t('caseDatabase'))} <span class="dim">${esc(t('caseDatabaseSub'))}</span></div>
    <div class="grid cases">${cards}${locked}</div>

    <button class="btn" data-act="menu">${esc(t('backToMenu'))}</button>

  </div>`;
}

function viewCaseScreen(){
  const cd = currentCase(); const cs = currentCaseState();

  switch(cs.screen){

/* --- Modificación clave: preguntas filtradas por minPanic / maxPanic + indicador de pánico --- */
function viewInterrogation(){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  if(!sid){ cs.screen='suspects'; return viewSuspects(); }
  const p = cd.suspects[sid];
  const s = cs.suspects[sid];
  const critical = s.panic >= 76;

  const qs = cd.questions.filter(q=>{
    if(q.only && !q.only.includes(sid)) return false;
    if(q.cond === 'contradictions' && cs.contradictions.length === 0) return false;
    if(q.reqEv && !cs.evidence.includes(q.reqEv)) return false;
    if(q.reqLead && !cs.leads.includes(q.reqLead)) return false;
    if(q.minPanic !== undefined && s.panic < q.minPanic) return false;
    if(q.maxPanic !== undefined && s.panic > q.maxPanic) return false;
    return true;
  });
  const qHtml = qs.map(q=>{
    const times = s.asked[q.id]||0;
    const cls = 'qbtn' + (times?' used':'') + (q.id.indexOf('q_lead_')===0?' lead':'');
    const pv = (typeof q.panic === 'number') ? q.panic : 0;
    const deltaCls = pv > 0 ? 'pos' : (pv < 0 ? 'neg' : 'zero');

function openCase(caseId){
  gameState.currentCaseId = caseId;
  if(!gameState.caseStates[caseId]){
    const loaded = loadCase(caseId);
    gameState.caseStates[caseId] = loaded || freshCaseState(caseId);
  }
  const cs = gameState.caseStates[caseId];
  if(!cs.started){
    cs.started = true;
    cs.screen = 'dashboard';
    cs.caseTab = 'victim';
    const cd = CASES[caseId];
    const initialEv = (caseId === 'case001' || caseId === 'case002' || caseId === 'case003') ? ['E01','E02'] : ['E01','E02'];
    initialEv.forEach(id=>{
      if(!cs.evidence.includes(id)) cs.evidence.push(id);
    });
    cd.timeline.forEach(x=>{ if(x.start && !cs.timeline.includes(x.id)) cs.timeline.push(x.id); });
    saveCase(caseId);
  } else {
    if(cs.ending) cs.screen = 'dashboard';
    else if(!cs.screen || cs.screen === 'dashboard') cs.screen = 'dashboard';
    else cs.screen = cs.screen || 'dashboard';
  }
  gameState.screen = 'case';
  render();
  window.scrollTo({top:0, behavior:'auto'});
}
function doResetCase(caseId){
  resetCaseProgress(caseId);
  closeModal();
  if(gameState.currentCaseId === caseId){
    openCase(caseId);
  } else {
    gameState.screen = 'database';
    render();
  }
  toast(t('caseReset'), 'red');
}

  const cs = currentCaseState();

  cs.screen = 'interrogation';
  if(!cs.logs[sid]) cs.logs[sid] = [];
  saveCase(cs.caseId);

}

/* ---------------------------------------------------------------------------
   askQuestion — MODIFICADO para soportar pánico negativo y repetible
   --------------------------------------------------------------------------- */
function askQuestion(qid){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  const s = cs.suspects[sid];
  const p = cd.suspects[sid];
  const q = cd.questions.find(x=>x.id===qid);
  if(!q) return;

  const askedBefore = s.asked[qid];
  const band = panicBand(s.panic);
  const ans = p.answers[qid];
  const panicEffect = (typeof q.panic === 'number') ? q.panic : 0;

  // Lead handling (sin cambios)
  if(qid.indexOf('q_lead_') === 0){
    let leadId = null;
    if(qid === 'q_lead_adrian' || qid === 'q_lead_maya') leadId = 'L1';
    else if(qid === 'q_lead_valeria' || qid === 'q_lead_ethan') leadId = 'L2';
    else if(qid === 'q_lead_marcos' || qid === 'q_lead_victor') leadId = 'L3';
    else if(qid === 'q_lead_sofia') leadId = 'L4';
    else if(qid === 'q_lead_olivia') leadId = 'L1';
    else if(qid === 'q_lead_claire') leadId = 'L2';
    else if(qid === 'q_lead_ryan') leadId = 'L3';
    else if(qid === 'q_lead_nathan') leadId = 'L4';
    if(leadId && !cs.askedLeads.includes(leadId)){
      cs.askedLeads.push(leadId);
      const ld = cd.leads[leadId];
      if(ld && ld.falseAccusation){ addScore(30, true); toast(t('falseAccusation'), 'amber'); }
      else { addScore(15, true); }
      if(ld) raiseSuspicion(ld.target, 10);
    }
  }

  let panicChange = 0;

  if(askedBefore === undefined){
    // Primera vez: efecto completo
    panicChange = panicEffect;
    s.asked[qid] = band;
  } else {
    if(panicEffect < 0){
      // Preguntas calmantes: repetibles con efecto reducido al 50%
      panicChange = Math.round(panicEffect * 0.5);
      // No actualizamos s.asked[qid] para no romper la lógica de bandas
    } else if(panicEffect > 0){
      // Preguntas agresivas/neutrales-positivas: solo dan info nueva si subió la banda
      if(band > askedBefore){
        panicChange = Math.round(panicEffect * 0.6);
        s.asked[qid] = band;
      } else {
        addScore(-5, true);
        toast(t('irrelevant'), 'red');
        panicChange = 0;
      }
    } else {
      // panic: 0, neutral
      panicChange = 0;
    }
  }

  pushLog(sid, {kind:'q', qid:qid, band:band});
  if(panicChange !== 0) addPanic(sid, panicChange);
  SFX.click();

  if(qid==='q_motive' || qid==='q_hiding') raiseSuspicion(sid, 3);

  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}
function confront(eid){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  const e = cd.evidence[eid];
  if(!e) return;
  const conf = e.confront && e.confront[sid];
  pushLog(sid, {kind:'c', eid:eid});
  if(conf){
    addPanic(sid, conf.panic);
    if(conf.panic >= 20) raiseSuspicion(sid, 12);
    else if(conf.panic >= 10) raiseSuspicion(sid, 6);
    SFX.contradiction();
  }else{
    pushLog(sid, {kind:'sys', text:{es:'No hay reacción significativa.', en:'No significant reaction.'}, cls:''});
    SFX.warn();
  }
  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}
function decodeTransmission(txid){
  const cd = currentCase(); const cs = currentCaseState();
  const tx = cd.transmissions.find(x=>x.id===txid);
  if(!tx) return;
  if(cs.decoded.includes(txid)) return;
  if(tx.decodeReq && !cs.evidence.includes(tx.decodeReq)){
    toast(t('fileLockedMsg'), 'red');
    return;
  }
  cs.decoded.push(txid);
  SFX.decode();
  toast(t('transmissionDecoded') + ' — ' + txid, 'purple');
  addScore(15, true);
  saveCase(cd.id);
  render();
}
function confirmAccusation(sid){
  closeModal();
  const cd = currentCase(); const cs = currentCaseState();
  cs.accused = sid;
  const enough = cs.evidence.length >= cd.minEvidence && cs.contradictions.length >= cd.minContradictions;
  if(!enough){
    addScore(-10, true);
    cs.ending = 'insufficient';
    gameState.screen = 'ending';
    SFX.wrong();
    saveCase(cd.id);
    render();
    window.scrollTo({top:0, behavior:'auto'});
    return;
  }
  if(sid === cd.murderer){
    cs.ending = 'solved';
    addScore(50, true);
    SFX.solved();
  }else{
    cs.ending = 'wrong';
    SFX.wrong();
  }
  gameState.screen = 'ending';
  saveCase(cd.id);
  render();
  window.scrollTo({top:0, behavior:'auto'});
}

document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-act]');
  const langBtn = ev.target.closest('#langMenu button');
  if(langBtn){ setLang(langBtn.dataset.lang); return; }
  if(ev.target.closest('#langBtn')){
    $('langMenu').classList.toggle('open');
    return;
  }
  if(!$('langMenu').contains(ev.target) && !ev.target.closest('#langBtn')){
    $('langMenu').classList.remove('open');
  }
  if(ev.target.closest('#soundBtn')){
    gameState.settings.sound = !gameState.settings.sound;
    saveSettings();
    updateTopbar();
    if(gameState.settings.sound) SFX.click();
    return;
  }
  if(ev.target.closest('#menuBtn')){
    if(gameState.screen === 'menu'){ /* stay */ }
    else {
      gameState.screen = 'menu';
      render();
      window.scrollTo({top:0, behavior:'auto'});
    }
    SFX.click();
    return;
  }
  if(!el) return;
  const act = el.dataset.act;
  const cd = currentCase(); const cs = currentCaseState();

  switch(act){
    case 'menu':      SFX.click(); gameState.screen = 'menu'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'database':  SFX.click(); gameState.screen = 'database'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'instructions': SFX.click(); gameState.screen = 'instructions'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'understood': SFX.click(); gameState.screen = 'menu'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'open-case':
      SFX.click();
      openCase(el.dataset.cid);
      break;
    case 'reset-case':
      SFX.click();
      modalResetCase(gameState.currentCaseId);
      break;
    case 'do-reset':
      doResetCase(el.dataset.cid);
      break;
    case 'cancel':
      SFX.click(); closeModal(); break;
    case 'suspects':
    case 'go-suspects':
      SFX.click();
      if(cs){ cs.screen = 'suspects'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'casefile':
      SFX.click();
      if(cs){ cs.screen = 'dashboard'; cs.caseTab = 'victim'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'tab':
      SFX.click();
      if(cs){ cs.caseTab = el.dataset.tab; saveCase(cd.id); }
      render();
      break;
    case 'interrogate':
      SFX.click();
      interrogate(el.dataset.sid);
      break;
    case 'ask':
      askQuestion(el.dataset.qid);
      break;
    case 'confront':
      confront(el.dataset.eid);
      break;
    case 'decode':
      decodeTransmission(el.dataset.txid);
      break;    
    case 'lie':
      SFX.click();
      attemptLie(el.dataset.sid, el.dataset.lie);
      break;
    case 'toggle-obs':
      SFX.click();
      toggleWitnessObservation(el.dataset.obs);
      break;
    case 'submit-obs':
      SFX.click();
      submitWitnessGroup();
      break;
    case 'clear-obs':
      SFX.click();
      clearWitnessSelection();
      break;
    case 'accusescreen':
      SFX.click();
      if(cs){ cs.screen = 'accuse'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'accuse':
      SFX.click();
      modalAccuse(el.dataset.sid);
      break;
    case 'confirm-accuse':
      confirmAccusation(el.dataset.sid);
      break;
    case 'review':
      SFX.click();
      if(cs){ cs.screen = 'dashboard'; cs.caseTab = 'evidence'; cs.ending = null; saveCase(cd.id); }
      gameState.screen = 'case';
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'restart':
      SFX.click();
      modalResetCase(gameState.currentCaseId);
      break;
  }
});

/* ============================================================================
   13. LANGUAGE
   ============================================================================ */
function setLang(l){
  if(l !== 'es' && l !== 'en') return;
  gameState.settings.lang = l;
  try{ localStorage.setItem('cfu_lang', l); }catch(e){}
  $('langMenu').classList.remove('open');
  SFX.click();
  saveSettings();
  render();
}

/* ============================================================================
   14. MOBILE / TOUCH ENHANCEMENTS
   ============================================================================ */
function detectTouch(){
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  document.body.classList.toggle('is-touch', isTouch);
}
let lastTouchEnd = 0;
document.addEventListener('touchend', function(ev){
  const now = Date.now();
  if(now - lastTouchEnd <= 300){
    if(!ev.target.closest('input, textarea, select')){
      ev.preventDefault();
    }
  }
  lastTouchEnd = now;
}, {passive:false});
let orientationTimer = null;
function handleOrientation(){
  if(orientationTimer) clearTimeout(orientationTimer);
  orientationTimer = setTimeout(()=>{
    if(gameState.screen === 'case'){ render(); }
  }, 250);
}
window.addEventListener('orientationchange', handleOrientation);
if(window.matchMedia){
  try{
    window.matchMedia('(orientation: portrait)').addEventListener('change', handleOrientation);
    window.matchMedia('(orientation: landscape)').addEventListener('change', handleOrientation);
  }catch(e){}
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    document.documentElement.style.setProperty('--vh', (window.visualViewport.height*0.01)+'px');
  });
  document.documentElement.style.setProperty('--vh', (window.visualViewport.height*0.01)+'px');
}
$('modalRoot').addEventListener('click', function(ev){
  if(ev.target === $('modalRoot')){ closeModal(); }
});
document.addEventListener('touchstart', function(ev){
  const lm = $('langMenu');
  if(lm && lm.classList.contains('open')){
    if(!lm.contains(ev.target) && !ev.target.closest('#langBtn')){
      lm.classList.remove('open');
    }
  }
}, {passive:true});

/* ============================================================================
   15. UPDATE CHECKER — CASE FILES: UNKNOWN
   ============================================================================ */
async function checkForUpdates(){
  try{
    const response = await fetch('./version.json?t=' + Date.now());
    if(!response.ok) return;
    const data = await response.json();
    if(data.version && data.version !== CURRENT_VERSION){
      showUpdateNotification(data);
    }
  }catch(e){
    console.log("Could not check for updates.");
  }
}
function showUpdateNotification(update){
  if(document.getElementById('updateNotification')) return;
  const escHtml = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const wrap = document.createElement('div');
  wrap.id = 'updateNotification';
  wrap.innerHTML = `
    <div style="
      position: fixed; top: 20px; right: 20px;
      width: 320px; max-width: calc(100vw - 40px);
      padding: 20px; background: #0b1116; color: #fff;
      border: 1px solid #2bff9e; border-radius: 8px;
      z-index: 99999; font-family: 'Courier New', monospace;
      box-shadow: 0 0 30px rgba(43,255,158,.35), 0 0 20px rgba(0,0,0,.6);
    ">
      <div style="font-size:16px;font-weight:bold;margin-bottom:10px;color:#2bff9e;letter-spacing:1px">
        🔔 UPDATE AVAILABLE
      </div>
      <div style="margin-bottom:6px;font-size:12px;color:#b9cbcd">
        Current: <b>${escHtml(CURRENT_VERSION)}</b>
      </div>
      <div style="margin-bottom:12px;font-size:12px;color:#b9cbcd">
        New: <b style="color:#ffb020">${escHtml(update.version)}</b>
      </div>
      <div style="font-size:12px;opacity:.85;margin-bottom:15px;color:#9fb3b6;line-height:1.5">
        ${escHtml(update.latest_update || "New update available.")}
      </div>
      <button onclick="location.reload()" style="
        padding:10px 15px;cursor:pointer;background:#0d141a;color:#2bff9e;
        border:1px solid #0b6b45;border-radius:4px;
        font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;width:100%;
      ">UPDATE NOW</button>
    </div>
  `;
  document.body.appendChild(wrap);
}

/* ============================================================================
   16. INIT
   ============================================================================ */
(function init(){
  detectTouch();
  loadSettings();
  updateTopbar();
  render();
  document.addEventListener('pointerdown', function once(){
    ac();
    document.removeEventListener('pointerdown', once);
  }, {once:true});
  setTimeout(checkForUpdates, 1500);
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CASE FILES: UNKNOWN — CLASSIFIED INVESTIGATION DATABASE</title>
<style>
:root{
  --bg:#05070a;
  --panel:#0b1013;
  --panel2:#101820;
  --panel3:#141e26;
  --line:#1d2a30;
  --line2:#26383f;
  --red:#ff2e3a;
  --red-d:#7a0b12;
  --green:#2bff9e;
  --green-d:#0b6b45;
  --amber:#ffb020;
  --blue:#4fc3f7;
  --purple:#b47bff;
  --txt:#c6d4d6;
  --dim:#61777c;
  --mono:'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;
  overscroll-behavior-y:none;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,46,58,.06), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(43,255,158,.05), transparent 45%);
  background-attachment:fixed;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#080b0e}
::-webkit-scrollbar-thumb{background:#1e2c33;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2c4049}
#crt{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:repeating-linear-gradient(to bottom,
     rgba(255,255,255,.028) 0px,
     rgba(255,255,255,.028) 1px,
     transparent 1px, transparent 3px);
}
#crt::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.72) 100%);
}
#crt::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(43,255,158,.02),rgba(255,46,58,.02));
  animation:flicker 6s infinite steps(1);
}
@keyframes flicker{0%,96%{opacity:1}97%{opacity:.85}98%{opacity:1}99%{opacity:.92}}

#topbar{
  position:sticky;top:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + var(--safe-top)) calc(14px + var(--safe-right)) 8px calc(14px + var(--safe-left));
  background:linear-gradient(180deg,#080c10 0%,#05070a 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 22px rgba(0,0,0,.75);flex-wrap:wrap;
}
.brand{
  font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--red);
  text-shadow:0 0 8px rgba(255,46,58,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;
}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scorebox{
  font-family:var(--mono);font-size:12px;letter-spacing:1px;
  color:var(--green);border:1px solid var(--green-d);
  padding:4px 9px;border-radius:3px;background:rgba(43,255,158,.05);
  white-space:nowrap;
}
.tbtn{
  font-family:var(--mono);font-size:11px;letter-spacing:1px;
  background:#0d141a;color:var(--txt);
  border:1px solid var(--line2);border-radius:3px;
  padding:6px 10px;cursor:pointer;transition:.15s;white-space:nowrap;
  min-height:36px;
}
.tbtn:hover{background:#16222a;border-color:var(--green-d);color:var(--green)}
.tbtn.off{opacity:.45}
.langwrap{position:relative}
.langmenu{
  display:none;position:absolute;right:0;top:110%;z-index:950;
  background:#0b1217;border:1px solid var(--line2);border-radius:4px;
  min-width:180px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.8);
}
.langmenu.open{display:block;animation:pop .15s ease}
.langmenu .langtitle{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:2px;padding:4px 8px 8px;
}
.langmenu button{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  color:var(--txt);font-size:13px;padding:10px;border-radius:3px;cursor:pointer;
  min-height:40px;
}
.langmenu button:hover{background:#16222a}
.langmenu button.active{background:rgba(43,255,158,.1);color:var(--green);font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

main{
  max-width:1400px;margin:0 auto;
  padding:18px calc(14px + var(--safe-right)) calc(60px + var(--safe-bottom)) calc(14px + var(--safe-left));
}
.screen{animation:screenIn .35s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:700;letter-spacing:1px}
.panel{
  background:linear-gradient(180deg,rgba(16,24,32,.9),rgba(11,16,19,.95));
  border:1px solid var(--line);border-radius:5px;padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 8px 26px rgba(0,0,0,.5);
}
.panel + .panel{margin-top:14px}
.panel-title{
  font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--green);
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel-title.red{color:var(--red)}
.panel-title.purple{color:var(--purple)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.small{font-size:12px}

.btn{
  font-family:var(--mono);font-size:13px;letter-spacing:2px;
  background:linear-gradient(180deg,#101a21,#0a1015);
  color:var(--txt);border:1px solid var(--line2);border-radius:4px;
  padding:13px 18px;cursor:pointer;transition:.16s;text-align:center;
  display:block;width:100%;position:relative;overflow:hidden;
  min-height:48px;
  touch-action:manipulation;
}
.btn:hover:not(:disabled){border-color:var(--green);color:var(--green);background:#122029;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.red{border-color:var(--red-d);color:#ffb3b7}
.btn.red:hover:not(:disabled){border-color:var(--red);color:var(--red);background:#22090c}
.btn.green{border-color:var(--green-d);color:var(--green)}
.btn.green:hover:not(:disabled){background:#0c2018}
.btn.purple{border-color:#4a2c7a;color:#d7b3ff}
.btn.purple:hover:not(:disabled){background:#1a0f2a;border-color:var(--purple)}
.btn.small{padding:8px 12px;font-size:11px;min-height:40px}

.menu-wrap{max-width:720px;margin:4vh auto;text-align:center}
.menu-title{
  font-size:clamp(24px,7vw,52px);
  letter-spacing:clamp(2px,1vw,4px);color:#fff;line-height:1.15;
  text-shadow:0 0 18px rgba(255,46,58,.55), 0 0 3px #fff;
  position:relative;animation:glitchShadow 4s infinite;
  word-break:break-word;
}
@keyframes glitchShadow{
  0%,92%{text-shadow:0 0 18px rgba(255,46,58,.55),0 0 3px #fff}
  93%{text-shadow:3px 0 0 #ff2e3a,-3px 0 0 #2bff9e,0 0 18px rgba(255,46,58,.6)}
  95%{text-shadow:-3px 0 0 #ff2e3a,3px 0 0 #2bff9e,0 0 18px rgba(255,46,58,.6)}
  97%{text-shadow:0 0 18px rgba(255,46,58,.55),0 0 3px #fff}
}
.menu-sub{font-family:var(--mono);color:var(--dim);letter-spacing:3px;font-size:12px;margin-top:12px}
.menu-classified{
  display:inline-block;margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:2px;
  color:var(--red);border:1px solid var(--red-d);padding:6px 14px;border-radius:2px;
  background:rgba(255,46,58,.06);animation:pulseRed 2.6s infinite;
  max-width:100%;
}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 rgba(255,46,58,0)}50%{box-shadow:0 0 18px rgba(255,46,58,.35)}}
.menu-buttons{margin-top:34px;display:flex;flex-direction:column;gap:11px}
.menu-foot{margin-top:26px;font-family:var(--mono);font-size:10px;color:#33454b;letter-spacing:1px;line-height:1.7}

.grid{display:grid;gap:14px}
.grid.suspects{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.grid.cases{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.casecard{
  background:linear-gradient(180deg,#0e161c,#090f13);
  border:1px solid var(--line);border-radius:6px;padding:16px;
  transition:.18s;position:relative;overflow:hidden;
}
.casecard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#2bff9e);
  opacity:.6;
}
.casecard:hover{border-color:var(--acc,#2bff9e);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.casecard.locked{opacity:.45;cursor:not-allowed}
.casecard.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.casecard .cnum{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--red)}
.casecard .ctitle{font-family:var(--mono);font-size:17px;letter-spacing:1.5px;color:#fff;margin-top:6px;line-height:1.25;word-break:break-word}
.casecard .cdesc{font-size:13px;color:#9fb3b6;margin-top:10px;line-height:1.55}
.casecard .cstatus{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:2px;
  padding:3px 8px;border-radius:2px;margin-top:10px;
}
.casecard .cstatus.available{color:var(--green);border:1px solid var(--green-d);background:rgba(43,255,158,.05)}
.casecard .cstatus.progress{color:var(--amber);border:1px solid #6b4a06;background:rgba(255,176,32,.06)}
.casecard .cstatus.complete{color:var(--blue);border:1px solid #1a5a7a;background:rgba(79,195,247,.06)}
.casecard .cstatus.locked{color:var(--dim);border:1px solid var(--line2);background:rgba(97,119,124,.05)}

.scard{
  background:linear-gradient(180deg,#0e161c,#090f13);
  border:1px solid var(--line);border-radius:6px;padding:14px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;
}
.scard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#2bff9e);
  opacity:.6;
}
.scard:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.scard .sname{font-family:var(--mono);font-size:15px;letter-spacing:2px;color:#fff}
.scard .srow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;gap:8px}
.scard .srow b{color:var(--txt);font-weight:600}

.meter{height:8px;background:#0a1015;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter .fill{height:100%;transition:width .6s cubic-bezier(.2,.8,.3,1);border-radius:1px}
.fill.panic{background:linear-gradient(90deg,#7a5b00,#ffb020,#ff2e3a)}
.fill.susp{background:linear-gradient(90deg,#0b6b45,#2bff9e)}
.mlabel{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:9px}
.mlabel b{color:var(--txt)}
.barline{font-family:var(--mono);font-size:11px;letter-spacing:1px}
.barline.panic{color:var(--amber)}
.barline.susp{color:var(--green)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:1.5px;
  background:#0c1318;border:1px solid var(--line);color:var(--dim);
  padding:8px 12px;border-radius:3px;cursor:pointer;transition:.15s;
  min-height:40px;
}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.active{color:var(--green);border-color:var(--green-d);background:rgba(43,255,158,.07)}
.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:14px}
.kv .k{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dim);padding-top:3px}
.kv .v{color:#dbe7e8;word-break:break-word}

.tl-item{display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed #16232a}
.tl-item:last-child{border-bottom:0}
.tl-time{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:86px;letter-spacing:1px;flex-shrink:0}
.tl-text{font-size:14px;flex:1;min-width:0}
.tl-item.crit .tl-time{color:var(--red);text-shadow:0 0 8px rgba(255,46,58,.6)}
.tl-item.crit .tl-text{color:#ffd7d9}

.evcard{
  border:1px solid var(--line);border-left:3px solid var(--green-d);
  border-radius:4px;padding:11px 13px;margin-bottom:9px;background:#0a1116;
  animation:evIn .5s ease;
}
@keyframes evIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.evcard.contra{border-left-color:var(--red)}
.evcard .evhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.evcard .evnum{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--green)}
.evcard.contra .evnum{color:var(--red)}
.evcard .evname{font-weight:600;color:#fff;font-size:14px;margin-top:3px;word-break:break-word}
.evcard .evdesc{font-size:13px;color:#9fb3b6;margin-top:5px;line-height:1.5}
.evcard .evcat{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.locked-ev{
  font-family:var(--mono);font-size:11px;color:#33454b;border:1px dashed #1a262c;
  border-radius:4px;padding:9px 12px;margin-bottom:9px;letter-spacing:1px;
}

.relmap{font-family:var(--mono);font-size:13px;line-height:2;color:var(--txt);white-space:pre-wrap;overflow-x:auto}
.relmap .node{color:#fff}
.relmap .r-friend{color:var(--blue)}
.relmap .r-class{color:var(--green)}
.relmap .r-acq{color:var(--amber)}
.relmap .r-girl{color:#ff7bd5}
.rel-hidden{margin-top:12px;font-size:13px;color:#9fb3b6;border-left:2px solid var(--red-d);padding-left:12px}

.file-sec{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;background:#080e12}
.file-sec.locked{opacity:.4;font-family:var(--mono);font-size:12px;color:#3d5157;letter-spacing:1px}
.file-sec .fstitle{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--green);margin-bottom:7px}
.file-sec.final{border-color:var(--red-d);background:rgba(255,46,58,.04)}
.file-sec.final .fstitle{color:var(--red)}
.file-sec .fsbody{font-size:14px;color:#cfe0e2;line-height:1.65}

.tx-list{display:flex;flex-direction:column;gap:10px}
.tx-item{
  border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:4px;padding:11px 13px;background:#0a0f16;
  animation:evIn .4s ease;position:relative;
}
.tx-item.locked{opacity:.5;border-left-color:#3d2a5a}
.tx-item.corrupted{border-left-color:var(--red);background:rgba(255,46,58,.03)}
.tx-item.decoded{border-left-color:var(--green);background:rgba(43,255,158,.03)}
.tx-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tx-num{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--purple)}
.tx-time{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:1px}
.tx-body{font-family:var(--mono);font-size:13.5px;color:#cfe0e2;margin-top:8px;line-height:1.6;word-break:break-word}
.tx-item.corrupted .tx-body{color:#ff9ba0;text-shadow:0 0 6px rgba(255,46,58,.5);letter-spacing:2px}
.tx-item.locked .tx-body{color:#3d5157;font-style:italic}
.tx-decode{
  margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;
  color:var(--green);border:1px solid var(--green-d);border-radius:2px;
  padding:6px 10px;display:inline-block;background:transparent;cursor:pointer;
  min-height:36px;touch-action:manipulation;
}
.tx-decode:hover{background:rgba(43,255,158,.1)}

.cam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cam{
  border:1px solid var(--line);border-radius:5px;padding:12px;background:#070c10;
  position:relative;overflow:hidden;
}
.cam .cam-id{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--green)}
.cam .cam-title{font-size:14px;color:#fff;font-weight:600;margin-top:4px}
.cam .cam-status{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;margin-top:8px;padding:3px 8px;border-radius:2px;display:inline-block}
.cam .cam-status.ok{color:var(--green);border:1px solid var(--green-d)}
.cam .cam-status.gap{color:var(--red);border:1px solid var(--red-d);background:rgba(255,46,58,.06)}
.cam .cam-status.fail{color:var(--amber);border:1px solid #6b4a06;background:rgba(255,176,32,.05)}
.cam .cam-desc{font-size:13px;color:#9fb3b6;margin-top:10px;line-height:1.55}
.cam .cam-tape{
  height:34px;margin-top:10px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,#0b1318,#0b1318 4px,#0e181e 4px,#0e181e 8px);
  position:relative;overflow:hidden;
}
.cam .cam-tape::after{
  content:'';position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--amber);
  animation:tapeMove 3s linear infinite;
}
@keyframes tapeMove{from{left:0}to{left:100%}}
.cam .cam-tape.gap{background:repeating-linear-gradient(90deg,#180a0d,#180a0d 4px,#2a0e12 4px,#2a0e12 8px)}
.cam .cam-tape.gap::after{background:var(--red)}
.cam .cam-tape.fail{background:repeating-linear-gradient(90deg,#1a1408,#1a1408 4px,#2a2010 4px,#2a2010 8px)}
.cam .cam-tape.fail::after{background:var(--amber)}

.interro{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:14px;align-items:start}

.suspect-panel .avatar{
  width:100%;height:120px;border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#0b1116,#0b1116 8px,#0d151b 8px,#0d151b 16px);
  font-family:var(--mono);font-size:34px;letter-spacing:3px;color:var(--acc,#2bff9e);
  text-shadow:0 0 14px currentColor;margin-bottom:12px;
}
.suspect-panel.critical{border-color:var(--red);animation:critPulse 1.1s infinite}
@keyframes critPulse{0%,100%{box-shadow:0 0 0 rgba(255,46,58,0)}50%{box-shadow:0 0 26px rgba(255,46,58,.55)}}

.dialogue-panel{display:flex;flex-direction:column;min-height:420px}
.log{
  flex:1;max-height:56vh;min-height:340px;overflow-y:auto;padding-right:6px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.msg{animation:msgIn .3s ease;font-size:14px;line-height:1.55;word-break:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .who{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:3px;display:block}
.msg.player{color:#8fb0b5;border-left:2px solid #26383f;padding-left:10px}
.msg.player .who{color:#4c6a70}
.msg.suspect{border-left:2px solid var(--acc,#2bff9e);padding-left:10px;color:#e2eeef}
.msg.suspect .who{color:var(--acc,#2bff9e)}
.msg.system{
  font-family:var(--mono);font-size:12px;letter-spacing:1px;
  color:var(--green);background:rgba(43,255,158,.06);
  border:1px solid var(--green-d);border-radius:3px;padding:8px 11px;
}
.msg.system.red{color:var(--red);background:rgba(255,46,58,.07);border-color:var(--red-d)}
.msg.system.amber{color:var(--amber);background:rgba(255,176,32,.06);border-color:#6b4a06}
.msg.contradiction{
  font-family:var(--mono);letter-spacing:1px;color:#fff;
  background:linear-gradient(90deg,rgba(255,46,58,.25),rgba(255,46,58,.03));
  border:1px solid var(--red);border-radius:3px;padding:10px 12px;
  animation:glitchBox .5s ease;
}
@keyframes glitchBox{
  0%{transform:translateX(-6px)}
  25%{transform:translateX(5px)}
  50%{transform:translateX(-3px)}
  100%{transform:none}
}

.qlist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding-right:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.qbtn{
  font-size:12.5px;text-align:left;background:#0c1318;border:1px solid var(--line);
  color:var(--txt);padding:11px 12px;border-radius:3px;cursor:pointer;transition:.14s;line-height:1.35;
  min-height:44px;
  touch-action:manipulation;
}
.qbtn:hover{border-color:var(--green-d);color:var(--green);background:#101b21}
.qbtn.used{opacity:.5}
.qbtn.lead{border-color:var(--amber);color:var(--amber)}
.evbtn{
  font-family:var(--mono);font-size:11px;text-align:left;background:#0c1318;border:1px solid var(--line);
  color:var(--txt);padding:11px 12px;border-radius:3px;cursor:pointer;transition:.14s;line-height:1.35;
  margin-bottom:6px;width:100%;
  min-height:44px;
  touch-action:manipulation;
}
.evbtn:hover{border-color:var(--red);color:#ffb3b7;background:#1a0c0f}

#modalRoot{
  position:fixed;inset:0;z-index:1000;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(0,0,0,.78);backdrop-filter:blur(3px);
  overflow-y:auto;
}
#modalRoot.open{display:flex;animation:screenIn .2s ease}
.modal{
  max-width:560px;width:100%;background:#0b1116;border:1px solid var(--line2);
  border-radius:6px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.9);
  max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.modal h3{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--red);margin-bottom:12px}
.modal .mbody{font-size:14px;color:#b9cbcd;margin-bottom:18px}
.modal .mbtns{display:flex;gap:10px;flex-wrap:wrap}
.modal .mbtns .btn{flex:1;min-width:130px}

#toasts{position:fixed;right:14px;bottom:14px;z-index:1100;display:flex;flex-direction:column;gap:8px;max-width:340px;pointer-events:none}
.toast{
  font-family:var(--mono);font-size:11.5px;letter-spacing:1px;
  background:#0b1217;border:1px solid var(--green-d);border-left:3px solid var(--green);
  color:var(--green);padding:10px 13px;border-radius:3px;
  box-shadow:0 8px 26px rgba(0,0,0,.75);animation:toastIn .35s ease;
}
.toast.red{border-color:var(--red-d);border-left-color:var(--red);color:var(--red)}
.toast.amber{border-color:#6b4a06;border-left-color:var(--amber);color:var(--amber)}
.toast.purple{border-color:#4a2c7a;border-left-color:var(--purple);color:var(--purple)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

.ending-title{
  font-family:var(--mono);font-size:clamp(22px,5vw,40px);letter-spacing:5px;text-align:center;
  margin:22px 0 8px;word-break:break-word;
}
.ending-title.solved{color:var(--green);text-shadow:0 0 24px rgba(43,255,158,.6);animation:glitchShadow 3s infinite}
.ending-title.wrong{color:var(--red);text-shadow:0 0 24px rgba(255,46,58,.6);animation:shake .6s ease}
.ending-title.insuf{color:var(--amber);text-shadow:0 0 20px rgba(255,176,32,.5)}
@keyframes shake{
  0%{transform:translateX(-12px)}20%{transform:translateX(10px)}
  40%{transform:translateX(-7px)}60%{transform:translateX(5px)}100%{transform:none}
}
.ending-sub{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--dim);margin-bottom:24px}
.bigscore{
  text-align:center;font-family:var(--mono);font-size:clamp(26px,6vw,34px);letter-spacing:4px;color:var(--green);
  text-shadow:0 0 20px rgba(43,255,158,.5);margin:10px 0 24px;
}
.confession{
  border-left:3px solid var(--red);background:rgba(255,46,58,.05);
  padding:14px 16px;border-radius:3px;font-size:14.5px;line-height:1.7;color:#ffd9db;font-style:italic;
}
ul.plain{list-style:none}
ul.plain li{padding:5px 0 5px 18px;position:relative;font-size:13.5px;color:#b9cbcd;word-break:break-word}
ul.plain li::before{content:'▸';position:absolute;left:0;color:var(--green)}
ul.plain.red li::before{color:var(--red)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:150px}
.center{text-align:center}
.mt10{margin-top:10px}.mt16{margin-top:16px}.mt24{margin-top:24px}

/* ==========================================================================
   RESPONSIVE — MOBILE & TABLET
   ========================================================================== */

/* Tablets y pantallas medianas */
@media (max-width:1080px){
  .interro{grid-template-columns:1fr;gap:12px}
  .suspect-panel{order:1}
  .dialogue-panel{order:2}
  .action-panel{order:3}
  .dialogue-panel{min-height:auto}
  .log{min-height:260px;max-height:44vh}
  .qlist{max-height:none}
}

/* Móvil grande / tablet pequeña */
@media (max-width:720px){
  html{font-size:15px}
  main{padding-top:14px}
  .panel{padding:14px}
  .panel-title{font-size:10px;letter-spacing:2px}
  .menu-title{letter-spacing:2px}
  .menu-buttons{margin-top:24px}
  .grid.cases,.grid.suspects{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv .k{margin-top:10px;padding-top:0}
  .kv .v{font-size:14.5px}
  .tl-item{flex-direction:column;gap:2px;padding:10px 0}
  .tl-time{font-size:11px;letter-spacing:0.5px}
  .evcard .evhead{flex-direction:column;align-items:flex-start;gap:6px}
  .cam-grid{grid-template-columns:1fr}
  .modal{padding:16px;max-height:92vh}
  .modal .mbtns{flex-direction:column}
  .modal .mbtns .btn{min-width:0}
  .row .btn{min-width:0;flex-basis:100%}
  #toasts{left:14px;right:14px;max-width:none;bottom:14px}
  .toast{font-size:11px;letter-spacing:0.5px}
  .ending-title{letter-spacing:3px}
  .bigscore{letter-spacing:2px}
}

/* Móvil pequeño */
@media (max-width:540px){
  html{font-size:14px}
  #topbar{padding:6px 10px;gap:6px}
  .brand{font-size:10px;letter-spacing:1px;max-width:100%;flex:1 1 100%}
  .topright{flex:1 1 100%;justify-content:flex-end;gap:6px}
  .scorebox{font-size:10px;padding:4px 7px}
  .tbtn{font-size:10px;padding:6px 8px;min-height:34px;letter-spacing:0.5px}
  .menu-classified{font-size:9px;letter-spacing:1px;padding:5px 10px}
  .menu-sub{font-size:10px;letter-spacing:2px}
  main{padding-left:10px;padding-right:10px;padding-bottom:calc(50px + var(--safe-bottom))}
  .panel{padding:12px;border-radius:4px}
  .panel-title{font-size:9px;letter-spacing:1.5px;padding-bottom:6px;margin-bottom:10px}
  .btn{padding:12px 14px;font-size:12px;letter-spacing:1.5px}
  .btn.small{padding:7px 10px;font-size:10px}

  /* Tabs con scroll horizontal en móvil */
  .tabs{
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
    margin-left:-10px;
    margin-right:-10px;
    padding-left:10px;
    padding-right:10px;
    scroll-snap-type:x proximity;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    font-size:10px;
    letter-spacing:1px;
    padding:9px 12px;
    min-height:42px;
    scroll-snap-align:start;
  }

  /* Interrogatorio: layout móvil optimizado */
  .interro{gap:10px}
  .suspect-panel{padding:12px}
  .suspect-panel .avatar{height:80px;font-size:26px;letter-spacing:2px;margin-bottom:10px}
  .suspect-panel .sname{font-size:12px}
  .dialogue-panel{padding:12px;min-height:auto}
  .log{min-height:220px;max-height:42vh;padding-right:2px;gap:8px}
  .msg{font-size:13px;line-height:1.5}
  .msg .who{font-size:9px;letter-spacing:1.5px}
  .msg.system{font-size:11px;padding:7px 10px}
  .action-panel{padding:12px}
  .qlist{margin-bottom:12px;max-height:340px}
  .qbtn{font-size:12px;padding:11px;min-height:46px;line-height:1.4}
  .evbtn{font-size:10.5px;padding:11px;min-height:46px;line-height:1.4}

  /* Case cards y suspect cards más compactas */
  .casecard,.scard{padding:12px}
  .casecard .ctitle{font-size:15px;letter-spacing:1px}
  .casecard .cdesc{font-size:12.5px}
  .scard .sname{font-size:13px;letter-spacing:1.5px}

  /* Meters más visibles al tacto */
  .meter{height:10px}
  .mlabel{font-size:9px;letter-spacing:0.5px}

  /* Timeline y evidencia */
  .tl-text{font-size:13px}
  .evcard{padding:10px 11px}
  .evcard .evname{font-size:13px}
  .evcard .evdesc{font-size:12px}
  .relmap{font-size:11px;line-height:1.9}
  .file-sec{padding:11px}
  .file-sec .fsbody{font-size:13px}

  /* Transmisiones */
  .tx-item{padding:10px 11px}
  .tx-head{flex-direction:column;align-items:flex-start;gap:2px}
  .tx-time{font-size:12px}
  .tx-body{font-size:12.5px;letter-spacing:0.5px}

  /* Modales */
  #modalRoot{padding:10px}
  .modal{padding:14px;border-radius:5px}
  .modal h3{font-size:12px;letter-spacing:2px}
  .modal .mbody{font-size:13px}
  .modal .mbtns .btn{padding:12px;font-size:12px}

  /* Endings */
  .ending-title{letter-spacing:2px;margin-top:12px}
  .ending-sub{font-size:10px;letter-spacing:2px;margin-bottom:18px}
  .confession{padding:12px;font-size:13px}
  .bigscore{letter-spacing:2px;margin:14px 0 18px}

  /* Toasts */
  #toasts{left:10px;right:10px;bottom:10px;gap:6px}
  .toast{font-size:10.5px;padding:9px 11px;letter-spacing:0.5px}
}

/* Móvil muy pequeño (iPhone SE, etc.) */
@media (max-width:380px){
  html{font-size:13px}
  .brand{font-size:9px}
  .tbtn{font-size:9px;padding:5px 7px}
  .scorebox{font-size:9px}
  .menu-title{font-size:22px;letter-spacing:1px}
  .menu-buttons{gap:8px}
  .btn{padding:11px 12px;font-size:11px}
  .log{min-height:180px;max-height:38vh}
  .qbtn,.evbtn{font-size:11px;padding:10px;min-height:42px}
}

/* Landscape en móvil: layout más horizontal */
@media (max-width:900px) and (orientation:landscape) and (max-height:500px){
  #topbar{padding-top:4px;padding-bottom:4px}
  .menu-wrap{margin:2vh auto}
  .log{max-height:36vh;min-height:140px}
  .qlist{max-height:36vh}
  .suspect-panel .avatar{height:60px;font-size:22px}
}

/* Pantallas grandes: mejor uso de espacio */
@media (min-width:1600px){
  main{max-width:1600px}
  .grid.cases{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
}

/* Touch: hover más suave, sin sticky hovers */
@media (hover:none){
  .btn:hover:not(:disabled){transform:none}
  .scard:hover{transform:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .casecard:hover{transform:none}
  .qbtn:hover,.evbtn:hover,.tab:hover{background:#0c1318}
  .qbtn:hover{border-color:var(--line)}
  .tab:hover{color:var(--dim);border-color:var(--line)}
}

/* Preferencia de movimiento reducido */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
  #crt::before{animation:none}
}
</style>

  fileSections:{
    S01:{title:{es:'SECCIÓN 01 — ADRIÁN',en:'SECTION 01 — ADRIÁN'},
      body:{es:'Adrián le paga a Marcos por respuestas de exámenes desde marzo. No me importan los exámenes. Me importa que me mintió en la cara durante cuatro meses. Voy a confrontarlo esta noche. Le mandé un mensaje a las 10:15.',
            en:'Adrián has been paying Marcos for exam answers since March. I don\'t care about the exams. I care that he lied to my face for four months. I\'m confronting him tonight. I sent him a message at 10:15.'}},
    S02:{title:{es:'SECCIÓN 02 — VALERIA',en:'SECTION 02 — VALERIA'},
      body:{es:'Valeria me consiguió las facturas. Marcos Reyes robó equipo del laboratorio de cómputo y lo vendió a tres compradores. Valeria tiene miedo. Me hizo prometer que no diría de dónde salió la información. Voy a verla a las 10:50.',
            en:'Valeria got me the invoices. Marcos Reyes stole equipment from the computer lab and sold it to three buyers. Valeria is scared. She made me promise not to say where the information came from. I\'m meeting her at 10:50.'}},
    S03:{title:{es:'SECCIÓN 03 — MARCOS',en:'SECTION 03 — MARCOS'},
      body:{es:'MARCOS REYES. 19 años. Robó seis laptops y dos servidores del laboratorio en abril. Los vendió. Le pagó a un estudiante para que se declarara culpable y luego lo amenazó cuando el chico quiso echarse atrás. Tengo las facturas, las fechas y los nombres de los compradores. Si alguien tiene razones para querer que yo desaparezca, es él.',
            en:'MARCOS REYES. 19 years old. Stole six laptops and two servers from the lab in April. He sold them. He paid a student to take the blame and then threatened the kid when he tried to back out. I have the invoices, the dates and the buyers\' names. If anyone has a reason to want me gone, it\'s him.'}},
    S04:{title:{es:'SECCIÓN 04 — SOFÍA',en:'SECTION 04 — SOFÍA'},
      body:{es:'Sofía no sabe nada de esto y no quiero que sepa. Si le pasa algo a este archivo, ella sabrá dónde buscar. Le dije que alguien me estaba siguiendo. Me dijo que fuera a la policía. Le dije que todavía no. Debí escucharla.',
            en:'Sofía knows nothing about this and I don\'t want her to. If something happens to this file, she\'ll know where to look. I told her someone was following me. She told me to go to the police. I told her not yet. I should have listened.'}},
    S05:{title:{es:'SECCIÓN 05 — NOTA FINAL',en:'SECTION 05 — FINAL NOTE'},final:true,
      body:{es:'Si me pasa algo, no fue un accidente.\n\nEsta noche:\n10:15 — le avisé a Adrián.\n10:50 — me reuní con Valeria.\n11:30 — me reúno con la persona de la SECCIÓN 03.\n\nLe dije a Sofía dónde buscar. Si estás leyendo esto, ya lo encontraste.\n\nMira la hora de la Sección 03. Mira dónde estaba su teléfono a las 11:34. Mira dónde encontraron el mío.\n\n— Y.F.',
            en:'If something happens to me, it wasn\'t an accident.\n\nTonight:\n10:15 — I warned Adrián.\n10:50 — I met Valeria.\n11:30 — I\'m meeting the person in SECTION 03.\n\nI told Sofía where to look. If you\'re reading this, you already found it.\n\nCheck the time in Section 03. Check where his phone was at 11:34. Check where they found mine.\n\n— Y.F.'}}
  },

  ending:{

      murdererName:'MARCOS REYES',
      murdererAge:19,
      motive:{es:'Yael había reunido pruebas de que Marcos Reyes robó seis laptops y dos servidores del laboratorio de cómputo de la escuela y los vendió a tres compradores. Además, Marcos había pagado a otro estudiante para que se declarara culpable y luego lo amenazó cuando el chico quiso echarse atrás. El archivo oculto contenía facturas, fechas y nombres. Marcos citó a Yael en la estación vieja a las 11:30 PM para recuperar esas pruebas. La discusión terminó en forcejeo, y Yael cayó golpeándose la cabeza contra el borde del andén.',
              en:'Yael had gathered proof that Marcos Reyes stole six laptops and two servers from the school computer lab and sold them to three buyers. Marcos had also paid another student to take the blame and then threatened the kid when he tried to back out. The hidden file contained invoices, dates and names. Marcos arranged to meet Yael at the old station at 11:30 PM to recover that evidence. The argument turned into a struggle, and Yael fell, hitting his head on the edge of the platform.'},
      keyEvidenceIds:['E05','E08','E09','E10'],
      contradiction:{es:'Marcos declaró haber abandonado la zona antes de las 11:20 PM. Los registros de antena sitúan su teléfono en el sector de la estación vieja a las 11:34 PM — cuatro minutos después del inicio de la ventana del homicidio. Su coartada se desmoronó dos veces: primero con los registros, después con el testigo que retiró su declaración.',
                     en:'Marcos stated he left the area before 11:20 PM. Tower records place his phone in the old station sector at 11:34 PM — four minutes after the start of the murder window. His alibi collapsed twice: first with the records, then with the witness who withdrew his statement.'},
      confession:{es:'"Fui a la estación a asustarlo. No a matarlo. Le dije que me devolviera lo que tenía. Él se rió. Se rió de mí. Forcejeamos y se cayó. Se golpeó la cabeza con el borde del andén y se quedó quieto. Yo lo sacudí. No reaccionó. Y después lo único que se me ocurrió fue sacarle el teléfono, porque sabía que ahí adentro estaba todo. Lo tiré en un desagüe a dos cuadras de mi casa. Estuve a punto de volver. Todas las noches pienso en volver."',
                  en:'"I went to the station to scare him. Not to kill him. I told him to give me back what he had. He laughed. He laughed at me. We struggled and he fell. He hit his head on the edge of the platform and he went still. I shook him. He didn\'t respond. And then the only thing I could think of was taking his phone, because I knew everything was in there. I threw it in a storm drain two blocks from my house. I almost went back. Every night I think about going back."'}

          "Ethan dice que no sabía nada de la investigación de Daniel. Pero fue Ethan quien ordenó el borrado de los registros. Y fui yo quien firmó el reporte de la caída de las cámaras que Ethan me pidió alterar.",
          "Ethan me llamó a las 02:14. Me dijo que apagara las cámaras. Le reconocí la voz. No sé por qué lo hizo, pero sé que fue él.",
          "Fue Ethan. Me llamó a las 02:14. Me amenazó. Me dijo que si hablaba, iba a lamentarlo. Y yo le hice caso. Apagué las cámaras. Y después Daniel desapareció. Y yo... yo también estoy desaparecido, aunque siga aquí."],
          en:[
          "Ethan says he knew nothing. The logs say otherwise.",
          "Ethan called me at 02:14. I recognized his voice.",
          "Ethan says he knew nothing about Daniel's investigation. But it was Ethan who ordered the record deletion. And it was me who signed the camera failure report that Ethan asked me to alter.",
          "Ethan called me at 02:14. He told me to turn off the cameras. I recognized his voice. I don't know why he did it, but I know it was him.",
          "It was Ethan. He called me at 02:14. He threatened me. He told me if I talked, I'd regret it. And I obeyed. I turned off the cameras. And then Daniel disappeared. And I... I'm disappeared too, even if I'm still here."]}
      }
    }
  },

  evidence:{
    E01:{num:'01',cat:'catPhysical',
      name:{es:'Teléfono de Daniel recuperado',en:'Daniel\'s phone recovered'},
      desc:{es:'El teléfono de Daniel fue encontrado en el edificio abandonado, sobre una mesa. Estaba desbloqueado, con la grabación activa. La pantalla está intacta.',en:'Daniel\'s phone was found in the abandoned building, on a table. It was unlocked, with the recording active. The screen is intact.'},
      confront:{
        maya:{panic:6, es:'Él siempre grababa todo. Desde que empezó a investigar.', en:'He always recorded everything. Since he started investigating.'},
        ethan:{panic:8, es:'No sé por qué dejó el teléfono ahí. No tiene sentido.', en:'I don\'t know why he left the phone there. It makes no sense.'},
        lena:{panic:6, es:'Él me dijo que grababa para protegerse.', en:'He told me he recorded to protect himself.'},
        victor:{panic:10, es:'El teléfono estaba ahí cuando llegó la policía. Yo no lo toqué.', en:'The phone was there when the police arrived. I didn\'t touch it.'}}},
    E02:{num:'02',cat:'catDigital',
      name:{es:'Transmisión corrupta',en:'Corrupted transmission'},
      desc:{es:'El archivo de audio de la transmisión de Daniel está parcialmente corrupto. Contiene fragmentos: "no estoy solo", "las cámaras", "Victor", y la frase final: "Si estás escuchando esto, significa que ya me encontraron."',en:'Daniel\'s audio transmission file is partially corrupted. It contains fragments: "I\'m not alone", "the cameras", "Victor", and the final sentence: "If you\'re hearing this, it means they already found me."'},
      confront:{
        maya:{panic:12, es:'Esa es su voz. Es él. La última parte... la última parte no la había escuchado.', en:'That\'s his voice. It\'s him. The last part... I hadn\'t heard the last part.'},
        ethan:{panic:14, es:'Una grabación corrupta no prueba nada. Se puede manipular.', en:'A corrupted recording proves nothing. It can be manipulated.'},
        lena:{panic:10, es:'Él me dijo que grababa por si algo pasaba. Y algo pasó.', en:'He told me he recorded in case something happened. And something happened.'},
        victor:{panic:16, es:'¿Victor? ¿Por qué dijo mi nombre? Yo no... yo solo apagué las cámaras porque me obligaron.', en:'Victor? Why did he say my name? I didn\'t... I only turned off the cameras because I was forced to.'}}},
    E03:{num:'03',cat:'catContradiction',contradiction:true,
      name:{es:'Registro de llamada de Maya',en:'Maya\'s call record'},
      desc:{es:'Los registros telefónicos muestran que la llamada entre Daniel y Maya a la 01:40 duró 22 minutos, no 5 como ella declaró inicialmente.',en:'Phone records show the call between Daniel and Maya at 01:40 lasted 22 minutes, not 5 as she initially stated.'},
      confront:{
        maya:{panic:25, es:'Está bien. La llamada duró veintidós minutos. Daniel me explicó todo lo que había encontrado.', en:'Fine. The call lasted twenty-two minutes. Daniel explained everything he had found.'},
        ethan:{panic:6, es:'No sabía que habían hablado tanto. Eso no me incumbe.', en:'I didn\'t know they had talked that long. That\'s not my concern.'},
        lena:{panic:8, es:'Maya habló con él esa noche. Eso significa que sabe más de lo que dice.', en:'Maya talked to him that night. That means she knows more than she says.'},
        victor:{panic:6, es:'No tengo acceso a los registros telefónicos. No sabía nada de esa llamada.', en:'I don\'t have access to phone records. I knew nothing about that call.'}}},
    E04:{num:'04',cat:'catDigital',contradiction:true,
      name:{es:'Registros internos borrados',en:'Deleted internal records'},
      desc:{es:'Una orden de borrado de registros fue firmada por E. COLE cinco días antes de la desaparición de Daniel. Los registros afectados eran transferencias bancarias a cuentas en el extranjero.',en:'A record deletion order was signed by E. COLE five days before Daniel\'s disappearance. The affected records were bank transfers to foreign accounts.'},
      confront:{
        maya:{panic:12, es:'Ethan. Firmó la orden. Eso lo prueba.', en:'Ethan. He signed the order. That proves it.'},
        ethan:{panic:25, es:'Sí, firmé la orden. Pero era limpieza rutinaria. No tenía nada que ver con Daniel.', en:'Yes, I signed the order. But it was routine cleanup. It had nothing to do with Daniel.'},
        lena:{panic:14, es:'Los registros de las transferencias. Daniel los encontró. Y Ethan los borró.', en:'The transfer records. Daniel found them. And Ethan deleted them.'},
        victor:{panic:12, es:'Ethan maneja los registros administrativos. Yo no toco eso. Pero sí, vi la orden en los logs.', en:'Ethan handles the admin records. I don\'t touch that. But yes, I saw the order in the logs.'}}},
    E05:{num:'05',cat:'catDigital',
      name:{es:'Mensajes de N0VA',en:'N0VA messages'},
      desc:{es:'Registro de mensajes entre Daniel y N0VA. N0VA escribió: "Deja de investigar". Daniel respondió: "Sé quién eres". N0VA: "Entonces sabes lo que se viene."',en:'Log of messages between Daniel and N0VA. N0VA wrote: "Stop investigating." Daniel replied: "I know who you are." N0VA: "Then you know what\'s coming."'},
      confront:{
        maya:{panic:14, es:'N0VA. Daniel me habló de N0VA. Me dijo que era alguien de adentro.', en:'N0VA. Daniel told me about N0VA. He said it was someone from inside.'},
        ethan:{panic:20, es:'N0VA es un mito. Cualquiera puede crear una cuenta anónima.', en:'N0VA is a myth. Anyone can create an anonymous account.'},
        lena:{panic:18, es:'Daniel era N0VA. O uno de los N0VA. Usaba el nombre conmigo. Pero los mensajes de esa noche no eran de él.', en:'Daniel was N0VA. Or one of the N0VAs. He used the name with me. But the messages from that night weren\'t his.'},
        victor:{panic:16, es:'N0VA se conectó desde la red interna. Lo vi en los logs. Y solo dos terminales tienen acceso a esa red.', en:'N0VA connected from the internal network. I saw it in the logs. And only two terminals have access to that network.'}}},
    E06:{num:'06',cat:'catTimeline',contradiction:true,
      name:{es:'Hueco de 17 minutos en las cámaras',en:'17-minute gap in the cameras'},
      desc:{es:'El sistema de vigilancia del edificio estuvo inactivo entre las 02:14 AM y las 02:31 AM — exactamente 17 minutos, coincidiendo con la desaparición de Daniel.',en:'The building surveillance system was inactive between 02:14 AM and 02:31 AM — exactly 17 minutes, coinciding with Daniel\'s disappearance.'},
      confront:{
        maya:{panic:10, es:'El hueco de 17 minutos no es una coincidencia. Alguien apagó las cámaras.', en:'The 17-minute gap isn\'t a coincidence. Someone turned off the cameras.'},
        ethan:{panic:12, es:'Los fallos técnicos ocurren. No significa nada.', en:'Technical failures happen. It means nothing.'},
        lena:{panic:10, es:'Daniel me dijo que el sistema se podía interrumpir manualmente. Y que solo Victor tenía la clave.', en:'Daniel told me the system could be manually interrupted. And that only Victor had the key.'},
        victor:{panic:25, es:'Está bien. Las cámaras no fallaron. Yo las apagué. Pero me obligaron.', en:'Fine. The cameras didn\'t fail. I turned them off. But I was forced to.'}}},
    E07:{num:'07',cat:'catDigital',
      name:{es:'Mensaje borrado de Daniel a Lena',en:'Deleted message from Daniel to Lena'},
      desc:{es:'Reconstrucción forense del mensaje borrado: "No confíes en nadie del edificio. Ni siquiera en los que crees que te protegen. N0VA es la clave."',en:'Forensic reconstruction of the deleted message: "Don\'t trust anyone in the building. Not even the ones you think protect you. N0VA is the key."'},
      confront:{
        maya:{panic:8, es:'Lena lo borró. No quiero imaginar por qué.', en:'Lena deleted it. I don\'t want to imagine why.'},
        ethan:{panic:10, es:'Ese mensaje no dice nada concreto.', en:'That message doesn\'t say anything concrete.'},
        lena:{panic:25, es:'Sí. Lo borré. Pero tengo la copia. Aquí está.', en:'Yes. I deleted it. But I have the copy. Here it is.'},
        victor:{panic:8, es:'No sabía que Daniel le había escrito a alguien afuera esa noche.', en:'I didn\'t know Daniel had texted someone outside that night.'}}},
    E08:{num:'08',cat:'catDigital',
      name:{es:'Archivo cifrado de Daniel',en:'Daniel\'s encrypted file'},
      desc:{es:'Lena Park entrega el archivo cifrado que Daniel le envió a la 01:52 AM. Contiene transferencias bancarias, nombres de cuentas en el extranjero, y una firma digital que coincide con la de Ethan Cole.',en:'Lena Park hands over the encrypted file Daniel sent her at 01:52 AM. It contains bank transfers, foreign account names, and a digital signature matching Ethan Cole\'s.'},
      confront:{
        maya:{panic:12, es:'Ese archivo. Daniel me dijo que lo había hecho. Nunca lo vi completo.', en:'That file. Daniel told me he had made it. I never saw it complete.'},
        ethan:{panic:30, es:'No... eso no es mío. La firma puede ser falsificada. Cualquiera puede...', en:'No... that\'s not mine. The signature can be forged. Anyone can...'},
        lena:{panic:15, es:'Lo abrí con la clave que Daniel me dio hace meses. La firma es de Ethan.', en:'I opened it with the key Daniel gave me months ago. The signature is Ethan\'s.'},
        victor:{panic:14, es:'Ahí está. Todo lo que Daniel estaba investigando.', en:'There it is. Everything Daniel was investigating.'}}},
    E09:{num:'09',cat:'catTestimony',
      name:{es:'Log de acceso de N0VA',en:'N0VA access log'},
      desc:{es:'El log de la red interna muestra que la sesión N0VA se inició a la 01:52 AM desde la terminal de Ethan Cole. Solo Ethan tiene la contraseña de esa terminal.',en:'The internal network log shows the N0VA session started at 01:52 AM from Ethan Cole\'s terminal. Only Ethan has that terminal\'s password.'},
      confront:{
        maya:{panic:14, es:'Ethan. Fue Ethan. El log lo confirma.', en:'Ethan. It was Ethan. The log confirms it.'},
        ethan:{panic:30, es:'Ese log puede estar manipulado. Alguien pudo haber usado mi terminal.', en:'That log could be manipulated. Someone could have used my terminal.'},
        lena:{panic:16, es:'Ethan usó su terminal para amenazar a Daniel. Eso es lo que significa.', en:'Ethan used his terminal to threaten Daniel. That\'s what it means.'},
        victor:{panic:18, es:'N0VA se conectó desde la terminal de Ethan. Lo vi. Y guardé copia del log.', en:'N0VA connected from Ethan\'s terminal. I saw it. And I kept a copy of the log.'}}},
    E10:{num:'10',cat:'catTestimony',contradiction:true,
      name:{es:'Llamada a Victor a las 02:14',en:'Call to Victor at 02:14'},
      desc:{es:'Victor Rayne admite haber recibido una llamada a las 02:14 AM ordenándole apagar las cámaras. Reconoce la voz como la de Ethan Cole.',en:'Victor Rayne admits to receiving a call at 02:14 AM ordering him to turn off the cameras. He recognizes the voice as Ethan Cole\'s.'},
      confront:{
        maya:{panic:16, es:'Ethan llamó a Victor. Ethan apagó las cámaras sin tocarlas. Eso es lo que hizo.', en:'Ethan called Victor. Ethan turned off the cameras without touching them. That\'s what he did.'},
        ethan:{panic:30, es:'Victor miente. Victor miente porque sabe que si me hunde a mí, se salva él.', en:'Victor is lying. Victor is lying because he knows that if he drags me down, he saves himself.'},
        lena:{panic:14, es:'Victor lo admitió. Ethan le ordenó apagar las cámaras.', en:'Victor admitted it. Ethan ordered him to turn off the cameras.'},
        victor:{panic:25, es:'Sí. Me llamó. Reconocí su voz. Ethan Cole me dijo que apagara las cámaras o me iba a arrepentir.', en:'Yes. He called me. I recognized his voice. Ethan Cole told me to turn off the cameras or I\'d regret it.'}}}
  },

  fileSections:{
    S01:{title:{es:'SECCIÓN 01 — PATRÓN DE TRANSFERENCIAS',en:'SECTION 01 — TRANSFER PATTERN'},
      body:{es:'Encontré un patrón. Cada vez que se aprueba una compra de equipos, hay una transferencia paralela a una cuenta en el extranjero. Los montos no coinciden con los equipos. La diferencia se pierde en cuentas que no deberían existir. Las transferencias están firmadas por E.C.',
            en:'I found a pattern. Every time an equipment purchase is approved, there\'s a parallel transfer to a foreign account. The amounts don\'t match the equipment. The difference vanishes into accounts that shouldn\'t exist. The transfers are signed by E.C.'}},
    S02:{title:{es:'SECCIÓN 02 — N0VA',en:'SECTION 02 — N0VA'},
      body:{es:'Alguien me está escribiendo como N0VA. Usa la red interna. Me dice que deje de investigar. Al principio pensé que era una broma. Después de la tercera amenaza, dejó de ser gracioso.\n\nLe respondí: "Sé quién eres". No le dije la verdad. No sé quién es. Pero él no lo sabe.',
            en:'Someone is writing to me as N0VA. They\'re using the internal network. Telling me to stop investigating. At first I thought it was a joke. After the third threat, it stopped being funny.\n\nI replied: "I know who you are." I didn\'t tell the truth. I don\'t know who it is. But they don\'t know that.'}},
    S03:{title:{es:'SECCIÓN 03 — LAS CÁMARAS',en:'SECTION 03 — THE CAMERAS'},
      body:{es:'El sistema de vigilancia se puede interrumpir manualmente desde la sala de seguridad. Solo Victor tiene la clave maestra. Si alguien quiere desaparecer sin dejar rastro, necesita a Victor. Y Victor no hace nada gratis.',
            en:'The surveillance system can be manually interrupted from the security room. Only Victor has the master key. If someone wants to disappear without a trace, they need Victor. And Victor doesn\'t do anything for free.'}},
    S04:{title:{es:'SECCIÓN 04 — LENA',en:'SECTION 04 — LENA'},
      body:{es:'Le di a Lena la clave del archivo cifrado. Si algo me pasa, ella lo abrirá. Le dije que no confiara en nadie del edificio. Ni siquiera en mí. Porque yo también estoy dentro, y no sé a quién puedo creerle ya.',
            en:'I gave Lena the key to the encrypted file. If something happens to me, she\'ll open it. I told her not to trust anyone in the building. Not even me. Because I\'m inside too, and I don\'t know who I can believe anymore.'}},
    S05:{title:{es:'SECCIÓN 05 — NOTA FINAL',en:'SECTION 05 — FINAL NOTE'},final:true,
      body:{es:'Si estás leyendo esto, significa que algo salió mal.\n\nEsta noche:\n01:40 — Hablé con Maya. Le dije todo.\n01:52 — Le mandé el archivo a Lena.\n02:01 — Entré al edificio.\n02:08 — Alguien más entró. Lo escuché.\n02:13 — Estoy grabando esto porque no sé si voy a salir.\n\nEl N0VA que me amenazó esta noche no era yo. Alguien más usó mi identidad. Y esa persona tiene acceso a la red interna.\n\nSolo cuatro personas tienen ese acceso: Maya, Ethan, Victor y yo.\n\nMaya me dijo que no fuera. Victor apagó las cámaras. Y Ethan firmó los borrados.\n\nSi algo me pasa, miren a quien tenía más que perder. Miren a quien controla la red. Miren a quien firmó las transferencias.\n\n— D.M.\n\nP.D. N0VA nunca fue una sola persona. Siempre fuimos dos.',
            en:'If you\'re reading this, something went wrong.\n\nTonight:\n01:40 — I talked to Maya. I told her everything.\n01:52 — I sent the file to Lena.\n02:01 — I entered the building.\n02:08 — Someone else entered. I heard them.\n02:13 — I\'m recording this because I don\'t know if I\'m getting out.\n\nThe N0VA that threatened me tonight wasn\'t me. Someone else used my identity. And that person has access to the internal network.\n\nOnly four people have that access: Maya, Ethan, Victor and me.\n\nMaya told me not to go. Victor turned off the cameras. And Ethan signed the deletions.\n\nIf something happens to me, look at who had the most to lose. Look at who controls the network. Look at who signed the transfers.\n\n— D.M.\n\nP.S. N0VA was never one person. We were always two.'}}
  },

const SETTINGS_KEY = 'cfu_settings';

function freshSuspects(caseData){
  const out = {};
  Object.keys(caseData.suspects).forEach(sid=>{
    out[sid] = { panic:0, suspicion:30, asked:{} };
  });
  return out;
}

function freshCaseState(caseId){
  const cd = CASES[caseId];
  return {
    caseId: caseId,
    screen:'dashboard',
    score: 0,
    evidence: [],
    contradictions: [],
    leads: [],
    fileSections: [],
    askedLeads: [],
    timeline: [],
    fired: {},
    logs: {},
    currentSuspect: null,
    caseTab: 'victim',
    suspects: freshSuspects(cd),

    accused: null,

}

function freshGlobalSettings(){
  return {
    lang: localStorage.getItem('cfu_lang') || 'es',
    sound: true
  };
}

let gameState = {
  screen: 'menu',
  currentCaseId: null,
  settings: freshGlobalSettings(),
  caseStates: {}
};

function currentCase(){ return gameState.currentCaseId ? CASES[gameState.currentCaseId] : null; }
function currentCaseState(){
  if(!gameState.currentCaseId) return null;
  if(!gameState.caseStates[gameState.currentCaseId]){
    gameState.caseStates[gameState.currentCaseId] = freshCaseState(gameState.currentCaseId);
  }
  return gameState.caseStates[gameState.currentCaseId];
}
Object.defineProperty(gameState, 'lang', { get(){ return this.settings.lang; } });
Object.defineProperty(gameState, 'sound', { get(){ return this.settings.sound; }, set(v){ this.settings.sound = v; } });

function saveCase(caseId){
  if(!caseId) return;
  try{
    const st = gameState.caseStates[caseId];
    localStorage.setItem(SAVE_PREFIX + caseId, JSON.stringify(st));
  }catch(e){}
}
function saveSettings(){
  try{
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameState.settings));
    localStorage.setItem('cfu_lang', gameState.settings.lang);
  }catch(e){}
}
function loadCase(caseId){
  try{
    const raw = localStorage.getItem(SAVE_PREFIX + caseId);
    if(!raw) return null;
    const st = JSON.parse(raw);
    if(!st.suspects) st.suspects = freshSuspects(CASES[caseId]);
    if(!st.logs) st.logs = {};
    if(!st.decoded) st.decoded = [];
    return st;
  }catch(e){ return null; }
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      gameState.settings = Object.assign(freshGlobalSettings(), s);
    }
    const l = localStorage.getItem('cfu_lang');
    if(l) gameState.settings.lang = l;
  }catch(e){}
}
function hasSave(caseId){
  try{ return !!localStorage.getItem(SAVE_PREFIX + caseId); }catch(e){ return false; }
}
function resetCaseProgress(caseId){
  try{ localStorage.removeItem(SAVE_PREFIX + caseId); }catch(e){}
  delete gameState.caseStates[caseId];
}
function resetAllCases(){
  Object.keys(CASES).forEach(id=>resetCaseProgress(id));
}

   6. AUDIO
   ============================================================================ */
let audioCtx = null;
function ac(){
  if(!gameState.settings.sound) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}
function tone(freq, dur, type, vol, delay){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.05, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const SFX = {
  click(){ tone(420,0.05,'square',0.035); },
  ev(){ tone(660,0.1,'sine',0.06); tone(990,0.16,'sine',0.05,0.09); },
  contradiction(){ tone(180,0.18,'sawtooth',0.06); tone(140,0.28,'sawtooth',0.05,0.12); },
  warn(){ tone(110,0.3,'sawtooth',0.06); },
  panic(){ tone(300,0.09,'triangle',0.05); tone(460,0.09,'triangle',0.05,0.07); },
  solved(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.35,'sine',0.06,i*0.13)); },
  wrong(){ [340,260,190,130].forEach((f,i)=>tone(f,0.3,'sawtooth',0.06,i*0.13)); },
  lead(){ tone(880,0.08,'sine',0.05); tone(1174,0.12,'sine',0.045,0.08); },
  decode(){ tone(1200,0.08,'sine',0.05); tone(1600,0.12,'sine',0.045,0.07); tone(2000,0.18,'sine',0.04,0.14); },
  glitch(){ tone(90,0.12,'sawtooth',0.05); tone(60,0.18,'square',0.04,0.08); }
};

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function panicBand(p){ if(p<=25) return 0; if(p<=50) return 1; if(p<=75) return 2; if(p<=99) return 3; return 4; }
function panicStatusKey(p){
  if(p<=25) return 'stCalm';
  if(p<=50) return 'stUneasy';
  if(p<=75) return 'stNervous';
  if(p<=99) return 'stPanicked';
  return 'stBreaking';
}
function blockBar(p){
  const n = Math.max(0, Math.min(10, Math.round(p/10)));
  return '█'.repeat(n) + '░'.repeat(10-n);
}
function pick(arr, band){ if(!arr||!arr.length) return t('nothingToSay'); return arr[Math.min(band, arr.length-1)]; }
function fmt(str, obj){
  let out = str;
  Object.keys(obj||{}).forEach(k=>{ out = out.split('{'+k+'}').join(obj[k]); });
  return out;
}
function toast(msg, kind){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind?(' '+kind):'');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, 3400);
}
function addScore(n, silent){
  const cs = currentCaseState();
  if(!cs) return;
  cs.score = Math.max(0, cs.score + n);
  if(!silent){
    if(n>0) toast(fmt(t('scorePlus'), {n:n}), '');
    else if(n<0) toast(fmt(t('scoreMinus'), {n:n}), 'red');
  }
  updateTopbar();
}

function addEvidence(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return false;
  if(cs.evidence.includes(id)) return false;
  const e = cd.evidence[id];
  if(!e) return false;
  cs.evidence.push(id);
  if(e.contradiction && !cs.contradictions.includes(id)) cs.contradictions.push(id);
  if(e.contradiction) SFX.contradiction(); else SFX.ev();
  toast(t('evDiscovered') + ' — #' + e.num, e.contradiction ? 'red' : '');
  addScore(10, true);
  if(e.contradiction){
    setTimeout(()=>toast(t('contradictionDetected'), 'red'), 400);
    addScore(15, true);
  }
  cd.timeline.forEach(tl=>{ if(tl.req===id && !cs.timeline.includes(tl.id)) cs.timeline.push(tl.id); });
  updateFileSections();
  saveCase(cd.id);
  return true;
}
function updateFileSections(){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const map = {S01:'E03', S02:'E04', S03:'E05', S04:'E06'};
  const map2 = {S01:'E08', S02:'E05', S03:'E06', S04:'E07'};
  const activeMap = cd.id === 'case001' ? map : map2;
  Object.keys(activeMap).forEach(s=>{
    if(cs.evidence.includes(activeMap[s]) && !cs.fileSections.includes(s)){
      cs.fileSections.push(s);
    }
  });
  const base = ['S01','S02','S03','S04'];
  if(base.every(s=>cs.fileSections.includes(s)) && !cs.fileSections.includes('S05')){
    cs.fileSections.push('S05');
  }
}
function addLead(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  if(cs.leads.includes(id)) return;
  const ld = cd.leads[id];
  if(!ld) return;
  cs.leads.push(id);
  raiseSuspicion(ld.target, 8);
  SFX.lead();
  toast(t('newLead'), 'amber');
}
function raiseSuspicion(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  s.suspicion = Math.max(0, Math.min(100, s.suspicion + n));
}

function addPanic(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  const before = s.panic;
  s.panic = Math.max(0, Math.min(100, s.panic + n));
  if(s.panic > before && n > 0){
    SFX.panic();
    raiseSuspicion(sid, Math.round(n/3));
  }
  checkBreaks(sid);
}
function checkBreaks(sid){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const list = cd.breaks[sid] || [];
  const p = cs.suspects[sid].panic;
  list.forEach((b, i)=>{
    const key = sid + '_' + i;
    if(p >= b.at && !cs.fired[key]){
      cs.fired[key] = true;
      if(b.msg) pushLog(sid, {kind:'sys', text:b.msg, cls:'amber'});
      if(b.ev){
        const isNew = addEvidence(b.ev);
        if(isNew && b.lie){
          setTimeout(()=>toast(t('lieDetected'), 'red'), 500);
          addScore(20, true);
        }
      }
      if(b.lead) addLead(b.lead);
      if(b.confession){
        pushLog(sid, {kind:'sys', text:{es:'CONFESIÓN DESBLOQUEADA — '+cd.suspects[sid].name+' ha dicho todo lo que sabe.', en:'CONFESSION UNLOCKED — '+cd.suspects[sid].name+' has said everything they know.'}, cls:''});
        toast(t('confessionUnlocked'), '');
        addScore(25, true);
      }
    }
  });
}
function pushLog(sid, entry){
  const cs = currentCaseState();
  if(!cs) return;
  if(!cs.logs[sid]) cs.logs[sid] = [];
  cs.logs[sid].push(entry);
}

      <div class="ctitle">${esc(L(lc.title))}</div>
      <span class="cstatus locked">${esc(t('statusLocked'))}</span>
    </div>`).join('');

  return `
  <div class="panel">
    <div class="panel-title">${esc(t('caseDatabase'))} <span class="dim">${esc(t('caseDatabaseSub'))}</span></div>
    <div class="grid cases">${cards}${locked}</div>
  </div>
  <div class="row mt16">
    <button class="btn" data-act="menu">${esc(t('backToMenu'))}</button>
    <button class="btn" data-act="instructions">${esc(t('instructions'))}</button>
  </div>`;
}

function viewCaseScreen(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cs){ gameState.screen='database'; return viewDatabase(); }

  switch(cs.screen){
    case 'dashboard':   return viewDashboard();
    case 'suspects':    return viewSuspects();
    case 'interrogation': return viewInterrogation();
    case 'casefile':    return viewCaseFile();
    case 'accuse':      return viewAccuse();
    default:            return viewDashboard();
  }
}

function viewDashboard(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cs) return '';
  const tabs = [
    ['victim', t('tabVictim')],
    ['timeline', t('tabTimeline')],
    ['evidence', t('tabEvidence')],
    ['relations', t('tabRelations')],
    ['file', t('tabFile')]
  ];
  if(cd.id === 'case002'){
    tabs.push(['transmissions', t('tabTransmissions')]);
    tabs.push(['surveillance', t('tabSurveillance')]);
  }
  tabs.push(['leads', t('tabLeads')]);

  return `
  <div class="panel">
    <div class="panel-title">${esc(t('caseNo'))} #${cd.number} — ${esc(L(cd.title))} <span class="dim">${esc(t('classified'))}</span></div>
    <p style="color:#b9cbcd;margin-bottom:8px">${esc(L(cd.victim.story))}</p>
    <div class="row mt10">
      <button class="btn green small" data-act="go-suspects">${esc(t('suspects'))} ▶</button>
      <button class="btn red small" data-act="accusescreen">${esc(t('accuseSuspect'))}</button>
      <button class="btn small" data-act="reset-case">${esc(t('resetCase'))}</button>
      <button class="btn small" data-act="database">${esc(t('backToDatabase'))}</button>
    </div>
  </div>
  <div class="tabs">
    ${tabs.map(([id,label])=>`<button class="tab ${cs.caseTab===id?'active':''}" data-act="tab" data-tab="${id}">${esc(label)}</button>`).join('')}
  </div>
  ${renderCaseTab(cs.caseTab)}`;
}

function renderCaseTab(tab){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cs) return '';
  switch(tab){
    case 'victim':       return tabVictim();
    case 'timeline':     return tabTimeline();
    case 'evidence':     return tabEvidence();
    case 'relations':    return tabRelations();
    case 'file':         return tabFile();
    case 'leads':        return tabLeads();
    case 'transmissions': return tabTransmissions();
    case 'surveillance': return tabSurveillance();
  }
  return '';
}

function tabTimeline(){
  const cd = currentCase(); const cs = currentCaseState();
  const known = cd.timeline.filter(x=>x.start || cs.timeline.includes(x.id) || cs.evidence.includes(x.req));
  const items = known.sort((a,b)=>a.order-b.order).map(x=>`
    <div class="tl-item ${x.crit?'crit':''}">

function tabRelations(){
  const cd = currentCase(); const cs = currentCaseState();
  const relColor = { adrian:'r-friend', valeria:'r-class', marcos:'r-acq', sofia:'r-girl',
                     maya:'r-friend', ethan:'r-class', lena:'r-friend', victor:'r-acq' };
  const relLabel = { adrian:t('relFriend'), valeria:t('relClass'), marcos:t('relAcq'), sofia:t('relGirl'),
                     maya:t('relCoworker'), ethan:t('relSupervisor'), lena:t('relFriend2'), victor:t('relSecurity') };
  let map = `<span class="node">${cd.victim.name.toUpperCase()}</span>\n│\n`;
  const ids = Object.keys(cd.suspects);
  ids.forEach((id,i)=>{
    const last = i===ids.length-1;
    const p = cd.suspects[id];
    map += `${last?'└──':'├──'} <span class="${relColor[id]||'r-friend'}">${p.name}</span> — ${relLabel[id]||'?'}\n`;
  });
  let hidden = '';
  if(cd.id === 'case001'){
    if(cs.evidence.includes('E03')) hidden += `<div>▸ Adrián no estuvo en casa toda la noche.</div>`;
    if(cs.evidence.includes('E04')) hidden += `<div>▸ Valeria sí vio a Yael la noche del crimen.</div>`;
    if(cs.evidence.includes('E05')) hidden += `<div>▸ Marcos regresó a la zona después de decir que se había ido.</div>`;
    if(cs.evidence.includes('E06')) hidden += `<div>▸ Sofía borró mensajes. No por culpa: por miedo.</div>`;
    if(cs.leads.includes('L4')) hidden += `<div>▸ Yael le tenía miedo a alguien. Sofía lo sabe.</div>`;
  }else{
    if(cs.evidence.includes('E03')) hidden += `<div>▸ Maya mintió sobre la duración de la llamada.</div>`;
    if(cs.evidence.includes('E04')) hidden += `<div>▸ Ethan firmó la orden de borrado de registros.</div>`;
    if(cs.evidence.includes('E05')) hidden += `<div>▸ N0VA usó la terminal de Ethan para amenazar a Daniel.</div>`;
    if(cs.evidence.includes('E06')) hidden += `<div>▸ Victor apagó las cámaras manualmente. El "fallo" fue intencional.</div>`;
    if(cs.evidence.includes('E07')) hidden += `<div>▸ Lena borró un mensaje que advertía sobre N0VA.</div>`;
  }
  if(!hidden) hidden = `<div class="dim">${esc(t('relHiddenText'))}</div>`;
  return `<div class="panel">
    <div class="panel-title">${esc(t('relationships'))}</div>
    <div class="relmap">${map}</div>
  </div>
  <div class="panel">
    <div class="panel-title red">${esc(t('relHidden'))}</div>
    <div style="font-size:13.5px;color:#b9cbcd;line-height:1.9">${hidden}</div>
  </div>`;
}

function tabLeads(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cs.leads.length){
    return `<div class="panel"><div class="panel-title">${esc(t('tabLeads'))}</div><div class="dim">${esc(t('noLeads'))}</div></div>`;

  let html = '';
  cs.leads.forEach(id=>{
    const ld = cd.leads[id];

    const verified = cs.askedLeads.includes(id);

    html += `<div class="evcard ${ld.falseAccusation?'contra':''}">

      <div class="evname">${esc(t('leadTarget'))}: ${cd.suspects[ld.target].name}</div>
      <div class="evdesc">${esc(L(ld.text))}</div>

  });
  return `<div class="panel"><div class="panel-title">${esc(t('tabLeads'))}</div>${html}</div>`;

function tabTransmissions(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd.transmissions) return '';
  let html = '';
  cd.transmissions.forEach(tx=>{
    const unlocked = !tx.req || cs.evidence.includes(tx.req);
    const decoded = cs.decoded.includes(tx.id);
    if(!unlocked){
      html += `<div class="tx-item locked">
        <div class="tx-head">
          <div class="tx-num">${esc(tx.id)}</div>
          <div class="tx-time">${esc(tx.time)}</div>
        </div>
        <div class="tx-body">${esc(t('transmissionLocked'))} · ${esc(t('decodeHint').replace('{ev}', '#'+tx.req))}</div>
      </div>`;
      return;
    }
    if(tx.corrupted && !decoded){
      html += `<div class="tx-item corrupted">
        <div class="tx-head">
          <div class="tx-num">${esc(tx.id)}</div>
          <div class="tx-time">${esc(tx.time)}</div>
        </div>
        <div class="tx-body">${esc(L(tx.corruptedText))}</div>
        <button class="tx-decode" data-act="decode" data-txid="${tx.id}">${gameState.settings.lang==='es'?'DESCIFRAR':'DECODE'}</button>
      </div>`;
      return;
    }
    html += `<div class="tx-item ${tx.corrupted?'decoded':''}">
      <div class="tx-head">
        <div class="tx-num">${esc(tx.id)}</div>
        <div class="tx-time">${esc(tx.time)}</div>
      </div>
      <div class="tx-body">${esc(L(tx.text))}</div>
      ${tx.bg ? `<div class="small dim mt10">${esc(L(tx.bg))}</div>` : ''}

  return `<div class="panel">
    <div class="panel-title purple">${esc(t('tabTransmissions'))} <span class="dim">${cs.decoded.length}/${cd.transmissions.length} ${gameState.settings.lang==='es'?'descifradas':'decoded'}</span></div>

  </div>`;
}

function viewInterrogation(){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  if(!sid){ cs.screen='suspects'; return viewSuspects(); }
  const p = cd.suspects[sid];
  const s = cs.suspects[sid];
  const critical = s.panic >= 76;

  const qs = cd.questions.filter(q=>{
    if(q.only && !q.only.includes(sid)) return false;
    if(q.cond === 'contradictions' && cs.contradictions.length === 0) return false;
    if(q.reqEv && !cs.evidence.includes(q.reqEv)) return false;
    if(q.reqLead && !cs.leads.includes(q.reqLead)) return false;
    return true;
  });
  const qHtml = qs.map(q=>{
    const times = s.asked[q.id]||0;
    const cls = 'qbtn' + (times?' used':'') + (q.id.indexOf('q_lead_')===0?' lead':'');
    return `<button class="${cls}" data-act="ask" data-qid="${q.id}">${esc(L(q.text))}${times?` <span class="dim">(${esc(t('interrogateAgain'))} ${times})</span>`:''}</button>`;
  }).join('');

  const evHtml = cs.evidence.length
    ? cs.evidence.map(id=>{
        const e = cd.evidence[id];
        return `<button class="evbtn" data-act="confront" data-eid="${id}">#${e.num} ${esc(L(e.name))}</button>`;
      }).join('')
    : `<div class="dim small">${esc(t('noEvidenceYet'))}</div>`;

  const log = cs.logs[sid] || [];
  const logHtml = log.map((entry)=>{
    if(entry.kind === 'q'){
      const q = cd.questions.find(x=>x.id===entry.qid);
      const ans = p.answers[entry.qid];
      const txt = ans ? pick(ans[gameState.settings.lang]||ans.es, entry.band) : t('nothingToSay');
      return `<div class="msg player"><span class="who">${esc(t('questionsTitle'))}</span>${esc(q?L(q.text):entry.qid)}</div>
              <div class="msg suspect"><span class="who">${esc(p.name)}</span>${esc(txt)}</div>`;
    }
    if(entry.kind === 'c'){
      const e = cd.evidence[entry.eid];
      const resp = (e.confront && e.confront[sid]) ? L(e.confront[sid]) : t('nothingToSay');
      return `<div class="msg player"><span class="who">${esc(t('confrontation'))}</span>#${e.num} ${esc(L(e.name))}</div>
              <div class="msg suspect"><span class="who">${esc(p.name)}</span>${esc(resp)}</div>`;
    }
    if(entry.kind === 'sys'){
      return `<div class="msg system ${entry.cls||''}">${esc(L(entry.text))}</div>`;
    }
    if(entry.kind === 'contra'){
      return `<div class="msg contradiction">⚠ ${esc(t('contradictionDetected'))}<br>${esc(L(entry.text))}</div>`;
    }
    return '';
  }).join('');

  return `
  <div class="interro">
    <aside class="panel suspect-panel ${critical?'critical':''}">
      <div class="avatar" style="--acc:${p.color}">${esc(p.initials)}</div>
      <div class="sname" style="font-family:var(--mono);color:#fff;letter-spacing:2px">${esc(p.name)}</div>
      <div class="srow" style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px">
        <span>${esc(t('age'))}</span><b style="color:var(--txt)">${p.age}</b>
      </div>
      <div class="srow" style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px">
        <span>${esc(t('relationship'))}</span><b style="color:${p.color}">${esc(L(p.rel))}</b>
      </div>
      <div class="mlabel"><span>${esc(t('panic'))}</span><b>${s.panic}%</b></div>
      <div class="meter"><div class="fill panic" style="width:${s.panic}%"></div></div>
      <div class="barline panic mt10">[${blockBar(s.panic)}] ${s.panic}%</div>
      <div class="mlabel"><span>${esc(t('suspicion'))}</span><b>${s.suspicion}%</b></div>
      <div class="meter"><div class="fill susp" style="width:${s.suspicion}%"></div></div>
      <div class="barline susp mt10">[${blockBar(s.suspicion)}] ${s.suspicion}%</div>
      <div class="mt10" style="font-family:var(--mono);font-size:11px;letter-spacing:1px;color:${critical?'var(--red)':'var(--dim)'}">
        ${esc(t('status'))}: ${esc(t(panicStatusKey(s.panic)))}
      </div>
      <button class="btn small mt16" data-act="suspects">${esc(t('backToSuspects'))}</button>
      <button class="btn small red mt10" data-act="accusescreen">${esc(t('accuseSuspect'))}</button>
    </aside>

    <section class="panel dialogue-panel">
      <div class="panel-title">${esc(t('interrogating'))}: ${esc(p.name)} <span class="dim">${esc(t('caseNo'))} #${cd.number}</span></div>
      <div class="log" id="log">
        ${logHtml || `<div class="msg system">${esc(t('selectEvidence'))}</div>`}
      </div>
    </section>

    <aside class="panel action-panel">
      <div class="panel-title">${esc(t('questionsTitle'))}</div>
      <div class="qlist">${qHtml}</div>
      <div class="panel-title red">${esc(t('confrontTitle'))}</div>
      <div>${evHtml}</div>
    </aside>
  </div>`;
}

function askQuestion(qid){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  const s = cs.suspects[sid];
  const p = cd.suspects[sid];
  const q = cd.questions.find(x=>x.id===qid);
  if(!q) return;

  const times = s.asked[qid] || 0;
  const band = panicBand(s.panic);
  const ans = p.answers[qid];

  if(qid.indexOf('q_lead_') === 0){
    let leadId = null;
    if(qid === 'q_lead_adrian' || qid === 'q_lead_maya') leadId = 'L1';
    else if(qid === 'q_lead_valeria' || qid === 'q_lead_ethan') leadId = 'L2';
    else if(qid === 'q_lead_marcos' || qid === 'q_lead_victor') leadId = 'L3';
    else if(qid === 'q_lead_sofia') leadId = 'L4';
    if(leadId && !cs.askedLeads.includes(leadId)){
      cs.askedLeads.push(leadId);
      const ld = cd.leads[leadId];
      if(ld && ld.falseAccusation){ addScore(30, true); toast(t('falseAccusation'), 'amber'); }
      else { addScore(15, true); }
      if(ld) raiseSuspicion(ld.target, 10);
    }
  }

  let panicGain = 0;
  const prevBest = s.asked[qid] !== undefined ? s.asked[qid] : -1;
  if(times === 0){
    panicGain = q.panic;
    s.asked[qid] = band;
  }else{
    if(band > prevBest){
      panicGain = Math.round(q.panic * 0.6);
      s.asked[qid] = band;
    }else{
      addScore(-5, true);
      toast(t('irrelevant'), 'red');
      panicGain = 0;
    }
  }

  pushLog(sid, {kind:'q', qid:qid, band:band});
  if(panicGain > 0) addPanic(sid, panicGain);
  SFX.click();

  if(qid==='q_motive' || qid==='q_hiding') raiseSuspicion(sid, 3);

  saveCase(cd.id);

  if(conf){

    if(conf.panic >= 20) raiseSuspicion(sid, 12);
    else if(conf.panic >= 10) raiseSuspicion(sid, 6);

const CURRENT_VERSION = "1.0.0";
const UPDATE_STORAGE_KEY = "case_files_unknown_update_seen";

/* ---------------------------------------------------------------------------
   ESCAPAR TEXTO

function escapeHTML(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ---------------------------------------------------------------------------
   COMPROBAR ACTUALIZACIONES
   --------------------------------------------------------------------------- */

async function checkForUpdates() {
  try {
    const response = await fetch(
      "./version.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) return;

    const data = await response.json();

    // Si version.json no tiene una versión válida, no hacemos nada
    if (!data.version) return;

    // Si estamos en la versión más reciente, no mostramos nada
    if (data.version === CURRENT_VERSION) {
      return;
    }

    // Comprobar si el jugador ya vio/aceptó esta versión
    const alreadySeen = localStorage.getItem(
      UPDATE_STORAGE_KEY
    );

    if (alreadySeen === data.version) {
      return;
    }

    showUpdateNotification(data);

  } catch (error) {
    // Silencioso: si no hay conexión o version.json no está disponible,
    // el juego continúa funcionando normalmente.
    console.log("Could not check for updates.");
  }
}

  document.body.appendChild(wrap);

  /* -------------------------------------------------------------------------
     BOTÓN UPDATE NOW
     ------------------------------------------------------------------------- */

  document
    .getElementById("updateNowButton")
    .addEventListener("click", () => {

      /*
       * Guardamos la versión que el jugador aceptó.
       * Así no volveremos a mostrar esta misma actualización
       * después de recargar.
       */
      localStorage.setItem(
        UPDATE_STORAGE_KEY,
        update.version
      );

      /*
       * Recargar la página para obtener los archivos
       * más recientes publicados en GitHub Pages.
       */
      window.location.reload();
    });

  /* -------------------------------------------------------------------------
     BOTÓN LATER
     ------------------------------------------------------------------------- */

  document
    .getElementById("updateLaterButton")
    .addEventListener("click", () => {

      /*
       * Cerramos la ventana, pero NO guardamos la versión.
       *
       * Esto significa que si el jugador vuelve a abrir el juego,
       * se le volverá a avisar de la actualización.
       */
      wrap.remove();
    });
}

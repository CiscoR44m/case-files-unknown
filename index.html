<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CASE FILES: UNKNOWN — CLASSIFIED INVESTIGATION DATABASE</title>
<style>
:root{
  --bg:#05070a;
  --panel:#0b1013;
  --panel2:#101820;
  --panel3:#141e26;
  --line:#1d2a30;
  --line2:#26383f;
  --red:#ff2e3a;
  --red-d:#7a0b12;
  --green:#2bff9e;
  --green-d:#0b6b45;
  --amber:#ffb020;
  --blue:#4fc3f7;
  --aqua:#00e5ff;
  --aqua-d:#006b7a;
  --purple:#b47bff;
  --txt:#c6d4d6;
  --dim:#61777c;
  --mono:'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;
  overscroll-behavior-y:none;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,46,58,.06), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(43,255,158,.05), transparent 45%);
  background-attachment:fixed;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#080b0e}
::-webkit-scrollbar-thumb{background:#1e2c33;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2c4049}
#crt{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:repeating-linear-gradient(to bottom,
     rgba(255,255,255,.028) 0px,
     rgba(255,255,255,.028) 1px,
     transparent 1px, transparent 3px);
}
#crt::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.72) 100%);
}
#crt::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(43,255,158,.02),rgba(255,46,58,.02));
  animation:flicker 6s infinite steps(1);
}
@keyframes flicker{0%,96%{opacity:1}97%{opacity:.85}98%{opacity:1}99%{opacity:.92}}

#topbar{
  position:sticky;top:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + var(--safe-top)) calc(14px + var(--safe-right)) 8px calc(14px + var(--safe-left));
  background:linear-gradient(180deg,#080c10 0%,#05070a 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 22px rgba(0,0,0,.75);flex-wrap:wrap;
}
.brand{
  font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--red);
  text-shadow:0 0 8px rgba(255,46,58,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;
}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scorebox{
  font-family:var(--mono);font-size:12px;letter-spacing:1px;
  color:var(--green);border:1px solid var(--green-d);
  padding:4px 9px;border-radius:3px;background:rgba(43,255,158,.05);
  white-space:nowrap;
}
.tbtn{
  font-family:var(--mono);font-size:11px;letter-spacing:1px;
  background:#0d141a;color:var(--txt);
  border:1px solid var(--line2);border-radius:3px;
  padding:6px 10px;cursor:pointer;transition:.15s;white-space:nowrap;
  min-height:36px;
}
.tbtn:hover{background:#16222a;border-color:var(--green-d);color:var(--green)}
.tbtn.off{opacity:.45}
.langwrap{position:relative}
.langmenu{
  display:none;position:absolute;right:0;top:110%;z-index:950;
  background:#0b1217;border:1px solid var(--line2);border-radius:4px;
  min-width:180px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.8);
}
.langmenu.open{display:block;animation:pop .15s ease}
.langmenu .langtitle{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:2px;padding:4px 8px 8px;
}
.langmenu button{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  color:var(--txt);font-size:13px;padding:10px;border-radius:3px;cursor:pointer;
  min-height:40px;
}
.langmenu button:hover{background:#16222a}
.langmenu button.active{background:rgba(43,255,158,.1);color:var(--green);font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

main{
  max-width:1400px;margin:0 auto;
  padding:18px calc(14px + var(--safe-right)) calc(60px + var(--safe-bottom)) calc(14px + var(--safe-left));
}
.screen{animation:screenIn .35s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:700;letter-spacing:1px}
.panel{
  background:linear-gradient(180deg,rgba(16,24,32,.9),rgba(11,16,19,.95));
  border:1px solid var(--line);border-radius:5px;padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 8px 26px rgba(0,0,0,.5);
}
.panel + .panel{margin-top:14px}
.panel-title{
  font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--green);
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel-title.red{color:var(--red)}
.panel-title.purple{color:var(--purple)}
.panel-title.aqua{color:var(--aqua)}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.small{font-size:12px}

.btn{
  font-family:var(--mono);font-size:13px;letter-spacing:2px;
  background:linear-gradient(180deg,#101a21,#0a1015);
  color:var(--txt);border:1px solid var(--line2);border-radius:4px;
  padding:13px 18px;cursor:pointer;transition:.16s;text-align:center;
  display:block;width:100%;position:relative;overflow:hidden;
  min-height:48px;touch-action:manipulation;
}
.btn:hover:not(:disabled){border-color:var(--green);color:var(--green);background:#122029;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.red{border-color:var(--red-d);color:#ffb3b7}
.btn.red:hover:not(:disabled){border-color:var(--red);color:var(--red);background:#22090c}
.btn.green{border-color:var(--green-d);color:var(--green)}
.btn.green:hover:not(:disabled){background:#0c2018}
.btn.purple{border-color:#4a2c7a;color:#d7b3ff}
.btn.purple:hover:not(:disabled){background:#1a0f2a;border-color:var(--purple)}
.btn.aqua{border-color:var(--aqua-d);color:var(--aqua)}
.btn.aqua:hover:not(:disabled){background:#041e26;border-color:var(--aqua)}
.btn.small{padding:8px 12px;font-size:11px;min-height:40px}

.menu-wrap{max-width:720px;margin:4vh auto;text-align:center}
.menu-title{
  font-size:clamp(24px,7vw,52px);
  letter-spacing:clamp(2px,1vw,4px);color:#fff;line-height:1.15;
  text-shadow:0 0 18px rgba(255,46,58,.55), 0 0 3px #fff;
  position:relative;animation:glitchShadow 4s infinite;word-break:break-word;
}
@keyframes glitchShadow{
  0%,92%{text-shadow:0 0 18px rgba(255,46,58,.55),0 0 3px #fff}
  93%{text-shadow:3px 0 0 #ff2e3a,-3px 0 0 #2bff9e,0 0 18px rgba(255,46,58,.6)}
  95%{text-shadow:-3px 0 0 #ff2e3a,3px 0 0 #2bff9e,0 0 18px rgba(255,46,58,.6)}
  97%{text-shadow:0 0 18px rgba(255,46,58,.55),0 0 3px #fff}
}
.menu-sub{font-family:var(--mono);color:var(--dim);letter-spacing:3px;font-size:12px;margin-top:12px}
.menu-classified{
  display:inline-block;margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:2px;
  color:var(--red);border:1px solid var(--red-d);padding:6px 14px;border-radius:2px;
  background:rgba(255,46,58,.06);animation:pulseRed 2.6s infinite;max-width:100%;
}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 rgba(255,46,58,0)}50%{box-shadow:0 0 18px rgba(255,46,58,.35)}}
.menu-buttons{margin-top:34px;display:flex;flex-direction:column;gap:11px}
.menu-foot{margin-top:26px;font-family:var(--mono);font-size:10px;color:#33454b;letter-spacing:1px;line-height:1.7}

.grid{display:grid;gap:14px}
.grid.suspects{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.grid.cases{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.casecard{
  background:linear-gradient(180deg,#0e161c,#090f13);
  border:1px solid var(--line);border-radius:6px;padding:16px;
  transition:.18s;position:relative;overflow:hidden;
}
.casecard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#2bff9e);opacity:.6;
}
.casecard:hover{border-color:var(--acc,#2bff9e);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.casecard.locked{opacity:.45;cursor:not-allowed}
.casecard.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.casecard .cnum{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--red)}
.casecard .ctitle{font-family:var(--mono);font-size:17px;letter-spacing:1.5px;color:#fff;margin-top:6px;line-height:1.25;word-break:break-word}
.casecard .cdesc{font-size:13px;color:#9fb3b6;margin-top:10px;line-height:1.55}
.casecard .cstatus{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:2px;
  padding:3px 8px;border-radius:2px;margin-top:10px;
}
.casecard .cstatus.available{color:var(--green);border:1px solid var(--green-d);background:rgba(43,255,158,.05)}
.casecard .cstatus.progress{color:var(--amber);border:1px solid #6b4a06;background:rgba(255,176,32,.06)}
.casecard .cstatus.complete{color:var(--blue);border:1px solid #1a5a7a;background:rgba(79,195,247,.06)}
.casecard .cstatus.locked{color:var(--dim);border:1px solid var(--line2);background:rgba(97,119,124,.05)}

.scard{
  background:linear-gradient(180deg,#0e161c,#090f13);
  border:1px solid var(--line);border-radius:6px;padding:14px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;
}
.scard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#2bff9e);opacity:.6;
}
.scard:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.scard .sname{font-family:var(--mono);font-size:15px;letter-spacing:2px;color:#fff}
.scard .srow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;gap:8px}
.scard .srow b{color:var(--txt);font-weight:600}

.meter{height:8px;background:#0a1015;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter .fill{height:100%;transition:width .6s cubic-bezier(.2,.8,.3,1);border-radius:1px}
.fill.panic{background:linear-gradient(90deg,#7a5b00,#ffb020,#ff2e3a)}
.fill.susp{background:linear-gradient(90deg,#0b6b45,#2bff9e)}
.fill.cred{background:linear-gradient(90deg,#7a0b12,#ff2e3a,#2bff9e)}
.fill.press{background:linear-gradient(90deg,#0b6b45,#ffb020,#ff2e3a)}
.mlabel{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:9px}
.mlabel b{color:var(--txt)}
.barline{font-family:var(--mono);font-size:11px;letter-spacing:1px}
.barline.panic{color:var(--amber)}
.barline.susp{color:var(--green)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:1.5px;
  background:#0c1318;border:1px solid var(--line);color:var(--dim);
  padding:8px 12px;border-radius:3px;cursor:pointer;transition:.15s;min-height:40px;
}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.active{color:var(--green);border-color:var(--green-d);background:rgba(43,255,158,.07)}
.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;font-size:14px}
.kv .k{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--dim);padding-top:3px}
.kv .v{color:#dbe7e8;word-break:break-word}

.tl-item{display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed #16232a}
.tl-item:last-child{border-bottom:0}
.tl-time{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:86px;letter-spacing:1px;flex-shrink:0}
.tl-text{font-size:14px;flex:1;min-width:0}
.tl-item.crit .tl-time{color:var(--red);text-shadow:0 0 8px rgba(255,46,58,.6)}
.tl-item.crit .tl-text{color:#ffd7d9}

.evcard{
  border:1px solid var(--line);border-left:3px solid var(--green-d);
  border-radius:4px;padding:11px 13px;margin-bottom:9px;background:#0a1116;
  animation:evIn .5s ease;
}
@keyframes evIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.evcard.contra{border-left-color:var(--red)}
.evcard .evhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.evcard .evnum{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--green)}
.evcard.contra .evnum{color:var(--red)}
.evcard .evname{font-weight:600;color:#fff;font-size:14px;margin-top:3px;word-break:break-word}
.evcard .evdesc{font-size:13px;color:#9fb3b6;margin-top:5px;line-height:1.5}
.evcard .evcat{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.locked-ev{
  font-family:var(--mono);font-size:11px;color:#33454b;border:1px dashed #1a262c;
  border-radius:4px;padding:9px 12px;margin-bottom:9px;letter-spacing:1px;
}

.relmap{font-family:var(--mono);font-size:13px;line-height:2;color:var(--txt);white-space:pre-wrap;overflow-x:auto}
.relmap .node{color:#fff}
.relmap .r-friend{color:var(--blue)}
.relmap .r-class{color:var(--green)}
.relmap .r-acq{color:var(--amber)}
.relmap .r-girl{color:#ff7bd5}
.rel-hidden{margin-top:12px;font-size:13px;color:#9fb3b6;border-left:2px solid var(--red-d);padding-left:12px}

.file-sec{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;background:#080e12}
.file-sec.locked{opacity:.4;font-family:var(--mono);font-size:12px;color:#3d5157;letter-spacing:1px}
.file-sec .fstitle{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--green);margin-bottom:7px}
.file-sec.final{border-color:var(--red-d);background:rgba(255,46,58,.04)}
.file-sec.final .fstitle{color:var(--red)}
.file-sec .fsbody{font-size:14px;color:#cfe0e2;line-height:1.65}
.file-sec.aqua{border-color:var(--aqua-d);background:rgba(0,229,255,.03)}
.file-sec.aqua .fstitle{color:var(--aqua)}

.tx-list{display:flex;flex-direction:column;gap:10px}
.tx-item{
  border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:4px;padding:11px 13px;background:#0a0f16;
  animation:evIn .4s ease;position:relative;
}
.tx-item.locked{opacity:.5;border-left-color:#3d2a5a}
.tx-item.corrupted{border-left-color:var(--red);background:rgba(255,46,58,.03)}
.tx-item.decoded{border-left-color:var(--green);background:rgba(43,255,158,.03)}
.tx-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tx-num{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--purple)}
.tx-time{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:1px}
.tx-body{font-family:var(--mono);font-size:13.5px;color:#cfe0e2;margin-top:8px;line-height:1.6;word-break:break-word}
.tx-item.corrupted .tx-body{color:#ff9ba0;text-shadow:0 0 6px rgba(255,46,58,.5);letter-spacing:2px}
.tx-item.locked .tx-body{color:#3d5157;font-style:italic}
.tx-decode{
  margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;
  color:var(--green);border:1px solid var(--green-d);border-radius:2px;
  padding:6px 10px;display:inline-block;background:transparent;cursor:pointer;
  min-height:36px;touch-action:manipulation;
}
.tx-decode:hover{background:rgba(43,255,158,.1)}

.cam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cam{
  border:1px solid var(--line);border-radius:5px;padding:12px;background:#070c10;
  position:relative;overflow:hidden;
}
.cam .cam-id{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--green)}
.cam .cam-title{font-size:14px;color:#fff;font-weight:600;margin-top:4px}
.cam .cam-status{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;margin-top:8px;padding:3px 8px;border-radius:2px;display:inline-block}
.cam .cam-status.ok{color:var(--green);border:1px solid var(--green-d)}
.cam .cam-status.gap{color:var(--red);border:1px solid var(--red-d);background:rgba(255,46,58,.06)}
.cam .cam-status.fail{color:var(--amber);border:1px solid #6b4a06;background:rgba(255,176,32,.05)}
.cam .cam-desc{font-size:13px;color:#9fb3b6;margin-top:10px;line-height:1.55}
.cam .cam-tape{
  height:34px;margin-top:10px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,#0b1318,#0b1318 4px,#0e181e 4px,#0e181e 8px);
  position:relative;overflow:hidden;
}
.cam .cam-tape::after{
  content:'';position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--amber);
  animation:tapeMove 3s linear infinite;
}
@keyframes tapeMove{from{left:0}to{left:100%}}

/* Witness comparison */
.wit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.wit{
  border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:4px;padding:11px 13px;background:#0a1116;
}
.wit .wname{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--blue)}
.wit .wtext{font-size:13.5px;color:#cfe0e2;margin-top:6px;line-height:1.55}
.wit .wtag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:2px;margin-top:8px}

/* Lie panel */
.lie-panel{background:rgba(255,46,58,.04);border:1px solid var(--red-d);border-radius:4px;padding:10px;margin-bottom:12px}
.lie-panel .lie-title{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--red);margin-bottom:8px}
.lie-btn{
  font-size:12px;text-align:left;background:#1a0c0f;border:1px solid var(--red-d);
  color:#ffb3b7;padding:9px 11px;border-radius:3px;cursor:pointer;transition:.14s;
  min-height:42px;display:block;width:100%;margin-bottom:5px;line-height:1.35;
}
.lie-btn:hover{border-color:var(--red);color:var(--red);background:#22090c}
.lie-btn.used{opacity:.55}

.cred-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:8px}
.cred-bar .cbar{flex:1;height:6px;background:#0a1015;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.cred-bar .cfill{height:100%;background:linear-gradient(90deg,#7a0b12,#ff2e3a,#2bff9e);transition:width .5s ease}
.cred-bar .ctag{color:var(--red)}

.reaction-tag{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;
  padding:3px 8px;border-radius:2px;margin-bottom:6px;
}
.reaction-tag.calm{color:var(--green);border:1px solid var(--green-d);background:rgba(43,255,158,.05)}

.dialogue-panel{display:flex;flex-direction:column;min-height:420px}

.qbtn .qdelta.pos{color:var(--amber)}

.qbtn .qdelta.zero{color:var(--dim)}

.toast{

.toast.red{border-color:var(--red-d);border-left-color:var(--red);color:var(--red)}

.toast.purple{border-color:#4a2c7a;border-left-color:var(--purple);color:var(--purple)}
.toast.aqua{border-color:var(--aqua-d);border-left-color:var(--aqua);color:var(--aqua)}

.row{display:flex;gap:10px;flex-wrap:wrap}

.mt10{margin-top:10px}.mt16{margin-top:16px}.mt24{margin-top:24px}

      confront:{ivan:{panic:10, es:'Nunca he visto ese cuchillo. Yo uso uno más grande para cortar cuerdas.', en:'I\'ve never seen that knife. I use a bigger one for cutting ropes.'},paula:{panic:6, es:'Ese cuchillo no es mío. ¿Por qué me lo muestras a mí?', en:'That knife isn\'t mine. Why are you showing it to me?'},ruben:{panic:8, es:'No es del staff. El staff no usa cuchillos.', en:'It\'s not from the staff. The staff doesn\'t use knives.'},nadia:{panic:8, es:'Empuñadura envuelta en cinta negra. Eso es para no dejar huellas. Fue planeado.', en:'Handle wrapped in black tape. That\'s to avoid leaving prints. It was planned.'},tomas:{panic:8, es:'No lo había visto nunca. No es de nadie del club.', en:'I\'d never seen it before. It\'s not from anyone at the club.'}}},
    E03:{num:'03',cat:'catPhysical',name:{es:'Peluca rubia sintética',en:'Synthetic blonde wig'},desc:{es:'Hallada en el filtro de la piscina. Rubia, larga. Sintética. Talla única. Cabello largo, sedoso.',en:'Found in the pool filter. Blonde, long. Synthetic. One size. Long, silky hair.'},
      confront:{ivan:{panic:14, es:'¿Una peluca? No sé nada de eso. Yo no uso pelucas.', en:'A wig? I don\'t know anything about that. I don\'t wear wigs.'},paula:{panic:18, es:'Yo soy rubia natural. Esa peluca no es mía.', en:'I\'m a natural blonde. That wig isn\'t mine.'},ruben:{panic:8, es:'Alguien la tiró al filtro. El filtro está en la sala de máquinas. Casi nadie entra ahí.', en:'Someone threw it in the filter. The filter is in the machine room. Almost nobody goes in there.'},nadia:{panic:10, es:'La peluca es clave. Y el hecho de que estuviera en el filtro significa que quien la tiró conocía el sistema.', en:'The wig is key. And the fact that it was in the filter means whoever threw it knew the system.'},tomas:{panic:10, es:'Yo vi algo rubio en el fondo. Pero pensé que era una toalla.', en:'I saw something blonde in the back. But I thought it was a towel.'}}},
    E04:{num:'04',cat:'catPhysical',name:{es:'Traje de baño femenino',en:'Women\'s swimsuit'},desc:{es:'Enterizo negro de talla grande. Hallado junto a la peluca en el filtro. La talla es incompatible con la complexión de Paula Vidal, pero compatible con la de un hombre de complexión atlética media.',en:'Black one-piece swimsuit, large size. Found with the wig in the filter. Size is incompatible with Paula Vidal\'s build, but compatible with a man of medium athletic build.'},
      confront:{ivan:{panic:16, es:'No sé qué decirte. La talla es grande. Es la talla que usaría una persona más alta que Paula.', en:'I don\'t know what to tell you. The size is large. It\'s the size someone taller than Paula would use.'},paula:{panic:14, es:'Ese traje no es mío. Yo uso talla pequeña. Ese es grande.', en:'That swimsuit isn\'t mine. I wear a small size. That\'s large.'},ruben:{panic:10, es:'Parece un traje que se compró específicamente para esto.', en:'It looks like a swimsuit bought specifically for this.'},nadia:{panic:12, es:'Un hombre se puso ese traje. Con la peluca. Y con el resto del disfraz.', en:'A man put on that swimsuit. With the wig. And with the rest of the disguise.'},tomas:{panic:10, es:'Yo vi a alguien con un traje así. Pero pensé que era una mujer.', en:'I saw someone with a swimsuit like that. But I thought it was a woman.'}}},
    E05:{num:'05',cat:'catDigital',name:{es:'Registro de compra de maquillaje',en:'Makeup purchase record'},desc:{es:'Una tienda de disfraces reportó la compra de maquillaje resistente al agua y una peluca rubia sintética tres días antes del evento. Pago en efectivo. Sin cámara.',en:'A costume shop reported the purchase of waterproof makeup and a synthetic blonde wig three days before the event. Cash payment. No camera.'},
      confront:{ivan:{panic:12, es:'No compré nada en ninguna tienda de disfraces.', en:'I didn\'t buy anything at any costume shop.'},paula:{panic:8, es:'Yo no compré nada. Nunca he necesitado disfrazarme.', en:'I didn\'t buy anything. I\'ve never needed to disguise myself.'},ruben:{panic:8, es:'No sé quién pudo comprar eso. Pero alguien lo planeó con días de antelación.', en:'I don\'t know who could have bought that. But someone planned it days in advance.'},nadia:{panic:10, es:'Tres días antes. Con efectivo. Alguien no quería dejar rastro.', en:'Three days before. With cash. Someone didn\'t want to leave a trace.'},tomas:{panic:8, es:'No sabía nada de esa compra.', en:'I didn\'t know anything about that purchase.'}}},
    E06:{num:'06',cat:'catTimeline',contradiction:true,name:{es:'Registro de ausencia de Iván',en:'Iván\'s absence log'},desc:{es:'El puesto de Iván Sotelo estuvo desatendido entre las 14:45 y las 14:53. Los registros del sistema de socorrismo no muestran ninguna revisión de filtros ni emergencia autorizada en ese periodo.',en:'Iván Sotelo\'s post was unattended between 14:45 and 14:53. The lifeguard system logs show no filter inspection or authorized emergency during that period.'},
      confront:{ivan:{panic:25, es:'Está bien. Salí. Fui a la sala de filtros. Ya lo dije.', en:'Fine. I went out. I went to the filter room. I already said that.'},paula:{panic:8, es:'Iván salió de su puesto justo antes. Y volvió justo después.', en:'Iván left his post right before. And came back right after.'},ruben:{panic:6, es:'Iván salió ocho minutos. Lo vi desde la cabina.', en:'Iván was gone eight minutes. I saw him from the booth.'},nadia:{panic:10, es:'Iván salió de su puesto. Y volvió justo después del grito. Eso me llamó la atención.', en:'Iván left his post. And came back right after the scream. That caught my attention.'},tomas:{panic:8, es:'Iván salió de su puesto. Yo lo vi.', en:'Iván left his post. I saw him.'}}},
    E07:{num:'07',cat:'catWitness',name:{es:'Testimonio: "mujer rubia"',en:'Witness: "blonde woman"'},desc:{es:'Tres testigos describen a una mujer rubia cerca de la escalera norte entre 14:48 y 14:53. Las descripciones varían: una dice "alta", otra "media", otra "con hombros anchos".',en:'Three witnesses describe a blonde woman near the north ladder between 14:48 and 14:53. Descriptions vary: one says "tall", another "medium", another "broad shoulders".'},
      confront:{ivan:{panic:14, es:'Sí. La vi. Mujer rubia. Con toalla. Hacia el fondo.', en:'Yes. I saw her. Blonde woman. With a towel. Toward the back.'},paula:{panic:16, es:'No fui yo. Estaba en el vestuario con testigos.', en:'It wasn\'t me. I was in the locker room with witnesses.'},ruben:{panic:12, es:'Vi a alguien con gorra. Pero no a una mujer rubia.', en:'I saw someone with a cap. But not a blonde woman.'},nadia:{panic:14, es:'Yo vi a una mujer rubia. Y también vi a alguien con gorra. Y estoy confundida.', en:'I saw a blonde woman. And I also saw someone with a cap. And I\'m confused.'},tomas:{panic:12, es:'Yo vi a una mujer rubia con toalla. Hacia el fondo.', en:'I saw a blonde woman with a towel. Toward the back.'}}},
    E08:{num:'08',cat:'catWitness',name:{es:'Testimonio: "persona con gorra de staff"',en:'Witness: "person with staff cap"'},desc:{es:'Dos testigos describen a una persona con gorra de staff y gafas oscuras caminando rápido hacia la orilla norte. La persona llevaba una toalla cubriéndole los hombros y caminaba con paso decidido.',en:'Two witnesses describe a person with a staff cap and dark sunglasses walking fast toward the north edge. The person carried a towel over their shoulders and walked with a determined step.'},
      confront:{ivan:{panic:16, es:'Esa descripción... parece alguien del staff. Pero no sé quién.', en:'That description... looks like someone from the staff. But I don\'t know who.'},paula:{panic:12, es:'Yo no vi a nadie con gorra. Estaba en el vestuario.', en:'I didn\'t see anyone with a cap. I was in the locker room.'},ruben:{panic:14, es:'Sí. Vi a alguien con gorra de staff. Alta. Caminaba rápido.', en:'Yes. I saw someone with a staff cap. Tall. Walking fast.'},nadia:{panic:16, es:'Yo también vi a esa persona. Y también vi a la mujer rubia. No entiendo cómo pueden ser dos personas distintas.', en:'I also saw that person. And I also saw the blonde woman. I don\'t understand how they can be two different people.'},tomas:{panic:12, es:'Vi a alguien con gorra. Alta. Con la toalla al hombro.', en:'I saw someone with a cap. Tall. With the towel on their shoulder.'}}},
    E09:{num:'09',cat:'catDigital',name:{es:'Cuaderno de Diego',en:'Diego\'s notebook'},desc:{es:'Hallado en el casillero de Diego. Contiene nombres, fechas y anotaciones sobre múltiples personas del club. Cada persona tiene una página con detalles íntimos.',en:'Found in Diego\'s locker. Contains names, dates and notes about multiple people from the club. Each person has a page with intimate details.'},
      confront:{ivan:{panic:14, es:'El cuaderno. Tenía mi nombre. Lo vi una vez. Por eso salí de mi puesto esa tarde.', en:'The notebook. It had my name. I saw it once. That\'s why I left my post that afternoon.'},paula:{panic:18, es:'El cuaderno tenía mi nombre. Y fotos mías. Diego amenazaba a todos con él.', en:'The notebook had my name. And photos of me. Diego threatened everyone with it.'},ruben:{panic:12, es:'El cuaderno. Tenía mi nombre. Y la deuda.', en:'The notebook. It had my name. And the debt.'},nadia:{panic:14, es:'El cuaderno. Tenía nombres. Muchos. Diego lo usaba para manipular a todos.', en:'The notebook. It had names. Many. Diego used it to manipulate everyone.'},tomas:{panic:16, es:'El cuaderno tenía mi nombre. Y cosas que le conté a Diego. Cosas que no debería haberle contado.', en:'The notebook had my name. And things I told Diego. Things I shouldn\'t have told him.'}}},
    E10:{num:'10',cat:'catBehavioral',name:{es:'El patrón de la peluca',en:'The wig pattern'},desc:{es:'Análisis del pelo sintético de la peluca revela que estaba cortada con un patrón que imita el corte de Paula Vidal. Las fotos del Instagram de Paula fueron utilizadas como referencia. La peluca no solo ocultaba, también imitaba.',en:'Analysis of the wig\'s synthetic hair reveals it was cut to imitate Paula Vidal\'s hairstyle. Paula\'s Instagram photos were used as reference. The wig didn\'t just hide — it imitated.'},
      confront:{ivan:{panic:20, es:'Eso no lo sabía. Alguien copió el aspecto de Paula. Eso es... eso es horrible.', en:'I didn\'t know that. Someone copied Paula\'s appearance. That\'s... that\'s horrible.'},paula:{panic:25, es:'¿Usaron mi aspecto? ¿Alguien se disfrazó de MÍ? Eso significa que quien lo hizo me conocía. Íntimamente.', en:'They used my appearance? Someone disguised themselves as ME? That means whoever did it knew me. Intimately.'},ruben:{panic:14, es:'Nadie del staff haría eso. Es demasiado específico.', en:'No one from the staff would do that. It\'s too specific.'},nadia:{panic:16, es:'La peluca imitaba a Paula. Eso descarta a Paula como sospechosa. Fue diseñada para incriminarla.', en:'The wig imitated Paula. That rules Paula out as a suspect. It was designed to frame her.'},tomas:{panic:16, es:'¿Alguien se disfrazó de Paula? Eso significa que quien lo hizo la conoce muy bien.', en:'Someone disguised themselves as Paula? That means whoever did it knows her very well.'}}},
    E11:{num:'11',cat:'catDigital',name:{es:'Fotos de Paula en el teléfono de Iván',en:'Paula\'s photos on Iván\'s phone'},desc:{es:'El teléfono de Iván Sotelo contiene 47 fotos de Paula Vidal descargadas del Instagram público, más 6 fotos privadas que nunca se publicaron. También contiene una nota con medidas y tallas.',en:'Iván Sotelo\'s phone contains 47 photos of Paula Vidal downloaded from public Instagram, plus 6 private photos that were never posted. It also contains a note with measurements and sizes.'},
      confront:{ivan:{panic:30, es:'No... no, eso no significa nada. Yo tenía fotos suyas. Estábamos juntos. Es normal.', en:'No... no, that doesn\'t mean anything. I had photos of her. We were together. It\'s normal.'},paula:{panic:20, es:'¿Fotos privadas? Esas fotos solo las tenía Diego. Y yo. Iván nunca las vio.', en:'Private photos? Those photos only Diego and I had. Iván never saw them.'},ruben:{panic:16, es:'Eso conecta a Iván con la peluca.', en:'That connects Iván with the wig.'},nadia:{panic:16, es:'47 fotos públicas más 6 privadas. Y una nota con medidas. Eso no es un novio celoso. Eso es preparación.', en:'47 public photos plus 6 private. And a note with measurements. That\'s not a jealous boyfriend. That\'s preparation.'},tomas:{panic:14, es:'Iván tenía fotos de Paula. Y medidas. Eso es... eso es muy raro.', en:'Iván had photos of Paula. And measurements. That\'s... that\'s very strange.'}}},
    E12:{num:'12',cat:'catDigital',name:{es:'Silbato de Iván',en:'Iván\'s whistle'},desc:{es:'El silbato reglamentario de Iván Sotelo fue hallado junto al cuerpo, en el fondo de la piscina. Su ausencia del cuello durante los minutos críticos coincide con la ventana del asesinato.',en:'Iván Sotelo\'s regulation whistle was found next to the body, at the bottom of the pool. Its absence from his neck during the critical minutes matches the murder window.'},
      confront:{ivan:{panic:30, es:'¿Mi silbato? No... yo lo tenía. Lo perdí. Pero no en la piscina.', en:'My whistle? No... I had it. I lost it. But not in the pool.'},paula:{panic:14, es:'El silbato de Iván junto al cuerpo. Eso lo pone en el lugar.', en:'Iván\'s whistle next to the body. That places him at the scene.'},ruben:{panic:16, es:'El silbato de Iván. En el fondo. Junto a Diego.', en:'Iván\'s whistle. At the bottom. Next to Diego.'},nadia:{panic:14, es:'El silbato se le cayó al inclinarse. Al agacharse para atacar.', en:'The whistle fell when he leaned down. When he bent to attack.'},tomas:{panic:12, es:'El silbato de Iván. Sí. Es suyo. Lo reconozco.', en:'Iván\'s whistle. Yes. It\'s his. I recognize it.'}}},
    E13:{num:'13',cat:'catDigital',contradiction:true,name:{es:'Instagram como referencia',en:'Instagram as reference'},desc:{es:'Un análisis forense de la peluca y el traje revela fibras compatibles con el apartamento de Iván Sotelo. Además, la peluca fue cortada imitando exactamente una foto específica de Paula en Instagram, publicada la semana anterior.',en:'Forensic analysis of the wig and swimsuit reveals fibers compatible with Iván Sotelo\'s apartment. Furthermore, the wig was cut to exactly imitate a specific Instagram photo of Paula, posted the previous week.'},
      confront:{ivan:{panic:30, es:'Está bien. Yo compré la peluca. Copié una foto de Paula. Pero no la maté. Solo quería... asustarlo.', en:'Fine. I bought the wig. I copied a photo of Paula. But I didn\'t kill him. I just wanted to... scare him.'},paula:{panic:20, es:'Iván copió mi aspecto. Eso lo dice todo.', en:'Iván copied my appearance. That says everything.'},ruben:{panic:16, es:'Es Iván. Las fibras son del apartamento de Iván.', en:'It\'s Iván. The fibers are from Iván\'s apartment.'},nadia:{panic:18, es:'La peluca fue hecha para que todos pensáramos en Paula. Fue diseñada para engañar a la multitud.', en:'The wig was made so we would all think of Paula. It was designed to deceive the crowd.'},tomas:{panic:14, es:'Iván. Fue Iván.', en:'Iván. It was Iván.'}}},
    E14:{num:'14',cat:'catHidden',contradiction:true,name:{es:'Fuga de información: ubicación del cuerpo',en:'Information leak: body location'},desc:{es:'La ubicación exacta del cuerpo —junto a la escalera metálica norte, con el cuchillo en el desagüe cercano— nunca fue revelada públicamente. Sin embargo, durante los interrogatorios, una persona corrigió la versión oficial con precisión forense.',en:'The exact location of the body — next to the north metal ladder, with the knife in the nearby drain — was never publicly revealed. However, during interrogation, one person corrected the official version with forensic precision.'},
      confront:{ivan:{panic:25, es:'Está bien. Lo sé porque estuve ahí. Vi a Diego caer. Fui a revisar. Y ya estaba en el agua. Y yo me llevé el cuchillo. Pero no lo maté. Solo lo escondí.', en:'Fine. I know because I was there. I saw Diego fall. I went to check. And he was already in the water. And I took the knife. But I didn\'t kill him. I just hid it.'},paula:{panic:14, es:'No sabía la ubicación exacta. Solo lo que se dijo públicamente.', en:'I didn\'t know the exact location. Only what was publicly said.'},ruben:{panic:14, es:'Yo solo sé lo que vi cuando llegué. El cuerpo ya estaba en el agua.', en:'I only know what I saw when I arrived. The body was already in the water.'},nadia:{panic:12, es:'Yo estaba cerca. Pero no vi el cuchillo. Solo el cuerpo.', en:'I was nearby. But I didn\'t see the knife. Only the body.'},tomas:{panic:12, es:'No sabía nada del cuchillo. Solo que había pasado algo.', en:'I didn\'t know anything about the knife. Only that something had happened.'}}}
  },

  timeline:[

    {id:'t2', time:'13:30 PM', order:2, start:true, text:{es:'Diego Navarro llega como invitado de honor.', en:'Diego Navarro arrives as guest of honor.'}},
    {id:'t3', time:'14:15 PM', order:3, start:true, text:{es:'Diego discute con Paula Vidal junto al vestuario. Grita. Ella también grita.', en:'Diego argues with Paula Vidal near the locker room. He yells. She yells too.'}},
    {id:'t4', time:'14:30 PM', order:4, start:true, text:{es:'Diego da su discurso. La multitud lo aplaude.', en:'Diego gives his speech. The crowd applauds.'}},
    {id:'t5', time:'14:45 PM', order:5, req:'E06', crit:true, text:{es:'Iván Sotelo abandona su puesto de salvavidas. No registra inspección ni emergencia.', en:'Iván Sotelo leaves his lifeguard post. No inspection or emergency logged.'}},
    {id:'t6', time:'14:48 PM', order:6, req:'E07', crit:true, text:{es:'Tres testigos ven a una "mujer rubia" cerca de la escalera norte.', en:'Three witnesses see a "blonde woman" near the north ladder.'}},
    {id:'t7', time:'14:50 PM', order:7, req:'E08', text:{es:'Dos testigos ven a una "persona con gorra de staff" caminando rápido hacia la orilla norte.', en:'Two witnesses see a "person with staff cap" walking fast toward the north edge.'}},
    {id:'t8', time:'14:55 PM', order:8, start:true, crit:true, text:{es:'VENTANA DEL ASESINATO. Grito. Salpicadura. La multitud reacciona.', en:'MURDER WINDOW. Scream. Splash. The crowd reacts.'}},
    {id:'t9', time:'14:56 PM', order:9, start:true, crit:true, text:{es:'El cuerpo de Diego Navarro es hallado en el agua, junto a la escalera metálica norte.', en:'Diego Navarro\'s body is found in the water, next to the north metal ladder.'}},
    {id:'t10', time:'14:57 PM', order:10, req:'E06', crit:true, text:{es:'Iván Sotelo regresa a su puesto de salvavidas.', en:'Iván Sotelo returns to his lifeguard post.'}},
    {id:'t11', time:'15:00 PM', order:11, req:'E03', crit:true, text:{es:'Alguien vacía el filtro de la piscina. Una peluca rubia y un traje de baño femenino desaparecen de la escena.', en:'Someone empties the pool filter. A blonde wig and a women\'s swimsuit disappear from the scene.'}},
    {id:'t12', time:'15:30 PM', order:12, req:'E01', crit:true, text:{es:'La policía llega al lugar. La piscina es cerrada.', en:'Police arrive. The pool is shut down.'}}
  ],

  fileSections:{
    S01:{title:{es:'FRAGMENTO 01 — DISFRAZ DESCONOCIDO',en:'FRAGMENT 01 — UNKNOWN DISGUISE'},body:{es:'Los testigos no coinciden. "Mujer rubia alta." "Mujer rubia media." "Persona con gorra." "Alguien con toalla." Las descripciones no encajan entre sí. Todavía no sabemos qué llevaba el asesino.', en:'Witnesses don\'t agree. "Tall blonde woman." "Medium blonde woman." "Person with a cap." "Someone with a towel." The descriptions don\'t match. We still don\'t know what the killer wore.'}},
    S02:{title:{es:'FRAGMENTO 02 — DESCRIPCIÓN PARCIAL',en:'FRAGMENT 02 — PARTIAL DESCRIPTION'},body:{es:'Dos detalles se repiten: pelo rubio y una toalla. Eso es todo. Puede ser una mujer rubia, o un hombre con peluca rubia. La toalla es la clave: quien fuera, la usó para cubrirse los hombros. Los hombros anchos.', en:'Two details repeat: blonde hair and a towel. That\'s it. It could be a blonde woman, or a man with a blonde wig. The towel is the key: whoever it was used it to cover their shoulders. Broad shoulders.'}},
    S03:{title:{es:'FRAGMENTO 03 — COMPONENTES DEL DISFRAZ',en:'FRAGMENT 03 — DISGUISE COMPONENTS'},body:{es:'Peluca rubia sintética. Traje de baño femenino talla grande. Maquillaje resistente al agua. Todo hallado o rastreado. Todo comprado con días de antelación. Con efectivo. Sin cámaras. Alguien planeó esto con calma.', en:'Synthetic blonde wig. Large women\'s swimsuit. Waterproof makeup. All found or traced. All bought days in advance. With cash. No cameras. Someone planned this carefully.'}},
    S04:{title:{es:'FRAGMENTO 04 — EL ENGAÑO',en:'FRAGMENT 04 — THE DECEPTION'},body:{es:'La peluca no era genérica. Estaba cortada imitando el aspecto de Paula Vidal. Fotos de su Instagram fueron usadas como referencia. El asesino no solo se ocultó: se disfrazó de otra persona. Y esa persona tenía coartada.', en:'The wig wasn\'t generic. It was cut to imitate Paula Vidal\'s appearance. Photos from her Instagram were used as reference. The killer didn\'t just hide — they disguised themselves as someone else. And that someone had an alibi.'}},
    S05:{title:{es:'FRAGMENTO 05 — RECONSTRUCCIÓN COMPLETA',en:'FRAGMENT 05 — FULL RECONSTRUCTION'},body:{es:'Iván Sotelo, salvavidas del evento, conocido del club, con acceso a la sala de filtros y al sistema de la piscina.\n\nMotivo: Diego estaba chantajeando a Paula, su pareja secreta. Iván decidió terminar con eso.\n\nPlan: Iván compró el disfraz tres días antes. Copió el aspecto de Paula para que todos culparan a la ex pareja.\n\nEjecución: Salió de su puesto a las 14:45. Se cambió en la sala de filtros. Se acercó a Diego disfrazado. Lo apuñaló. Se deshizo del disfraz en el filtro. Volvió a su puesto a las 14:57.\n\nError: dejó su silbato en el fondo de la piscina. Y cuando fue interrogado, corrigió la ubicación exacta del cuerpo —información no pública.', en:'Iván Sotelo, event lifeguard, known at the club, with access to the filter room and the pool system.\n\nMotive: Diego was blackmailing Paula, his secret partner. Iván decided to end it.\n\nPlan: Iván bought the disguise three days in advance. He copied Paula\'s appearance so everyone would blame the ex-partner.\n\nExecution: He left his post at 14:45. He changed in the filter room. He approached Diego disguised. He stabbed him. He disposed of the disguise in the filter. He returned to his post at 14:57.\n\nMistake: he left his whistle at the bottom of the pool. And when interrogated, he corrected the exact location of the body — non-public information.'}}
  },

const SETTINGS_KEY = 'cfu_settings';
const SAVE_PREFIX = 'cfu_case_';

function freshSuspects(caseData){
  const out = {};
  Object.keys(caseData.suspects).forEach(sid=>{
    out[sid] = { panic:0, suspicion:30, asked:{} };
  });
  return out;
}
function freshCaseState(caseId){
  const cd = CASES[caseId];
  const state = {
    caseId: caseId,
    screen:'dashboard',
    score: 0,
    evidence: [],
    contradictions: [],
    leads: [],
    fileSections: [],
    askedLeads: [],
    timeline: [],
    fired: {},
    logs: {},
    currentSuspect: null,
    caseTab: 'victim',
    suspects: freshSuspects(cd),
    ending: null,
    accused: null,
    started: false,
    decoded: []
  };
  if(cd.hasLies){
    state.credibility = 100;
    state.pressure = 0;
    state.usedLies = [];
    state.reactions = {};
  }
  if(cd.finalReconstruction){
    state.reconstruction = {};
    state.reconstructionDone = false;
  }
  return state;
}
function freshGlobalSettings(){
  return {
    lang: localStorage.getItem('cfu_lang') || 'es',
    sound: true
  };
}
let gameState = {
  screen: 'menu',
  currentCaseId: null,
  settings: freshGlobalSettings(),
  caseStates: {}
};
function currentCase(){ return gameState.currentCaseId ? CASES[gameState.currentCaseId] : null; }
function currentCaseState(){
  if(!gameState.currentCaseId) return null;
  if(!gameState.caseStates[gameState.currentCaseId]){
    gameState.caseStates[gameState.currentCaseId] = freshCaseState(gameState.currentCaseId);
  }
  return gameState.caseStates[gameState.currentCaseId];
}
Object.defineProperty(gameState, 'lang', { get(){ return this.settings.lang; } });
Object.defineProperty(gameState, 'sound', { get(){ return this.settings.sound; }, set(v){ this.settings.sound = v; } });

function saveCase(caseId){
  if(!caseId) return;
  try{
    const st = gameState.caseStates[caseId];
    localStorage.setItem(SAVE_PREFIX + caseId, JSON.stringify(st));
  }catch(e){}
}
function saveSettings(){
  try{
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameState.settings));
    localStorage.setItem('cfu_lang', gameState.settings.lang);
  }catch(e){}
}
function loadCase(caseId){
  try{
    const raw = localStorage.getItem(SAVE_PREFIX + caseId);
    if(!raw) return null;
    const st = JSON.parse(raw);
    if(!st.suspects) st.suspects = freshSuspects(CASES[caseId]);
    if(!st.logs) st.logs = {};
    if(!st.decoded) st.decoded = [];
    const cd = CASES[caseId];
    if(cd && cd.hasLies){
      if(typeof st.credibility !== 'number') st.credibility = 100;
      if(typeof st.pressure !== 'number') st.pressure = 0;
      if(!st.usedLies) st.usedLies = [];
      if(!st.reactions) st.reactions = {};
    }
    if(cd && cd.finalReconstruction){
      if(!st.reconstruction) st.reconstruction = {};
      if(typeof st.reconstructionDone !== 'boolean') st.reconstructionDone = false;
    }
    return st;
  }catch(e){ return null; }
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      gameState.settings = Object.assign(freshGlobalSettings(), s);
    }
    const l = localStorage.getItem('cfu_lang');
    if(l) gameState.settings.lang = l;
  }catch(e){}
}
function resetCaseProgress(caseId){
  try{ localStorage.removeItem(SAVE_PREFIX + caseId); }catch(e){}
  delete gameState.caseStates[caseId];
}

let audioCtx = null;
function ac(){
  if(!gameState.settings.sound) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}
function tone(freq, dur, type, vol, delay){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.05, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function panicBand(p){ if(p<=25) return 0; if(p<=50) return 1; if(p<=75) return 2; if(p<=99) return 3; return 4; }
function panicStatusKey(p){
  if(p<=25) return 'stCalm';
  if(p<=50) return 'stUneasy';
  if(p<=75) return 'stNervous';
  if(p<=99) return 'stPanicked';
  return 'stBreaking';
}
function blockBar(p){
  const n = Math.max(0, Math.min(10, Math.round(p/10)));
  return '█'.repeat(n) + '░'.repeat(10-n);
}
function pick(arr, band){ if(!arr||!arr.length) return t('nothingToSay'); return arr[Math.min(band, arr.length-1)]; }
function fmt(str, obj){
  let out = str;
  Object.keys(obj||{}).forEach(k=>{ out = out.split('{'+k+'}').join(obj[k]); });
  return out;
}
function toast(msg, kind){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind?(' '+kind):'');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, 3400);
}
function addScore(n, silent){
  const cs = currentCaseState();
  if(!cs) return;
  cs.score = Math.max(0, cs.score + n);
  if(!silent){
    if(n>0) toast(fmt(t('scorePlus'), {n:n}), '');
    else if(n<0) toast(fmt(t('scoreMinus'), {n:n}), 'red');
  }
  updateTopbar();
}
function adjustPressure(n){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd || !cd.hasLies) return;
  cs.pressure = Math.max(0, Math.min(100, (cs.pressure||0) + n));
}
function addEvidence(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return false;
  if(cs.evidence.includes(id)) return false;
  const e = cd.evidence[id];
  if(!e) return false;
  cs.evidence.push(id);
  if(e.contradiction && !cs.contradictions.includes(id)) cs.contradictions.push(id);
  if(e.contradiction) SFX.contradiction(); else SFX.ev();
  toast(t('evDiscovered') + ' — #' + e.num, e.contradiction ? 'red' : '');
  addScore(10, true);
  if(e.contradiction){
    setTimeout(()=>toast(t('contradictionDetected'), 'red'), 400);
    addScore(15, true);
  }
  adjustPressure(-5);
  cd.timeline.forEach(tl=>{ if(tl.req===id && !cs.timeline.includes(tl.id)) cs.timeline.push(tl.id); });
  updateFileSections();
  saveCase(cd.id);
  return true;
}
function updateFileSections(){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const maps = {
    case001:{S01:'E03', S02:'E04', S03:'E05', S04:'E06'},
    case002:{S01:'E08', S02:'E05', S03:'E06', S04:'E07'},
    case003:{S01:'E03', S02:'E04', S03:'E05', S04:'E06'},
    case004:{S01:'E07', S02:'E08', S03:'E04', S04:'E10', S05:'E14'}
  };
  const activeMap = maps[cd.id] || {};
  Object.keys(activeMap).forEach(s=>{
    if(cs.evidence.includes(activeMap[s]) && !cs.fileSections.includes(s)){
      cs.fileSections.push(s);
    }
  });
}
function addLead(id){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  if(cs.leads.includes(id)) return;
  const ld = cd.leads[id];
  if(!ld) return;
  cs.leads.push(id);
  raiseSuspicion(ld.target, 8);
  SFX.lead();
  toast(t('newLead'), 'amber');
}
function raiseSuspicion(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  s.suspicion = Math.max(0, Math.min(100, s.suspicion + n));
}
function addPanic(sid, n){
  const cs = currentCaseState();
  if(!cs || !cs.suspects[sid]) return;
  const s = cs.suspects[sid];
  const before = s.panic;
  s.panic = Math.max(0, Math.min(100, s.panic + n));
  if(s.panic > before && n > 0){
    SFX.panic();
    raiseSuspicion(sid, Math.round(n/3));
  } else if(s.panic < before && n < 0){
    SFX.calm();
  }
  checkBreaks(sid);
}
function checkBreaks(sid){
  const cs = currentCaseState(); const cd = currentCase();
  if(!cs || !cd) return;
  const list = cd.breaks[sid] || [];
  const p = cs.suspects[sid].panic;
  list.forEach((b, i)=>{
    const key = sid + '_' + i;
    if(p >= b.at && !cs.fired[key]){
      cs.fired[key] = true;
      if(b.msg) pushLog(sid, {kind:'sys', text:b.msg, cls:'amber'});
      if(b.ev){
        const isNew = addEvidence(b.ev);
        if(isNew && b.lie){
          setTimeout(()=>toast(t('lieDetected'), 'red'), 500);
          addScore(20, true);
        }
      }
      if(b.lead) addLead(b.lead);
      if(b.confession){
        pushLog(sid, {kind:'sys', text:{es:'CONFESIÓN DESBLOQUEADA — '+cd.suspects[sid].name+' ha dicho todo lo que sabe.', en:'CONFESSION UNLOCKED — '+cd.suspects[sid].name+' has said everything they know.'}, cls:''});
        toast(t('confessionUnlocked'), '');
        addScore(25, true);
      }
    }
  });
}
function pushLog(sid, entry){
  const cs = currentCaseState();
  if(!cs) return;
  if(!cs.logs[sid]) cs.logs[sid] = [];
  cs.logs[sid].push(entry);
}

  if(!st || !st.started) return 'available';

  return 'progress';
}

/* ==== Interrogation ==== */
function viewInterrogation(){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  if(!sid){ cs.screen='suspects'; return viewSuspects(); }
  const p = cd.suspects[sid];
  const s = cs.suspects[sid];
  const critical = s.panic >= 76;

  const qs = cd.questions.filter(q=>{
    if(q.only && !q.only.includes(sid)) return false;
    if(q.cond === 'contradictions' && cs.contradictions.length === 0) return false;
    if(q.reqEv && !cs.evidence.includes(q.reqEv)) return false;
    if(q.reqLead && !cs.leads.includes(q.reqLead)) return false;
    if(q.minPanic !== undefined && s.panic < q.minPanic) return false;
    if(q.maxPanic !== undefined && s.panic > q.maxPanic) return false;
    return true;
  });
  const qHtml = qs.map(q=>{
    const times = s.asked[q.id]||0;
    const cls = 'qbtn' + (times?' used':'') + (q.id.indexOf('q_lead_')===0?' lead':'');
    const pv = (typeof q.panic === 'number') ? q.panic : 0;
    const deltaCls = pv > 0 ? 'pos' : (pv < 0 ? 'neg' : 'zero');
    const deltaTxt = pv > 0 ? ('+'+pv) : (pv < 0 ? (''+pv) : '0');
    return `<button class="${cls}" data-act="ask" data-qid="${q.id}">
      <span class="qlabel">${esc(L(q.text))}${times?` <span class="dim">(${esc(t('interrogateAgain'))} ${times})</span>`:''}</span>
      <span class="qdelta ${deltaCls}">${deltaTxt}</span>
    </button>`;
  }).join('');

  const evHtml = cs.evidence.length
    ? cs.evidence.map(id=>{
        const e = cd.evidence[id];
        return `<button class="evbtn" data-act="confront" data-eid="${id}">#${e.num} ${esc(L(e.name))}</button>`;
      }).join('')
    : `<div class="dim small">${esc(t('noEvidenceYet'))}</div>`;

  let liesHtml = '';
  let credHtml = '';
  if(cd.hasLies){
    const cred = cs.credibility !== undefined ? cs.credibility : 100;
    const credCls = cred <= 20 ? 'red' : cred <= 40 ? 'amber' : '';
    credHtml = `
      <div class="cred-bar">
        <span>${esc(t('credibility'))}</span>
        <div class="cbar"><div class="cfill" style="width:${cred}%"></div></div>
        <span class="${credCls?'ctag':''}">${cred}%</span>
      </div>`;
    const lies = cd.lies || [];
    liesHtml = `<div class="lie-panel">
      <div class="lie-title">${esc(t('lieTitle'))} — ${esc(t('lieSubtitle'))}</div>
      ${credHtml}
      ${lies.map(l=>{
        const used = (cs.usedLies||[]).includes(l.id);
        const disabled = cred < 20 ? 'disabled' : '';
        return `<button class="lie-btn ${used?'used':''}" data-act="lie" data-lieid="${l.id}" ${disabled}>${esc(L(l.text))} <span class="dim">(-${l.cost})</span></button>`;
      }).join('')}
      ${cred < 20 ? `<div class="small" style="color:var(--red);margin-top:6px">⚠ ${esc(t('credBroken'))}</div>` : ''}
      ${cred >= 20 && cred <= 40 ? `<div class="small" style="color:var(--amber);margin-top:6px">⚠ ${esc(t('credWarning'))}</div>` : ''}
    </div>`;
  }

  const log = cs.logs[sid] || [];
  const logHtml = log.map((entry)=>{
    if(entry.kind === 'q'){
      const q = cd.questions.find(x=>x.id===entry.qid);
      const ans = p.answers[entry.qid];
      const txt = ans ? pick(ans[gameState.settings.lang]||ans.es, entry.band) : t('nothingToSay');
      return `<div class="msg player"><span class="who">${esc(t('questionsTitle'))}</span>${esc(q?L(q.text):entry.qid)}</div>
              <div class="msg suspect"><span class="who">${esc(p.name)}</span>${esc(txt)}</div>`;
    }
    if(entry.kind === 'c'){
      const e = cd.evidence[entry.eid];
      const resp = (e.confront && e.confront[sid]) ? L(e.confront[sid]) : t('nothingToSay');
      return `<div class="msg player"><span class="who">${esc(t('confrontation'))}</span>#${e.num} ${esc(L(e.name))}</div>
              <div class="msg suspect"><span class="who">${esc(p.name)}</span>${esc(resp)}</div>`;
    }
    if(entry.kind === 'lie'){
      const l = (cd.lies||[]).find(x=>x.id===entry.lieid);
      const reaction = entry.reaction || {};
      const rk = reaction.kind || 'calm';
      const reactionLabel = {
        calm:t('reactionCalm'), nervous:t('reactionNervous'), defensive:t('reactionDefensive'),
        angry:t('reactionAngry'), surprised:t('reactionSurprised'), corrective:t('reactionCorrective'),
        slip:t('reactionSlip'), contradiction:t('reactionContradiction'), leak:t('reactionLeak'),
        confused:t('reactionConfused')
      }[rk] || t('reactionCalm');
      return `<div class="msg player"><span class="who">${esc(t('lieTitle'))}</span>${esc(l?L(l.text):'…')}</div>
              <div class="msg suspect"><span class="who">${esc(p.name)}</span>
                <span class="reaction-tag ${rk==='leak'?'leak':rk==='slip'?'slip':rk}">${esc(reactionLabel)}</span><br>
                ${esc(reaction.text || t('nothingToSay'))}
              </div>
              ${rk==='leak' ? `<div class="msg system aqua">⚠ ${esc(t('infoLeak'))}<br>${esc(t('infoLeakDesc'))}</div>` : ''}`;
    }
    if(entry.kind === 'sys'){
      return `<div class="msg system ${entry.cls||''}">${esc(L(entry.text))}</div>`;
    }
    if(entry.kind === 'contra'){
      return `<div class="msg contradiction">⚠ ${esc(t('contradictionDetected'))}<br>${esc(L(entry.text))}</div>`;
    }
    return '';
  }).join('');

  const pressureHint = '';
  const caseHint = cd.id === 'case003'
    ? `<div class="small" style="color:var(--amber);font-family:var(--mono);letter-spacing:1px;margin-bottom:10px">${esc(t('pressureBalance'))} — ${esc(t('pressureBalanceHint'))}</div>`
    : (cd.id === 'case004'
        ? `<div class="small" style="color:var(--aqua);font-family:var(--mono);letter-spacing:1px;margin-bottom:10px">${esc(t('lieSubtitle'))} · ${esc(t('reactionAnalysis'))}</div>`
        : '');

  return `
  <div class="interro">
    <aside class="panel suspect-panel ${critical?'critical':''}">
      <div class="avatar" style="--acc:${p.color}">${esc(p.initials)}</div>
      <div class="sname" style="font-family:var(--mono);color:#fff;letter-spacing:2px">${esc(p.name)}</div>
      <div class="srow" style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px">
        <span>${esc(t('age'))}</span><b style="color:var(--txt)">${p.age}</b>
      </div>
      <div class="srow" style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px">
        <span>${esc(t('relationship'))}</span><b style="color:${p.color}">${esc(L(p.rel))}</b>
      </div>
      <div class="mlabel"><span>${esc(t('panic'))}</span><b>${s.panic}%</b></div>
      <div class="meter"><div class="fill panic" style="width:${s.panic}%"></div></div>
      <div class="barline panic mt10">[${blockBar(s.panic)}] ${s.panic}%</div>
      <div class="mlabel"><span>${esc(t('suspicion'))}</span><b>${s.suspicion}%</b></div>
      <div class="meter"><div class="fill susp" style="width:${s.suspicion}%"></div></div>
      <div class="barline susp mt10">[${blockBar(s.suspicion)}] ${s.suspicion}%</div>
      <div class="mt10" style="font-family:var(--mono);font-size:11px;letter-spacing:1px;color:${critical?'var(--red)':'var(--dim)'}">
        ${esc(t('status'))}: ${esc(t(panicStatusKey(s.panic)))}
      </div>
      ${cd.hasLies ? `<div class="mlabel" style="margin-top:14px"><span>${esc(t('casePressure'))}</span><b>${cs.pressure||0}%</b></div>
        <div class="meter"><div class="fill press" style="width:${cs.pressure||0}%"></div></div>` : ''}
      <button class="btn small mt16" data-act="suspects">${esc(t('backToSuspects'))}</button>
      <button class="btn small red mt10" data-act="accusescreen">${esc(t('accuseSuspect'))}</button>
    </aside>

    <section class="panel dialogue-panel">
      <div class="panel-title">${esc(t('interrogating'))}: ${esc(p.name)} <span class="dim">${esc(t('caseNo'))} #${cd.number}</span></div>
      ${caseHint}
      <div class="log" id="log">
        ${logHtml || `<div class="msg system">${esc(t('selectEvidence'))}</div>`}
      </div>
    </section>

    <aside class="panel action-panel">
      <div class="panel-title">${esc(t('questionsTitle'))}</div>
      <div class="qlist">${qHtml}</div>
      ${liesHtml}
      <div class="panel-title red">${esc(t('confrontTitle'))}</div>
      <div>${evHtml}</div>
    </aside>
  </div>`;
}

/* ==== Final Reconstruction screen (Case 004) ==== */
function viewReconstruction(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd || !cd.finalReconstruction) { gameState.screen='case'; return viewCaseScreen(); }
  const rec = cd.finalReconstruction;
  const state = cs.reconstruction || {};
  const blocks = Object.keys(rec).map(key=>{
    const blk = rec[key];
    const selected = state[key];
    const opts = blk.options.map(o=>{
      const cls = 'ropt' + (selected === o.id ? ' selected' : '');
      return `<button class="${cls}" data-act="recon-answer" data-rkey="${key}" data-rid="${o.id}">${esc(L(o.text))}</button>`;
    }).join('');
    return `<div class="rec-block">
      <div class="rq">${esc(L(blk.q))}</div>
      ${opts}
    </div>`;
  }).join('');
  const answered = Object.keys(rec).every(k=>state[k]);
  return `
  <div class="panel">
    <div class="panel-title aqua">${esc(t('finalReconstruction'))} <span class="dim">${esc(t('finalReconstructionSub'))}</span></div>
    <p class="small dim" style="margin-bottom:14px">${gameState.settings.lang==='es'
      ? 'Selecciona la respuesta correcta para cada bloque. Si fallas en alguna, la acusación no será convincente.'
      : 'Select the correct answer for each block. If you fail any, the accusation won\'t be convincing.'}</p>
    ${blocks}
  </div>
  <div class="row mt16">
    <button class="btn" data-act="casefile">${esc(t('backToCase'))}</button>
    <button class="btn aqua" data-act="recon-submit" ${answered?'':'disabled'}>${esc(t('reconSubmit'))}</button>
  </div>`;
}

  if(e === 'solved'){

    const evList = sol.keyEvidenceIds.map(id=>`<li>#${cd.evidence[id].num} — ${esc(L(cd.evidence[id].name))}</li>`).join('');
    return `

      </div>
    </div>
    <div class="panel">

      <p style="color:#cfe0e2">${esc(L(sol.motive))}</p>
    </div>
    <div class="panel">
      <div class="panel-title">${esc(t('keyEvidence'))}</div>
      <ul class="plain">${evList}</ul>
    </div>
    <div class="panel">
      <div class="panel-title red">${esc(t('keyContradiction'))}</div>

      <p class="mt10 dim small">${esc(t('finalReconstruction'))}: ${gameState.settings.lang==='es'?'Revisa el ARCHIVO DE LA MÁSCARA y la MULTITUD.':'Check the MASK FILE and CROWD tabs.'}</p>

    return `

/* ============================================================================
   ACTIONS
   ============================================================================ */
function openCase(caseId){
  gameState.currentCaseId = caseId;
  if(!gameState.caseStates[caseId]){
    const loaded = loadCase(caseId);
    gameState.caseStates[caseId] = loaded || freshCaseState(caseId);
  }
  const cs = gameState.caseStates[caseId];
  if(!cs.started){
    cs.started = true;
    cs.screen = 'dashboard';
    cs.caseTab = 'victim';
    const cd = CASES[caseId];
    ['E01','E02'].forEach(id=>{ if(!cs.evidence.includes(id)) cs.evidence.push(id); });
    cd.timeline.forEach(x=>{ if(x.start && !cs.timeline.includes(x.id)) cs.timeline.push(x.id); });
    saveCase(caseId);
  }
  gameState.screen = 'case';
  render();
  window.scrollTo({top:0, behavior:'auto'});
}
function doResetCase(caseId){
  resetCaseProgress(caseId);
  closeModal();
  if(gameState.currentCaseId === caseId){
    openCase(caseId);
  } else {
    gameState.screen = 'database';
    render();
  }
  toast(t('caseReset'), 'red');
}
function interrogate(sid){
  const cs = currentCaseState();
  cs.currentSuspect = sid;
  cs.screen = 'interrogation';
  if(!cs.logs[sid]) cs.logs[sid] = [];
  saveCase(cs.caseId);
  render();
  window.scrollTo({top:0, behavior:'auto'});
}
function askQuestion(qid){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  const s = cs.suspects[sid];
  const p = cd.suspects[sid];
  const q = cd.questions.find(x=>x.id===qid);
  if(!q) return;

  const askedBefore = s.asked[qid];
  const band = panicBand(s.panic);
  const ans = p.answers[qid];
  const panicEffect = (typeof q.panic === 'number') ? q.panic : 0;

  if(qid.indexOf('q_lead_') === 0){
    let leadId = null;
    if(qid === 'q_lead_adrian' || qid === 'q_lead_maya') leadId = 'L1';
    else if(qid === 'q_lead_valeria' || qid === 'q_lead_ethan') leadId = 'L2';
    else if(qid === 'q_lead_marcos' || qid === 'q_lead_victor') leadId = 'L3';
    else if(qid === 'q_lead_sofia') leadId = 'L4';
    else if(qid === 'q_lead_olivia') leadId = 'L1';
    else if(qid === 'q_lead_claire') leadId = 'L2';
    else if(qid === 'q_lead_ryan') leadId = 'L3';
    else if(qid === 'q_lead_nathan') leadId = 'L4';
    else if(qid === 'q_lead_ivan') leadId = 'L1';
    else if(qid === 'q_lead_paula') leadId = 'L2';
    else if(qid === 'q_lead_ruben') leadId = 'L3';
    if(leadId && !cs.askedLeads.includes(leadId)){
      cs.askedLeads.push(leadId);
      const ld = cd.leads[leadId];
      if(ld && ld.falseAccusation){ addScore(30, true); toast(t('falseAccusation'), 'amber'); }
      else { addScore(15, true); }
      if(ld) raiseSuspicion(ld.target, 10);
    }
  }

  let panicChange = 0;
  if(askedBefore === undefined){
    panicChange = panicEffect;
    s.asked[qid] = band;
  } else {
    if(panicEffect < 0){
      panicChange = Math.round(panicEffect * 0.5);
    } else if(panicEffect > 0){
      if(band > askedBefore){
        panicChange = Math.round(panicEffect * 0.6);
        s.asked[qid] = band;
      } else {
        addScore(-5, true);
        toast(t('irrelevant'), 'red');
        adjustPressure(3);
        panicChange = 0;
      }
    }
  }

  pushLog(sid, {kind:'q', qid:qid, band:band});
  if(panicChange !== 0) addPanic(sid, panicChange);
  SFX.click();

  if(qid==='q_motive' || qid==='q_hiding') raiseSuspicion(sid, 3);

  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}

function confront(eid){
  const cd = currentCase(); const cs = currentCaseState();
  const sid = cs.currentSuspect;
  const e = cd.evidence[eid];
  if(!e) return;
  const conf = e.confront && e.confront[sid];
  pushLog(sid, {kind:'c', eid:eid});
  if(conf){
    addPanic(sid, conf.panic);
    if(conf.panic >= 20) raiseSuspicion(sid, 12);
    else if(conf.panic >= 10) raiseSuspicion(sid, 6);
    SFX.contradiction();
    adjustPressure(-2);
  }else{
    pushLog(sid, {kind:'sys', text:{es:'No hay reacción significativa.', en:'No significant reaction.'}, cls:''});
    SFX.warn();
    adjustPressure(2);
  }
  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}

function decodeTransmission(txid){
  const cd = currentCase(); const cs = currentCaseState();
  const tx = cd.transmissions.find(x=>x.id===txid);
  if(!tx) return;
  if(cs.decoded.includes(txid)) return;
  if(tx.decodeReq && !cs.evidence.includes(tx.decodeReq)){
    toast(t('fileLockedMsg'), 'red');
    return;
  }
  cs.decoded.push(txid);
  SFX.decode();
  toast(t('transmissionDecoded') + ' — ' + txid, 'purple');
  addScore(15, true);
  saveCase(cd.id);
  render();
}

/* ==== LIE mechanic (Case 004) ==== */
function useLie(lieId){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd.hasLies) return;
  const sid = cs.currentSuspect;
  const lie = (cd.lies||[]).find(l=>l.id===lieId);
  if(!lie) return;
  if((cs.usedLies||[]).includes(lieId)){
    // Ya usada: costo reducido y reacción genérica
    cs.credibility = Math.max(0, (cs.credibility||100) - Math.round(lie.cost * 0.5));
    pushLog(sid, {kind:'sys', text:{es:'El sospechoso ya escuchó esa mentira. No vuelve a caer.', en:'The suspect already heard that lie. They won\'t fall for it again.'}, cls:'red'});
    saveCase(cd.id); render(); return;
  }
  if((cs.credibility||100) < 20){
    toast(t('credBroken'), 'red');
    return;
  }
  cs.usedLies = cs.usedLies || [];
  cs.usedLies.push(lieId);
  cs.credibility = Math.max(0, (cs.credibility||100) - lie.cost);
  adjustPressure(5);

  const reaction = (lie.reactions && lie.reactions[sid]) || { kind:'calm', text:{es:'…', en:'…'} };
  let rk = reaction.kind || 'calm';

  // Fuga de información: si el sospechoso es el asesino y la mentira toca un punto ciego
  // (información no pública), detectar leak.
  const isKiller = (sid === cd.murderer);
  let leakTriggered = false;
  if(isKiller && (lie.id === 'lie_footage' || lie.id === 'lie_notebook' || lie.id === 'lie_affair')){
    rk = 'leak';
    leakTriggered = true;
  }

  pushLog(sid, {kind:'lie', lieid:lieId, reaction:{kind:rk, text:reaction.text}});

  // Efectos
  if(rk === 'leak'){
    SFX.leak();
    toast(t('infoLeak'), 'aqua');
    addScore(20, true);
    adjustPressure(-10);
    // Desbloquea la evidencia clave de fuga si aún no está
    if(!cs.evidence.includes('E14')){
      addEvidence('E14');
    }
  } else if(rk === 'slip'){
    SFX.contradiction();
    addScore(10, true);
    adjustPressure(-3);
  } else if(rk === 'nervous' || rk === 'defensive'){
    addPanic(sid, 8);
  } else if(rk === 'angry'){
    addPanic(sid, 12);
    adjustPressure(3);
  } else if(rk === 'corrective'){
    addPanic(sid, 6);
    addScore(5, true);
    adjustPressure(-2);
  } else if(rk === 'surprised'){
    addPanic(sid, 10);
  }
  // calma/confusión → sin efecto adicional

  saveCase(cd.id);
  render();
  const log = $('log'); if(log) log.scrollTop = log.scrollHeight;
}

/* ==== Final reconstruction submit ==== */
function reconAnswer(rkey, rid){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd.finalReconstruction) return;
  cs.reconstruction = cs.reconstruction || {};
  cs.reconstruction[rkey] = rid;
  SFX.click();
  saveCase(cd.id);
  render();
}
function reconSubmit(){
  const cd = currentCase(); const cs = currentCaseState();
  if(!cd.finalReconstruction) return;
  const rec = cd.finalReconstruction;
  const state = cs.reconstruction || {};
  let correct = 0, total = 0;
  Object.keys(rec).forEach(key=>{
    total++;
    const blk = rec[key];
    const selectedId = state[key];
    const selectedOpt = blk.options.find(o=>o.id===selectedId);
    if(selectedOpt && selectedOpt.correct) correct++;
  });
  cs.reconstructionDone = true;
  if(correct === total){
    addScore(50, true);
    SFX.perfect();
    toast(t('reconComplete'), 'aqua');
    // Ir directamente a la pantalla de acusación
    cs.screen = 'accuse';
    saveCase(cd.id);
    render();
    window.scrollTo({top:0, behavior:'auto'});
  } else {
    addScore(-15, true);
    SFX.wrong();
    toast(t('reconIncomplete') + ' (' + correct + '/' + total + ')', 'red');
    saveCase(cd.id);
    render();
    window.scrollTo({top:0, behavior:'auto'});
  }
}

function confirmAccusation(sid){
  closeModal();
  const cd = currentCase(); const cs = currentCaseState();
  cs.accused = sid;
  const enough = cs.evidence.length >= cd.minEvidence && cs.contradictions.length >= cd.minContradictions;
  if(!enough){
    addScore(-10, true);
    cs.ending = 'insufficient';
    gameState.screen = 'ending';
    SFX.wrong();
    saveCase(cd.id);
    render();
    window.scrollTo({top:0, behavior:'auto'});
    return;
  }
  // Caso 004: chequear si la reconstrucción fue completa
  if(cd.finalReconstruction){
    const rec = cd.finalReconstruction;
    const state = cs.reconstruction || {};
    let allCorrect = true;
    Object.keys(rec).forEach(key=>{
      const blk = rec[key];
      const sel = blk.options.find(o=>o.id===state[key]);
      if(!sel || !sel.correct) allCorrect = false;
    });
    if(!allCorrect){
      // Si acusó a la persona correcta pero la reconstrucción falló → incomplete
      if(sid === cd.murderer){
        cs.ending = 'incomplete';
        gameState.screen = 'ending';
        SFX.wrong();
        saveCase(cd.id);
        render();
        window.scrollTo({top:0, behavior:'auto'});
        return;
      }
    } else {
      // Reconstrucción perfecta
      if(sid === cd.murderer){
        cs.ending = 'perfect';
        addScore(50, true);
        SFX.perfect();
        saveCase(cd.id);
        gameState.screen = 'ending';
        render();
        window.scrollTo({top:0, behavior:'auto'});
        return;
      }
    }
  }
  if(sid === cd.murderer){
    cs.ending = 'solved';
    addScore(50, true);
    SFX.solved();
  }else{
    cs.ending = 'wrong';
    SFX.wrong();
  }
  gameState.screen = 'ending';
  saveCase(cd.id);
  render();
  window.scrollTo({top:0, behavior:'auto'});
}

/* ============================================================================
   EVENT DELEGATION
   ============================================================================ */
document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-act]');
  const langBtn = ev.target.closest('#langMenu button');
  if(langBtn){ setLang(langBtn.dataset.lang); return; }
  if(ev.target.closest('#langBtn')){
    $('langMenu').classList.toggle('open');
    return;
  }
  if(!$('langMenu').contains(ev.target) && !ev.target.closest('#langBtn')){
    $('langMenu').classList.remove('open');
  }
  if(ev.target.closest('#soundBtn')){
    gameState.settings.sound = !gameState.settings.sound;
    saveSettings();
    updateTopbar();
    if(gameState.settings.sound) SFX.click();
    return;
  }
  if(ev.target.closest('#menuBtn')){
    if(gameState.screen !== 'menu'){
      gameState.screen = 'menu';
      render();
      window.scrollTo({top:0, behavior:'auto'});
    }
    SFX.click();
    return;
  }
  if(!el) return;
  const act = el.dataset.act;
  const cd = currentCase(); const cs = currentCaseState();

  switch(act){
    case 'menu':      SFX.click(); gameState.screen = 'menu'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'database':  SFX.click(); gameState.screen = 'database'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'instructions': SFX.click(); gameState.screen = 'instructions'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'understood': SFX.click(); gameState.screen = 'menu'; render(); window.scrollTo({top:0,behavior:'auto'}); break;
    case 'open-case':
      SFX.click();
      openCase(el.dataset.cid);
      break;
    case 'reset-case':
      SFX.click();
      modalResetCase(gameState.currentCaseId);
      break;
    case 'do-reset':
      doResetCase(el.dataset.cid);
      break;
    case 'cancel':
      SFX.click(); closeModal(); break;
    case 'suspects':
    case 'go-suspects':
      SFX.click();
      if(cs){ cs.screen = 'suspects'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'casefile':
      SFX.click();
      if(cs){ cs.screen = 'dashboard'; cs.caseTab = 'victim'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'tab':
      SFX.click();
      if(cs){ cs.caseTab = el.dataset.tab; saveCase(cd.id); }
      render();
      break;
    case 'interrogate':
      SFX.click();
      interrogate(el.dataset.sid);
      break;
    case 'ask':
      askQuestion(el.dataset.qid);
      break;
    case 'confront':
      confront(el.dataset.eid);
      break;
    case 'lie':
      useLie(el.dataset.lieid);
      break;
    case 'decode':
      decodeTransmission(el.dataset.txid);
      break;
    case 'accusescreen':
      SFX.click();
      if(cs){ cs.screen = 'accuse'; saveCase(cd.id); }
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'accuse':
      SFX.click();
      modalAccuse(el.dataset.sid);
      break;
    case 'confirm-accuse':
      confirmAccusation(el.dataset.sid);
      break;
    case 'reconstruction':
      SFX.click();
      gameState.screen = 'reconstruction';
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'recon-answer':
      reconAnswer(el.dataset.rkey, el.dataset.rid);
      break;
    case 'recon-submit':
      reconSubmit();
      break;
    case 'review':
      SFX.click();
      if(cs){ cs.screen = 'dashboard'; cs.caseTab = 'evidence'; cs.ending = null; saveCase(cd.id); }
      gameState.screen = 'case';
      render();
      window.scrollTo({top:0,behavior:'auto'});
      break;
    case 'restart':
      SFX.click();
      modalResetCase(gameState.currentCaseId);
      break;
  }
});

/* ============================================================================
   MOBILE / TOUCH
   ============================================================================ */
function detectTouch(){
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  document.body.classList.toggle('is-touch', isTouch);
}
let lastTouchEnd = 0;
document.addEventListener('touchend', function(ev){
  const now = Date.now();
  if(now - lastTouchEnd <= 300){
    if(!ev.target.closest('input, textarea, select')){
      ev.preventDefault();
    }
  }
  lastTouchEnd = now;
}, {passive:false});
let orientationTimer = null;
function handleOrientation(){
  if(orientationTimer) clearTimeout(orientationTimer);
  orientationTimer = setTimeout(()=>{ if(gameState.screen === 'case') render(); }, 250);
}
window.addEventListener('orientationchange', handleOrientation);
if(window.matchMedia){
  try{
    window.matchMedia('(orientation: portrait)').addEventListener('change', handleOrientation);
    window.matchMedia('(orientation: landscape)').addEventListener('change', handleOrientation);
  }catch(e){}
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    document.documentElement.style.setProperty('--vh', (window.visualViewport.height*0.01)+'px');
  });
  document.documentElement.style.setProperty('--vh', (window.visualViewport.height*0.01)+'px');
}
$('modalRoot').addEventListener('click', function(ev){
  if(ev.target === $('modalRoot')){ closeModal(); }
});
document.addEventListener('touchstart', function(ev){
  const lm = $('langMenu');
  if(lm && lm.classList.contains('open')){
    if(!lm.contains(ev.target) && !ev.target.closest('#langBtn')){
      lm.classList.remove('open');
    }
  }
}, {passive:true});

async function checkForUpdates(){
  try{
    const response = await fetch('./version.json?t=' + Date.now());
    if(!response.ok) return;
    const data = await response.json();
    if(data.version && data.version !== CURRENT_VERSION){
      showUpdateNotification(data);
    }
  }catch(e){
    console.log("Could not check for updates.");
  }
}
function showUpdateNotification(update){
  if(document.getElementById('updateNotification')) return;
  const escHtml = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const wrap = document.createElement('div');
  wrap.id = 'updateNotification';
  wrap.innerHTML = `
    <div style="
      position: fixed; top: 20px; right: 20px;
      width: 320px; max-width: calc(100vw - 40px);
      padding: 20px; background: #0b1116; color: #fff;
      border: 1px solid #00e5ff; border-radius: 8px;
      z-index: 99999; font-family: 'Courier New', monospace;
      box-shadow: 0 0 30px rgba(0,229,255,.35), 0 0 20px rgba(0,0,0,.6);
    ">
      <div style="font-size:16px;font-weight:bold;margin-bottom:10px;color:#00e5ff;letter-spacing:1px">
        🔔 UPDATE AVAILABLE
      </div>
      <div style="margin-bottom:6px;font-size:12px;color:#b9cbcd">
        Current: <b>${escHtml(CURRENT_VERSION)}</b>
      </div>
      <div style="margin-bottom:12px;font-size:12px;color:#b9cbcd">
        New: <b style="color:#ffb020">${escHtml(update.version)}</b>
      </div>
      <div style="font-size:12px;opacity:.85;margin-bottom:15px;color:#9fb3b6;line-height:1.5">
        ${escHtml(update.latest_update || "New update available.")}
      </div>
      <button onclick="location.reload()" style="
        padding:10px 15px;cursor:pointer;background:#0d141a;color:#00e5ff;
        border:1px solid #006b7a;border-radius:4px;
        font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;width:100%;
      ">UPDATE NOW</button>
    </div>
  `;
  document.body.appendChild(wrap);
}

/* ============================================================================
   INIT
   ============================================================================ */
(function init(){
  detectTouch();
  loadSettings();
  updateTopbar();
  render();
  document.addEventListener('pointerdown', function once(){
    ac();
    document.removeEventListener('pointerdown', once);
  }, {once:true});
  setTimeout(checkForUpdates, 1500);
})();
</script>
</body>
</html>
